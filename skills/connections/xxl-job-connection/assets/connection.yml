schemaVersion: buildr.connection-definition/v1
definitionId: xxl-job
name: XXL-JOB
description: 执行器发现、服务关联、任务准备与受控操作、调度记录及日志读取。
category: scheduling
systemId: xxl-job
configVersion: 1
config:
  fields:
    - key: consoleUrl
      label: 网站地址
      type: url
      required: true
      maxLength: 2048
    - key: production
      label: 生产环境
      description: 每次生产实际创建、修改、启停或触发须展示具体目标与差异，取得此次用户授权。
      type: boolean
      default: false
    - key: apiVersion
      label: 接口版本
      type: enum
      values: [auto, "2.3.0"]
      default: auto
authentication:
  fields:
    - key: username
      label: 用户名
      type: string
      required: true
      minLength: 1
      maxLength: 128
    - key: password
      label: 密码
      type: secret
      required: true
  targetFields: [consoleUrl]
programs:
  cli:
    kind: bundled
    runtime: node
    entry: scripts/xxl-job-client.mjs
    contextProtocol: buildr.connection-context/v1
    dependencies:
      - executable: node
        version:
          args: [--version]
          constraint: ">=24.15.0"
      - executable: buildr
    installHint: 服务与专业操作依赖已安装的 Buildr，使用 buildr assets inspect 核对登记；开发验证将候选入口加入隔离 PATH。
hooks:
  test:
    program: cli
    args: [test, --json]
    effect: read
  executors:
    program: cli
    args: [executors, --json]
    effect: read
    inputs: [config.consoleUrl, authentication.username, authentication.password]
presentation:
  categoryLabel: 调度系统
  methodLabel: Buildr 标准接入
  summaryFields: [consoleUrl]
  websiteField: consoleUrl
  groups:
    - id: connection
      title: 连接信息
      fields: [config.consoleUrl, authentication.username, authentication.password, config.production]
    - id: advanced
      title: 高级设置
      fields: [config.apiVersion]
      collapsed: true
