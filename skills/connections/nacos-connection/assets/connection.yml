schemaVersion: buildr.connection-definition/v1
definitionId: nacos
name: Nacos
description: 命名空间发现、完整配置读取、比较及受控发布。
category: configuration
systemId: nacos
configVersion: 2
config:
  fields:
    - key: apiBaseUrl
      label: 接口基址
      description: 实际管理接口及认证目标，包含准确端口与根路径；不从网站地址推断。
      type: url
      required: true
      maxLength: 2048
    - key: consoleUrl
      label: 网站地址
      description: 可选人工网站入口，可以与接口使用不同主机、端口和路径。
      type: url
      maxLength: 2048
    - key: namespaceId
      label: 命名空间（Namespace）编号
      type: select
      default: public
      optionsFrom: namespaces
      maxLength: 255
    - key: defaultGroup
      label: 默认分组（Group）
      type: string
      default: DEFAULT_GROUP
      minLength: 1
      maxLength: 128
    - key: apiVersion
      label: 接口版本
      type: enum
      values: [auto, v1, v2, v3]
      default: auto
    - key: production
      label: 生产环境
      description: 生产实际发布须展示具体目标与差异，并取得此次用户授权。
      type: boolean
      default: false
authentication:
  fields:
    - key: username
      label: 用户名
      type: string
      required: true
      minLength: 1
      maxLength: 128
    - key: password
      label: 密码
      type: secret
      required: true
  targetFields: [apiBaseUrl]
programs:
  cli:
    kind: bundled
    runtime: node
    entry: scripts/nacos-client.mjs
    contextProtocol: buildr.connection-context/v1
    dependencies:
      - executable: node
        version:
          args: [--version]
          constraint: ">=24.15.0 <25"
hooks:
  test:
    program: cli
    args: [test, --json]
    effect: read
  namespaces:
    program: cli
    args: [namespaces, --json]
    effect: read
    inputs: [config.apiBaseUrl, authentication.username, authentication.password]
presentation:
  categoryLabel: 配置系统
  methodLabel: Buildr 标准接入
  summaryFields: [apiBaseUrl, namespaceId, defaultGroup]
  websiteField: consoleUrl
  groups:
    - id: connection
      title: 连接信息
      fields: [config.apiBaseUrl, config.consoleUrl, authentication.username, authentication.password, config.production]
    - id: scope
      title: 使用范围
      fields: [config.namespaceId]
    - id: advanced
      title: 高级设置
      fields: [config.defaultGroup, config.apiVersion]
      collapsed: true
