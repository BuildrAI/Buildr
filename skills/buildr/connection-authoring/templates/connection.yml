schemaVersion: buildr.connection-definition/v1
definitionId: example
name: 组织示例
description: 制作后替换为真实能力说明
category: configuration
systemId: example
configVersion: 1
config:
  fields:
    - { key: website, label: 网站地址, type: url, required: true }
    - { key: scope, label: 模拟业务范围, type: select, optionsFrom: scopes }
authentication:
  # 系统只允许个人账号时声明 allowedSources: [personal]；省略保持团队与个人兼容。
  fields:
    - { key: username, label: 用户名, type: string, required: true, minLength: 1 }
    - { key: password, label: 密码, type: secret, required: true }
  targetFields: [website]
programs:
  cli:
    kind: bundled
    runtime: node
    entry: scripts/client.mjs
    contextProtocol: buildr.connection-context/v1
hooks:
  test: { program: cli, args: [test], effect: read }
  scopes: { program: cli, args: [discover], effect: read, inputs: [config.website] }
presentation:
  categoryLabel: 配置系统
  methodLabel: 组织标准接入
  groups:
    - id: access
      title: 访问方式
      fields: [config.website, authentication.username, authentication.password]
    - id: scope
      title: 模拟业务范围
      fields: [config.scope]
  summaryFields: [website]
  websiteField: website
  # 双地址方法可增加 websiteFallbackField: apiBaseUrl；须先声明该 url 配置字段。
