schemaVersion: buildr.skills/v3
skills:
  - id: task-triage
    assetIdentity: buildr:skill:task-triage
    sourceIdentity: package:skills/buildr/task-triage
    source: buildr
    path: buildr/task-triage
    description: 用户提出修复、实现、重构、优化、文档/测试或契约语义调整，或询问任务应走代码修改、当前事实维护还是 OpenSpec Change 时使用。
    enabled: true
    required: false
    state: installed
    runtimes:
      - claude-code
      - codex
      - cursor
      - qoder
      - trae
      - trae-work
      - workbuddy
    runtimePath: task-triage
    requires:
      - capability: buildr.task-record
        version: 2
        mode: optional
      - capability: buildr.git-operations
        version: 1
        mode: optional
      - capability: buildr.current-knowledge-maintenance
        version: 2
        mode: optional
      - capability: buildr.task-environment
        version: 1
        mode: optional
  - id: task-worktree
    assetIdentity: buildr:skill:task-worktree
    sourceIdentity: package:skills/buildr/task-worktree
    source: buildr
    path: buildr/task-worktree
    description: 用户明确要求创建、检查或清理 Task 的 Git worktree 与本地任务分支，或 Task Environment 需要 Git checkout provider 时使用；不负责环境 ready、恢复、Runtime、资源或总 cleanup。
    enabled: true
    required: false
    state: installed
    runtimes:
      - claude-code
      - codex
      - cursor
      - qoder
      - trae
      - trae-work
      - workbuddy
    runtimePath: task-worktree
    provides:
      - capability: buildr.git-worktree-provider
        version: 1
  - id: git-operations
    assetIdentity: buildr:skill:git-operations
    sourceIdentity: package:skills/buildr/git-operations
    source: buildr
    path: buildr/git-operations
    description: 用户或上游智能体（Agent）已明确选择仓库（repository）、Git 操作（Git Operation）与相关引用（ref）时使用，包括无活跃任务（active Task）的直接 Git 收尾和正式任务（formal Task）的直接交付；执行 fetch、commit、push、commit+push、rebase，或检查授权、安全边界和结果证据（result evidence）；不替 Agent 选择策略，也不扩展完整 Git 命令集。
    enabled: true
    required: false
    state: installed
    runtimes:
      - claude-code
      - codex
      - cursor
      - qoder
      - trae
      - trae-work
      - workbuddy
    runtimePath: git-operations
    provides:
      - capability: buildr.git-operations
        version: 1
  - id: task-finish
    assetIdentity: buildr:skill:task-finish
    sourceIdentity: package:skills/buildr/task-finish
    source: buildr
    path: buildr/task-finish
    description: 用户要求收尾、交付或完成本轮工作后的结束动作时使用；由智能体完成实际成果交付、已有任务结果登记及安全善后，支持有无 Buildr 任务、有无 Git 管理。
    enabled: true
    required: false
    state: installed
    runtimes:
      - claude-code
      - codex
      - cursor
      - qoder
      - trae
      - trae-work
      - workbuddy
