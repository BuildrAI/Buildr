    source: openspec
    path: openspec/openspec-archive-change
    description: 用户明确要归档已完成 OpenSpec change 时使用。
    enabled: true
    required: false
    state: installed
    runtimes:
      - claude-code
      - codex
      - cursor
      - qoder
      - trae
      - trae-work
      - workbuddy
    runtimePath: openspec-archive-change
  - id: task-board
    assetIdentity: buildr:skill:task-board
    sourceIdentity: package:skills/buildr/task-board
    source: buildr
    path: buildr/task-board
    description: 为跨批次、跨 change、跨团队或跨会话的复杂任务创建或更新只读任务看板；用户明确要求任务看板、整体进度、长期跟踪或使用旧称“任务驾驶舱”时也使用。简单任务不使用。
    enabled: true
    required: false
    state: installed
    runtimes:
