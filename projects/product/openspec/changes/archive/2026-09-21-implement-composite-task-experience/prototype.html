const stateLabels={active:'进行中',todo:'待办',completed:'已完成',abandoned:'已放弃'};function badge(s){return `<span class="state ${s}">${stateLabels[s]}</span>`}function associated(){return data.filter(t=>t.owner==='parent')}function unfinished(){return associated().filter(t=>['active','todo'].includes(t.state))}function task(id){return data.find(t=>t.id===id)}function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2500)}

function parentTabs(){return `<div class="path">${[['overview','组合概览'],['tasks',`子任务 ${associated().length}`],['plan','目标与方案'],['finish','整体收尾']].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${t}</button>`).join('')}<span class="end"></span>${!closed?'<button class="text" onclick="openAdd()">＋ 添加子任务</button>':''}</div>`}
function taskRows(full=false){let a=associated().filter(t=>filter==='all'||(filter==='open'?['active','todo'].includes(t.state):t.state===filter)).filter(t=>t.title.includes(q));return a.length?`<table class="children"><thead><tr><th>任务 / 目标</th><th>状态</th><th class="resultcol">进展 / 结果</th><th></th></tr></thead><tbody>${a.map(t=>`<tr class="${child===t.id?'selected':''}"><td><a class="tasktitle" href="#${t.id}" onclick="openChild('${t.id}');return false">${esc(t.title)}</a><p>${esc(t.goal)}</p></td><td>${badge(t.state)}</td><td class="resultcol result">${esc(t.result)}</td><td><button class="icon" aria-label="查看${esc(t.title)}" onclick="openChild('${t.id}')">↗</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><h2>${associated().length?'没有符合条件的子任务':'还没有子任务'}</h2><p>${associated().length?'可调整筛选条件查看其他任务。':'先明确整体目标，之后随时创建或关联任务。'}</p>${!associated().length&&!closed?'<button onclick="openAdd()">添加第一个子任务</button>':''}</div>`}
function overview(){const a=associated(),o=unfinished();return `<div class="reader">${counts()}<div class="attention"><b>${closed?'整体结果':o.length?'当前进展':a.length?'等待总体验收':'尚未拆分任务'}</b><p>${closed?esc(summary||'整体目标已核对完成。'):o.length?'当前仍有 '+o.length+' 项任务未结束，可查看最新进展或继续补充工作。':a.length?'子任务已结束，接下来对照整体目标核对成果与遗留。':'组合目标已保留，可随时添加第一项子任务。'}</p>${closed?'<button class="text small" onclick="setTab(\'finish\')">查看结果与剩余工作去向 →</button>':`<button class="text small" onclick="${o.length?"filter='open';setTab('tasks')":"startCompletion()"}">${o.length?'查看未结束子任务':'准备总体验收'} →</button>`}</div><div class="sectionhead"><h2>子任务与成果</h2><span class="counter">当前关联 ${a.length} 项</span><span class="grow"></span><button class="text small" onclick="filter='all';q='';setTab('tasks')">查看全部</button></div>${taskRows()}<p class="illustration-note">按当前关联统计，子任务可持续增加；不以完成比例推断整体目标是否达成。</p></div>`}
function tasksView(){return `<div class="reader"><div class="toolbar"><input aria-label="搜索子任务" placeholder="搜索子任务" value="${esc(q)}" oninput="searchChildren(this.value)"><select aria-label="子任务状态" onchange="filter=this.value;render()">${[['all','全部状态'],['open','未结束'],['completed','已完成'],['abandoned','已放弃']].map(([v,s])=>`<option value="${v}" ${v===filter?'selected':''}>${s}</option>`).join('')}</select><button onclick="showRelations()">管理关联</button></div>${taskRows(true)}<p class="illustration-note">点任务标题，在右侧“子任务详情”标签阅读；选择其他任务时复用该标签。</p></div>`}
function planView(){return `<nav class="directory"><h3>整体目标</h3><button class="${node==='goal'?'on':''}" onclick="node='goal';render()">范围与完成条件</button><h3>方案设计</h3><button class="${node==='plan'?'on':''}" onclick="node='plan';render()">任务拆分与安排</button><button class="${node==='decision'?'on':''}" onclick="node='decision';render()">用户确认</button></nav><div class="reader doc"><div class="filelabel">${node==='goal'?'任务目标':node==='plan'?'design.md':'用户确认 · 2026/9/21 17:22'}</div><h2>${node==='goal'?'范围与整体完成条件':node==='plan'?'任务拆分与动态补充':'确认工作范围'}</h2>${node==='goal'?'<p>重构两个服务的代码职责，建立地图、技术图与资料阅读路径。结构调整保持既有业务行为与公开接口。</p><h3>完成条件</h3><ul><li>代码职责清晰，适用验证通过。</li><li>用户能从地图定位功能、对象与调用。</li><li>知识文档与技术图能追溯当前实现。</li><li>明确剩余工作，核对整体成果并取得完成确认。</li></ul>':node==='plan'?'<p>计划是当前安排，可随调查和交付继续调整。新增工作以独立任务关联进来，不把任务数量冻结成完成标准。</p><h3>工作安排</h3><p>先完成代码结构与阅读基础，再校准测试框架说明与受影响的技术图。必要时补充知识来源说明。</p><h3>保持边界</h3><p>任务可以独立执行、独立结束。每项成果与状态以对应任务的当前记录为准。</p>':'<p>当前态模型与技术图按授权触发维护。后台持续监听、无人介入调度不属于此次目标。</p><p>若部分工作继续独立推进，需明确为何不再影响本组合目标，不能只凭移出任务就认为目标已完成。</p>'}</div>`}
function finishView(){return `<nav class="directory"><button class="on">${closed?'整体结果':'验收准备'}</button><button onclick="showHistory()">关联与处置记录</button></nav><div class="reader doc"><h2>${closed?'整体完成结果':'核对整体目标与成果'}</h2>${closed?`<p>${esc(summary)}</p><div class="surface"><h3>已确认完成组合任务</h3><p>仅按已确认的清单处理任务。继续推进的任务保留状态；结束、移出或转移均留有去向记录。</p></div><h3>子任务与剩余工作</h3>${history.map(h=>`<div class="summaryrow"><a href="#" onclick="openChild('${h.id}');return false">${esc(h.title)}</a><span>${esc(h.action)}</span></div>`).join('')||'<p>全部关联子任务已有独立结束记录。</p>'}`:`<p>当前 ${associated().length} 项子任务，${unfinished().length} 项未结束。可以先查看成果，也可以开始整理整体结果与剩余工作的处理方式。</p><div class="checkpoint"><span>①</span><div><b>核对剩余工作</b><p class="muted">继续独立推进、转入其他组合，或逐项明确结束。</p></div></div><div class="checkpoint"><span>②</span><div><b>说明整体结果</b><p class="muted">说明目标达成情况，以及剩余工作为何不影响此次完成。</p></div></div><div class="checkpoint"><span>③</span><div><b>确认具体变更</b><p class="muted">核对每项任务的处理方式，再确认组合任务完成。</p></div></div><button class="primary" style="margin-top:22px" onclick="startCompletion()">准备完成组合任务</button>`}</div>`}
function parentPane(){return `<section class="pane"><div class="tabbar"><button onclick="setView('list')">任务列表</button><button class="on"><i class="dot"></i>组合任务详情</button><span class="tools">${child?'已分屏阅读':'展开阅读'}</span></div><div class="content">${parentHeader()}${parentTabs()}<div class="reading">${tab==='overview'?overview():tab==='tasks'?tasksView():tab==='plan'?planView():finishView()}</div></div></section>`}
function childPane(){const t=task(child);if(!t)return '';return `<section class="pane child"><div class="tabbar"><button class="on"><i class="dot"></i>子任务详情</button><span class="tools"></span><button class="small" onclick="childExpanded=!childExpanded;render()">${childExpanded?'恢复分屏':'展开阅读'}</button><button aria-label="关闭子任务详情" onclick="closeChild()">×</button></div><div class="content"><div class="header"><div class="heading"><div class="grow"><div class="titleline"><h1>${esc(t.title)}</h1>${badge(t.state)}</div><div class="ident">${esc(t.id)}</div></div><button class="icon" title="刷新任务" onclick="toast('子任务示例已是最新状态')">⟳</button><button class="icon" aria-label="普通任务操作" onclick="childActions('${t.id}')">⋮</button></div><p class="goal">${esc(t.goal)}</p><div class="metadata"><span>项目： <a href="#" onclick="return false">product</a></span><span>服务： <a href="#" onclick="return false">buildr-web</a></span><span>最后更新 2026/9/21 17:22</span></div><div class="parentlink">${t.owner==='parent'?'所属组合：<button class="text small" onclick="toast(\'组合任务已保留在左侧\')">代码架构重构及当前态模型建设</button>':t.owner?'所属组合：优化知识维护体验':'未关联组合任务'} <button class="text small" style="margin-left:12px" onclick="association('${t.id}')">调整关联</button></div></div><div class="path">${['任务需求','方案设计','开发实现','任务收尾'].map(s=>`<button class="${s===childStage?'on':''}" onclick="childStage='${s}';render()">${s}</button>`).join('')}<button class="end text" onclick="checklist=!checklist;render()">☷ 实施清单</button></div><div class="reading ${checklist&&checkPinned?'check-pinned':''}"><nav class="directory">${(childStage==='方案设计'?['提案','设计','规范','方案审查']:childStage==='任务收尾'?['用户确认','交付结果']:childStage==='开发实现'?['实施记录','验证记录']:['任务目标','补充说明']).map(s=>`<button class="${childDoc===s?'on':''}" onclick="childDoc='${s}';docSource=false;render()">${s}</button>`).join('')}</nav><div class="reader doc"><div class="filelabel">${childStage==='方案设计'?'design.md':childStage==='任务收尾'?'任务结果':'任务材料'}<button class="text small" style="float:right" onclick="docSource=!docSource;render()">${docSource?'阅读正文':'查看原文'}</button></div>${docSource?`<pre style="white-space:pre-wrap">## ${esc(t.title)}\n\n${esc(t.goal)}\n\n### 当前记录\n${esc(t.result)}</pre>`:`<h2>${childStage==='任务收尾'?'任务结果':esc(t.title)}</h2><p>${esc(t.goal)}</p><h3>${childStage==='任务收尾'?'交付说明':'当前进展'}</h3><p>${esc(t.result)}</p><h3>工作边界</h3><p>保留当前任务的独立目标、状态和成果。关联组合任务仅建立工作归属，不替代本任务的验证与结果。</p><h3>阅读与接续</h3><p>保留页头与当前目录，在正文区域滚动阅读；关闭右侧后，左侧组合任务仍保留当前筛选与位置。</p>`}</div>${checklist?`<section class="checklist"><div class="checkhead"><b>实施清单</b><span class="grow"></span><button class="text small" onclick="checkPinned=!checkPinned;render()">${checkPinned?'取消固定':'固定'}</button><button class="icon" onclick="checklist=false;render()">×</button></div><div class="checkbody"><div class="filelabel">tasks.md</div><b>1. 当前工作</b><p>☑ 明确任务目标与影响范围</p><p>☑ 完成主要内容</p><p>${t.state==='completed'?'☑':'☐'} 核对适用验证与成果</p><b>2. 交付说明</b><p>${t.state==='completed'?'☑':'☐'} 记录结果与遗留</p></div></section>`:''}</div></div></section>`}
function listPane(){const rows=[{id:'parent',title:'代码架构重构及当前态模型建设',type:'composite',state:closed?'completed':'active',goal:'完成代码结构重构，建立可维护的地图、技术图与资料阅读入口。'},...data.map(t=>({...t,type:'ordinary'}))].filter(t=>listType==='all'||t.type===listType);return `<section class="pane"><div class="tabbar"><button class="on"><i class="dot"></i>任务列表</button></div><div class="content"><div class="heading"><h1>任务</h1><span class="counter">${rows.length} 个任务</span><span class="grow"></span><button onclick="showCreateOrdinary()">＋ 新任务</button></div><div class="toolbar" style="margin-top:24px"><span class="muted">任务类型</span><select aria-label="任务类型" onchange="listType=this.value;render()"><option value="all" ${listType==='all'?'selected':''}>全部类型</option><option value="ordinary" ${listType==='ordinary'?'selected':''}>普通任务</option><option value="composite" ${listType==='composite'?'selected':''}>组合任务</option></select><span class="grow"></span><span class="counter">全部状态</span></div><div class="listbody"><table class="tablelist"><thead><tr><th>任务</th><th>项目</th><th>状态</th></tr></thead><tbody>${rows.map(t=>`<tr><td><a href="#" class="title" onclick="${t.id==='parent'?"setView('parent')":`openChild('${t.id}')`};return false">${esc(t.title)}</a> ${t.type==='composite'?'<span class="pill">组合任务</span>':''}<p>${esc(t.goal)}</p>${t.type==='composite'?`<div class="badge-line">当前 ${associated().length} 项子任务 · ${unfinished().length} 项未结束</div>`:t.owner==='parent'?'<div class="small muted">所属组合：<a href="#" onclick="setView(\'parent\');return false">代码架构重构及当前态模型建设</a></div>':''}</td><td class="small muted">product</td><td>${badge(t.state)}</td></tr>`).join('')}</tbody></table></div></div></section>`}
function render(){const prior=$('.pane:not(.child) .reader');if(prior&&lastViewKey)scrollPositions[lastViewKey]=prior.scrollTop;const viewKey=view+':'+tab;const leftScroll=scrollPositions[viewKey]||0;lastViewKey=viewKey;$('#workspace').className='workspace'+(child?' split':'')+(childExpanded?' child-expanded':'');$('#workspace').innerHTML=(view==='list'?listPane():parentPane())+(child?childPane():'');const r=$('.pane:not(.child) .reader');if(r)r.scrollTop=leftScroll}
function searchChildren(value){q=value;const pos=$('[aria-label="搜索子任务"]').selectionStart;render();const e=$('[aria-label="搜索子任务"]');e.focus();e.setSelectionRange(pos,pos)}
function overlay(title,body,footer='',wide=false){$('#overlay').innerHTML=`<div class="scrim"><section class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="drawerheader"><h2>${title}</h2><span class="grow"></span><button aria-label="关闭窗口" onclick="closeOverlay()">×</button></div><div class="drawerbody">${body}</div>${footer?`<div class="drawerfooter">${footer}</div>`:''}</section></div>`;$('#overlay [aria-label="关闭窗口"]').focus()}
function closeOverlay(){$('#overlay').innerHTML='';modal=null;error=''}
function openAdd(){selected=[];addTab='existing';modal='add';renderAdd()}
function renderAdd(){overlay('添加子任务',`<p class="muted">新建任务会自动关联到当前组合；也可选择已有普通任务。</p><div class="subtabs"><button class="${addTab==='existing'?'on':''}" onclick="addTab='existing';renderAdd()">关联已有任务</button><button class="${addTab==='new'?'on':''}" onclick="addTab='new';renderAdd()">新建普通任务</button></div>${addTab==='existing'?`<div class="small muted">当前工作空间中的可关联任务</div>${candidates.filter(c=>!data.some(t=>t.id===c.id&&t.owner==='parent')).map(c=>`<label class="candidate"><input type="checkbox" ${c.owner?'disabled':''} ${selected.includes(c.id)?'checked':''} onchange="toggleCandidate('${c.id}',this.checked)"><div class="grow"><b>${c.title}</b><div class="desc">${c.owner?'所属组合：'+c.owner:c.goal}</div></div>${badge(c.state)}</label>`).join('')}<p class="illustration-note">已属于其他组合的任务需明确转移，不会同时建立两个所属关系。</p>`:`<label class="field">任务标题<input id="newtitle" placeholder="例如：补充知识资料来源说明"></label><label class="field">任务目标<textarea id="newgoal" placeholder="说明这项任务要完成什么"></textarea></label><div class="surface"><b>所属组合</b><p>代码架构重构及当前态模型建设</p><p class="muted">创建为待办，后续可独立启动和完成。</p></div>`}<div class="error" id="add-error"></div>`,`<span class="counter grow">${addTab==='existing'?'可一次关联多个任务':'创建后自动出现在子任务列表'}</span><button onclick="closeOverlay()">取消</button><button class="primary" onclick="submitAdd()">${addTab==='existing'?'关联所选任务':'创建并关联'}</button>`)}
function toggleCandidate(id,v){selected=v?[...selected,id]:selected.filter(x=>x!==id)}function submitAdd(){if(closed){$('#add-error').textContent='组合任务已结束，不能继续关联。';return}if(addTab==='new'){const title=$('#newtitle').value.trim(),goal=$('#newgoal').value.trim();if(!title||!goal){$('#add-error').textContent='请填写标题与目标。';return}data.push({id:'new-'+(++added),title,goal,state:'todo',result:'尚未开始。',owner:'parent'})}else{if(!selected.length){$('#add-error').textContent='请选择要关联的任务。';return}selected.forEach(id=>{const c=candidates.find(x=>x.id===id);const existing=task(id);if(existing)existing.owner='parent';else data.push({...c,owner:'parent'})})}version++;tab='tasks';filter='all';q='';render();closeOverlay();toast('已更新子任务列表（示例）')}
function association(id){const t=task(id);overlay('调整所属组合',`<h3>${esc(t.title)}</h3><p class="muted" style="margin-top:10px">当前：${t.owner==='parent'?'代码架构重构及当前态模型建设':t.owner?'优化知识维护体验':'未关联组合任务'}</p><label class="field">所属组合<select id="association"><option value="" ${!t.owner?'selected':''}>不关联，独立推进</option>${!closed?`<option value="parent" ${t.owner==='parent'?'selected':''}>代码架构重构及当前态模型建设</option>`:''}<option value="other" ${t.owner==='other'?'selected':''}>优化知识维护体验 · 进行中</option></select></label><label class="field">调整原因<textarea id="relation-reason" placeholder="说明移出或转移的原因"></textarea></label><p class="small muted">只调整所属关系，任务状态和已有结果保持不变。调整会留下记录。</p><div class="error" id="relation-error"></div>`,`<button onclick="closeOverlay()">取消</button><span class="grow"></span><button class="primary" onclick="saveAssociation('${id}')">保存关联</button>`)}
function saveAssociation(id){const reason=$('#relation-reason').value.trim();if(!reason){$('#relation-error').textContent='请说明调整原因。';return}const t=task(id),target=$('#association').value;t.owner=target;history.push({id,title:t.title,action:target==='parent'?'关联到当前组合':target?'转入其他组合':'移出后独立推进',reason});version++;render();closeOverlay();toast('关联已调整，任务状态保持不变（示例）')}
function showRelations(){overlay('管理子任务关联',`<p class="muted">移出任务不会删除任务；状态与成果保持不变。</p>${associated().map(t=>`<div class="candidate"><div class="grow"><b>${esc(t.title)}</b><div class="desc">${stateLabels[t.state]}</div></div><button onclick="association('${t.id}')">调整关联</button></div>`).join('')||'<div class="empty">当前没有关联任务。</div>'}`)}
function more(){overlay('组合任务操作',`<div style="display:grid;gap:12px">${closed?'<p class="muted">组合任务已结束；可查看成果或以剩余工作创建新任务。</p>':'<button onclick="openAdd()">添加子任务</button><button onclick="startCompletion()">完成组合任务</button>'}<button onclick="showHistory()">查看关联与处置记录</button></div>`)}
function childActions(id){overlay('普通任务操作',`<h3>${esc(task(id).title)}</h3><button style="margin-top:20px" onclick="association('${id}')">调整所属组合</button><p class="muted" style="margin-top:20px">普通任务保持现有独立工作路径。此原型重点演示关联与组合收尾。</p>`)}
function startCompletion(){if(closed)return;modal='completion';closeStep=1;draft={};summary='';confirmed=false;snapshot=version;error='';renderCompletion()}
const options=[['','选择处理方式'],['detach','继续独立推进'],['transfer','转入其他组合'],['abandon','放弃这项工作'],['complete','已做完，登记结果']];const actionLabel={detach:'移出组合，继续独立推进',transfer:'转入「优化知识维护体验」',abandon:'明确放弃',complete:'登记已完成'};
function setDisposition(id,value){draft[id]={...(draft[id]||{}),action:value};confirmed=false;renderCompletion()}
function renderCompletion(){modal='completion';const open=unfinished();overlay('完成组合任务',`<div class="steps"><${closeStep===1?'b':'span'}>1　处理剩余工作</${closeStep===1?'b':'span'}><span>→</span><${closeStep===2?'b':'span'}>2　核对并确认完成</${closeStep===2?'b':'span'}></div>${snapshot!==version?'<div class="notice">任务范围已变化，原确认已失效。请重新读取当前关联任务，再核对处理方式。</div>':''}${closeStep===1?`<h3>${open.length?'还有 '+open.length+' 项未结束任务':'所有子任务均已结束'}</h3><p class="muted" style="margin:8px 0">${open.length?'剩余工作不必全部放弃或强行标记完成。若仍属于本次必须达成的目标，应返回继续工作。':'仍需核对整体结果，子任务结束不会自动完成组合任务。'}</p>${open.length?'<div class="bulk"><span class="grow small">批量设置未结束任务</span><button onclick="bulkDetach()">全部继续独立推进</button></div>':''}${open.map(t=>{const d=draft[t.id]||{};return `<div class="processing"><div class="processing-head"><b class="grow">${esc(t.title)}</b>${badge(t.state)}<select aria-label="${esc(t.title)}处理方式" onchange="setDisposition('${t.id}',this.value)">${options.map(([v,l])=>`<option value="${v}" ${d.action===v?'selected':''}>${l}</option>`).join('')}</select></div><p>${esc(t.result)}</p>${d.action==='transfer'?'<div class="surface"><b>目标组合：优化知识维护体验 · 进行中</b><p>移入后仍保持原任务状态。</p></div>':''}${d.action?`<textarea aria-label="${esc(t.title)}处置说明" placeholder="${d.action==='complete'?'填写实际成果与验证依据；不能用批量操作代替真实完成':d.action==='abandon'?'说明不再继续的原因与未交付范围':'说明剩余工作为何不影响本次目标，以及后续去向'}" oninput="draft['${t.id}'].reason=this.value;confirmed=false">${esc(d.reason||'')}</textarea><div class="small muted">${d.action==='complete'?'将单独登记这项任务完成。':d.action==='abandon'?'将明确结束这项任务并保留原因。':'保留原状态、结果和历史，调整所属关系。'}</div>`:''}</div>`}).join('')}<label class="field">整体完成说明<textarea id="completion-summary" oninput="summary=this.value;confirmed=false" placeholder="本次达成了什么；哪些工作继续推进、为何不再属于本次完成范围">${esc(summary)}</textarea></label><p class="small muted">这里只整理处理清单，确认前不会改变任何任务。</p>`:`<h3>本次将执行的变更</h3>${open.map(t=>`<div class="summaryrow"><div><b>${esc(t.title)}</b><p class="muted">${esc(draft[t.id]?.reason)}</p></div><span>${esc(actionLabel[draft[t.id]?.action]||'尚未选择')}</span></div>`).join('')}<div class="summaryrow"><b>代码架构重构及当前态模型建设</b><span>登记组合任务完成</span></div><h3 style="margin-top:24px">整体结果与范围说明</h3><p style="white-space:pre-wrap;margin:10px 0">${esc(summary)}</p><p class="small muted">${associated().length-open.length} 项已结束子任务保留原状态与结果。本次处置及任务去向随整体结果保留。</p><label class="candidate" style="border:0;margin-top:18px"><input id="confirm-completion" type="checkbox" ${confirmed?'checked':''} onchange="confirmed=this.checked"><span>我已核对整体目标、剩余工作与上述变更，确认完成组合任务。</span></label>`}<div class="error">${esc(error)}</div>`,`<button onclick="closeOverlay()">继续工作，暂不完成</button><button class="text small" onclick="simulateNewChild()">模拟新增子任务</button><span class="grow"></span>${snapshot!==version?'<button class="primary" onclick="rereadCompletion()">重新读取任务</button>':closeStep===1?'<button class="primary" onclick="reviewCompletion()">下一步：核对变更</button>':'<button onclick="closeStep=1;confirmed=false;renderCompletion()">返回调整</button><button class="primary" onclick="commitCompletion()">确认处理并完成</button>'}`,true)}
function bulkDetach(){unfinished().forEach(t=>draft[t.id]={...(draft[t.id]||{}),action:'detach'});confirmed=false;renderCompletion()}
function reviewCompletion(){error='';if(snapshot!==version){error='任务已变化，请重新读取。'}else if(unfinished().some(t=>!draft[t.id]?.action||!draft[t.id]?.reason?.trim())){error='请为每项未结束任务选择处理方式并填写说明。'}else if(!summary.trim()){error='请填写整体完成说明。'}if(!error)closeStep=2;renderCompletion()}
function simulateNewChild(){data.push({id:'late-'+(++added),title:'新增：核对知识引用完整性 '+added,goal:'补充检查当前文档的关键引用。',state:'todo',result:'刚刚新增，尚未开始。',owner:'parent'});version++;confirmed=false;render();renderCompletion()}
function rereadCompletion(){snapshot=version;confirmed=false;closeStep=1;error='';renderCompletion()}
function commitCompletion(){if(snapshot!==version){confirmed=false;error='范围已变化，不能沿用上次确认。';renderCompletion();return}if(!confirmed){error='请勾选明确完成确认。';renderCompletion();return}if(unfinished().some(t=>!draft[t.id]?.reason?.trim()||!draft[t.id]?.action)||!summary.trim()){closeStep=1;error='处置说明不完整。';renderCompletion();return}unfinished().forEach(t=>{const d=draft[t.id];history.push({id:t.id,title:t.title,action:actionLabel[d.action],reason:d.reason});if(d.action==='detach')t.owner='';if(d.action==='transfer')t.owner='other';if(d.action==='abandon'){t.state='abandoned';t.result=d.reason}if(d.action==='complete'){t.state='completed';t.result=d.reason}});closed=true;version++;tab='finish';render();closeOverlay();toast('示例已完成：剩余任务按清单处理，组合结果已记录')}
function showHistory(){overlay('关联与处置记录',history.length?history.map(h=>`<div class="processing"><b>${esc(h.title)}</b><p>${esc(h.action)}</p><p>${esc(h.reason)}</p><button class="text" onclick="closeOverlay();openChild('${h.id}')">查看当前任务 →</button></div>`).join(''):'<div class="empty">尚无关联调整或处置记录。</div>')}
function showDoc(title){overlay(title,'<p>沿用现有资料阅读入口。本原型聚焦任务组织，未展开其他模块页面。</p>')}
function showCreateOrdinary(){overlay('创建任务',`<p class="muted">任务类型：普通任务 / 组合任务</p><div class="surface"><h3>普通任务</h3><p>独立执行，可选择所属组合。</p></div><div class="surface"><h3>组合任务</h3><p>围绕整体目标组织任务，可先创建、稍后再添加子任务。</p></div><button onclick="closeOverlay();setView('parent');openAdd()">演示在当前组合中创建普通任务</button>`)}
function showDesign(){overlay('这一版的设计边界',`<div class="doc"><h2>保留现有阅读方式</h2><p>页头显示完整目标、项目和服务链接。横向节点切换；文档区域保持左目录、右正文及独立滚动。组合任务复用此框架，内容改为组合概览、子任务、目标与方案、整体收尾。</p><h3>类型与归属分开</h3><p>类型建议为普通任务与组合任务。组合任务保持明确身份，空组合或移出全部任务后不自动变回普通任务。每个普通任务至多属于一个组合；不按是否属于其他任务判断类型。</p><h3>分屏不再套第三层</h3><p>组合任务固定为当前主阅读对象。普通任务在右侧“子任务详情”单一标签打开；切换普通任务复用它。任务列表保留独立入口与筛选。正式实现需按组合对象保存筛选、位置与普通任务阅读状态；若普通任务有未保存输入，切换前保存或明确选择，不能静默丢弃。</p><h3>新增与关联</h3><p>组合进行中可新建或关联普通任务，也可移出或转移。终态组合不直接接收新任务；新增后续工作另建任务或明确更正组合状态。已有归属不可静默覆盖，关联校验保留同空间、无循环、目标组合有效等规则。</p><h3>完成建议</h3><p>未结束任务可逐项选择继续独立推进、转移、放弃，或确实已做完后登记成果。只批量提供“继续独立推进”，不批量假定完成。即使已移出全部剩余任务，也必须说明整体目标为何已达成。验收时新增任务或已有状态变化，原确认失效。</p><h3>与当前实现的差异</h3><p>当前实现禁止直接完成仍有未结束子任务的父任务，也不连带改变子任务。此处提议在一次用户确认后，逐项调用相应操作，核对剩余关联任务均已结束，再登记组合完成；不是让一个完成请求静默改写其他任务。</p><p>组合类型持久保留、组合为主的分屏上下文、批量处置界面属于待确认设计。正式实现需同步规范与相关接口；真实执行应记录逐项成功或失败，失败时保留已成功事实，只重试未完成项，不误报组合完成。</p><h3>原型范围</h3><p>页面和数据均为本地模拟。未连接真实任务，不代表已具备上述正式能力。历史已完成但缺失验收依据的任务，应显示依据缺失，不补造确认。</p></div>`,'',true)}
function emptySample(){reset();data.forEach(t=>t.owner='');render()}function allDoneSample(){reset();data.forEach(t=>{t.state='completed';t.result='已记录独立成果与适用验证。'});render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});render();

let activeResource='parent',documentTitle='',pickerOpen=false,pickerQuery='';

function resourceTabs(){return `<div class="tabbar"><button class="${activeResource==='parent'?'on':''}" onclick="activeResource='parent';render()">组合任务</button>${child?`<button class="${activeResource==='child'?'on':''}" onclick="activeResource='child';render()">普通任务</button><button class="small" aria-label="关闭普通任务标签" onclick="child=null;activeResource='parent';render()">×</button>`:''}${documentTitle?`<button class="${activeResource==='document'?'on':''}" onclick="activeResource='document';render()">文档</button><button class="small" aria-label="关闭文档标签" onclick="documentTitle='';activeResource='parent';render()">×</button>`:''}<span class="grow"></span><button class="small" onclick="childExpanded=!childExpanded;render()">${childExpanded?'恢复分屏':'展开阅读'}</button></div>`}
setView=function(v){activeResource='parent';pickerOpen=false;render()};
openChild=function(id){child=id;activeResource='child';childStage='方案设计';childDoc='设计';checklist=false;pickerOpen=false;render()};

counts=function(){const a=associated();return `<div class="stats">${[['all','项子任务',a.length],['completed','已完成',a.filter(t=>t.state==='completed').length],['active','进行中',a.filter(t=>t.state==='active').length],['todo','待办',a.filter(t=>t.state==='todo').length],...(a.some(t=>t.state==='abandoned')?[['abandoned','已放弃',a.filter(t=>t.state==='abandoned').length]]:[])].map(([f,l,n])=>`<button aria-label="${n}${l}" onclick="filter='${f}';q='';setTab('tasks')"><b>${n}</b>${l}</button>`).join('')}</div>`};

overview=function(){return `<div class="reader">${counts()}<article class="doc planbody"><div class="filelabel">design.md <button class="text small" style="float:right" onclick="showDoc('组合任务方案 · design.md')">打开文档 ↗</button></div><h2>代码结构与知识建设方案</h2><p>围绕代码职责、知识阅读与持续维护组织工作。先交付清晰的代码结构与阅读入口，再按实际需要补充测试说明和技术图校准。</p><h3>工作安排</h3><p>代码结构重构与代码地图相互对齐；资料阅读复用现有项目和服务入口。测试验证说明、模型和技术图依据最新实现维护。</p><p>工作推进中可继续关联已有普通任务；任务数量随当前工作变化。</p><h3>范围与完成条件</h3><p>保持现有业务行为，交付清晰的代码职责与可追溯的知识资料。整体完成时核对目标、实际成果与尚需继续的工作。</p><h3>相关材料</h3><p><a href="#" onclick="showDoc('代码地图与来源说明');return false">代码地图与来源说明 ↗</a></p><p><a href="#" onclick="showDoc('测试验证框架说明');return false">测试验证框架说明 ↗</a></p></article></div>`};
function picker(){const options=[...candidates.filter(c=>!c.owner&&!data.some(t=>t.id===c.id)),...data.filter(t=>!t.owner)].filter(t=>t.title.includes(pickerQuery));return `<div class="associate"><button aria-label="关联子任务" onclick="pickerOpen=!pickerOpen;render()">关联子任务　⌄</button>${pickerOpen?`<div class="picker"><input aria-label="过滤任务" placeholder="过滤任务" value="${esc(pickerQuery)}" oninput="filterPicker(this.value)"><button class="create" onclick="pickerOpen=false;openAdd();addTab='new';renderAdd()">＋ 新增普通任务</button>${options.map(t=>`<button onclick="associateOne('${t.id}')">${esc(t.title)}</button>`).join('')||'<div class="picker-empty">暂无可关联任务</div>'}</div>`:''}</div>`}
function filterPicker(v){pickerQuery=v;render();const e=$('[aria-label="过滤任务"]');e.focus();e.setSelectionRange(v.length,v.length)}

taskRows=function(full=false){let html=originalTaskRows(full);if(full&&!closed){html=html.replaceAll(/<button class="icon" aria-label="查看([^\"]+)" onclick="openChild\('([^']+)'\)">↗<\/button>/g,`<button class="icon" aria-label="解除关联 $1" onclick="unlinkOne('$2')">×</button>`)}return html};
tasksView=function(){return `<div class="reader"><div class="toolbar"><input aria-label="搜索子任务" placeholder="搜索子任务" value="${esc(q)}" oninput="searchChildren(this.value)"><select aria-label="子任务状态" onchange="filter=this.value;render()">${[['all','全部状态'],['open','未结束'],['active','进行中'],['todo','待办'],['completed','已完成'],['abandoned','已放弃']].map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select>${closed?'':picker()}</div>${taskRows(true)}</div>`};
finishView=function(){return `<div class="reader doc simple-accept"><h2>${closed?'已验收完成':'尚未验收'}</h2>${closed?`<div class="small muted">确认时间：2026/9/21 17:30 · 示例</div><p>${esc(summary||'整体目标已核对，代码职责与知识阅读成果满足本次完成条件。')}</p><p class="muted">已明确确认完成组合任务。</p>`:`<p>当前 ${associated().length} 项子任务，${unfinished().length} 项未结束。${unfinished().length?'整体完成情况尚未确认。':'可对照方案核对整体成果。'}</p><p class="muted">子任务结束不会自动完成组合任务。</p><button style="margin-top:16px" onclick="startCompletion()">完成组合任务</button>`}</div>`};

function compactList(){const rows=[{id:'parent',title:'代码架构重构及当前态模型建设',type:'composite',state:closed?'completed':'active',result:closed?(summary||'已结束本次组合工作。'):'已完成代码结构与阅读调整，正在补齐测试说明。'},...data.map(t=>({...t,type:'ordinary'}))].filter(t=>listType==='all'||t.type===listType);return `<section class="pane list-main"><div class="tabbar"><button class="on"><i class="dot"></i>任务列表</button></div><div class="content"><div class="heading"><h1>任务</h1><span class="counter">${rows.length} 个任务</span></div><div class="toolbar" style="margin-top:24px"><span class="muted">任务类型</span><select aria-label="任务类型" onchange="listType=this.value;render()">${[['all','全部类型'],['ordinary','普通任务'],['composite','组合任务']].map(([v,l])=>`<option value="${v}" ${listType===v?'selected':''}>${l}</option>`).join('')}</select><span class="grow"></span><span class="counter">全部状态</span></div><div class="listbody"><table class="tablelist"><thead><tr><th>任务</th><th>状态</th></tr></thead><tbody>${rows.map(t=>`<tr><td><a href="#" class="title" onclick="${t.id==='parent'?"setView('parent')":`openChild('${t.id}')`};return false">${esc(t.title)}</a> ${t.type==='composite'?'<span class="pill">组合任务</span>':''}${t.result&&t.state!=='todo'?`<p class="row-summary" title="${esc(t.result)}">${t.state==='active'?'进展':'结果'}：${esc(t.result)}</p>`:''}</td><td>${badge(t.id==='parent'&&closed?parentOutcome:t.state)}</td></tr>`).join('')}</tbody></table></div></div></section>`}
taskRows=function(){const rows=associated().filter(t=>filter==='all'||(filter==='open'?['active','todo'].includes(t.state):t.state===filter)).filter(t=>t.title.includes(q));return rows.length?`<table class="children"><thead><tr><th>任务</th><th>状态</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td><a class="tasktitle" href="#" onclick="openChild('${t.id}');return false">${esc(t.title)}</a>${t.result&&t.state!=='todo'?`<p class="row-summary" title="${esc(t.result)}">${t.state==='active'?'进展':'结果'}：${esc(t.result)}</p>`:''}</td><td>${badge(t.state)}</td><td>${!closed?`<button class="icon" aria-label="解除关联 ${esc(t.title)}" onclick="unlinkOne('${t.id}')">×</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无符合条件的子任务。</div>'};
picker=function(){const options=[...candidates.filter(c=>!c.owner&&!data.some(t=>t.id===c.id)),...data.filter(t=>!t.owner)].filter(t=>t.title.includes(pickerQuery));return `<div class="associate"><button aria-label="关联子任务" onclick="pickerOpen=!pickerOpen;render()">关联子任务　⌄</button>${pickerOpen?`<div class="picker"><input aria-label="过滤任务" placeholder="过滤任务" value="${esc(pickerQuery)}" oninput="filterPicker(this.value)">${options.map(t=>`<button onclick="associateOne('${t.id}')">${esc(t.title)}</button>`).join('')||'<div class="picker-empty">暂无可关联任务</div>'}</div>`:''}</div>`};
render=function(){const prior=$('.pane.detail .reader');if(prior&&lastViewKey)scrollPositions[lastViewKey]=prior.scrollTop;const key=activeResource+':'+(activeResource==='parent'?tab:activeResource==='child'?child:documentTitle);lastViewKey=key;let right=activeResource==='child'&&task(child)?originalChildPane().replace('class="pane child"','class="pane detail"').replace(/<div class="tabbar">.*?<\/div>/,resourceTabs()):activeResource==='document'?documentPane():parentPane();$('#workspace').className='workspace'+(childExpanded?' expanded':'');$('#workspace').innerHTML=compactList()+right;const r=$('.pane.detail .reader');if(r)r.scrollTop=scrollPositions[key]||0};
const v4ParentHeader=parentHeader;parentHeader=function(){return v4ParentHeader().replace(closed?badge('completed'):'__unused__',badge(parentOutcome))};
startCompletion=function(){if(closed)return;draft={};unfinished().forEach(t=>draft[t.id]={action:'detach'});parentOutcome='completed';summary='';snapshot=version;error='';renderCompletion()};
setDisposition=function(id,value){draft[id]={action:value};renderCompletion()};
renderCompletion=function(){modal='completion';const open=unfinished();overlay('结束组合任务',`<div class="compact-completion">${snapshot!==version?'<div class="notice">子任务已变化，请重新读取清单。已有选择和说明会保留。</div>':''}<h3>未结束子任务 <span class="muted">${open.length}</span></h3><p class="small muted" style="margin:8px 0 12px">独立推进：解除所属关系，保留任务当前状态。</p>${open.map(t=>`<div class="processing"><div class="processing-head"><b class="grow">${esc(t.title)}</b>${badge(t.state)}<select aria-label="${esc(t.title)}处理方式" onchange="setDisposition('${t.id}',this.value)">${[['detach','独立推进'],['abandon','放弃'],['complete','已完成']].map(([v,l])=>`<option value="${v}" ${(draft[t.id]?.action||'detach')===v?'selected':''}>${l}</option>`).join('')}</select></div></div>`).join('')||'<p class="muted">没有未结束的子任务。</p>'}<h3 style="margin-top:28px">组合任务结果</h3><div class="finish-choice"><label><input type="radio" name="parent-outcome" ${parentOutcome==='completed'?'checked':''} onchange="parentOutcome='completed'">已完成</label><label><input type="radio" name="parent-outcome" ${parentOutcome==='abandoned'?'checked':''} onchange="parentOutcome='abandoned'">放弃</label></div><label class="field">备注说明<span class="optional-label">选填</span><textarea aria-label="备注说明" placeholder="需要时补充整体结果或说明" oninput="summary=this.value">${esc(summary)}</textarea></label><div class="error">${esc(error)}</div></div>`,`<button onclick="closeOverlay()">取消</button><button class="text small" onclick="simulateNewChild()">模拟子任务变化</button><span class="grow"></span>${snapshot!==version?'<button class="primary" onclick="rereadCompletion()">重新读取</button>':'<button class="primary" onclick="commitCompletion()">确认并提交</button>'}`)};
rereadCompletion=function(){snapshot=version;unfinished().forEach(t=>{if(!draft[t.id])draft[t.id]={action:'detach'}});error='';renderCompletion()};
commitCompletion=function(){if(snapshot!==version){error='请先核对最新子任务。';renderCompletion();return}unfinished().forEach(t=>{const action=draft[t.id]?.action||'detach';if(action==='detach')t.owner='';if(action==='abandon'){t.state='abandoned';t.result='已在结束组合任务时明确放弃。'}if(action==='complete'){t.state='completed';t.result='已在结束组合任务时确认完成。'}});closed=true;version++;tab='finish';activeResource='parent';render();closeOverlay();toast('已按选择更新示例任务')};
finishView=function(){return `<div class="reader doc simple-accept"><h2>${closed?(parentOutcome==='completed'?'已验收完成':'已放弃'):'尚未验收'}</h2>${closed?`<p class="small muted">记录时间：2026/9/21 17:30 · 示例</p>${summary.trim()?`<p>${esc(summary)}</p>`:'<p class="muted">未填写备注说明。</p>'}`:`<p>当前 ${associated().length} 项子任务，${unfinished().length} 项未结束。</p><button style="margin-top:16px" onclick="startCompletion()">结束组合任务</button>`}</div>`};
more=function(){overlay('组合任务操作',closed?'<p>任务已结束，可在验收页查看结果。</p>':'<button onclick="startCompletion()">结束组合任务</button>')};
showDesign=function(){overlay('本版设计','<p>主屏列表只保留标题、状态，以及有实际内容的一行进展或结果。</p><p>关联选择器仅提供搜索和关联已有任务，不显示新增功能。</p><p>结束组合任务使用单页：未结束子任务默认独立推进，可选择放弃或已完成；组合任务选择已完成或放弃，备注选填。</p><p>所有操作仅修改示例数据，正式产品尚未更改。</p>')};
render();

</script></body></html>
