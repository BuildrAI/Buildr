/** @typedef {{id:string,title:string,text:string,position?:string}} FeatureNote */
/** @typedef {{id:string,notes:FeatureNote[],states:Array<{id:string,notes:FeatureNote[]}>}} PrototypeScene */

/**
 * Framework-independent task feature cards. Plain text only; no application requests.
 * @param {HTMLElement} root
 * @param {{notes:FeatureNote[],activePosition?:string,onHighlight:(position?:string,reveal?:boolean)=>void}} options
 */
function mountFeatureNotes(root, options) {
  const doc=root.ownerDocument;
  let fingerprint='';
  /** @type {Array<{node:HTMLElement,position?:string}>} */
  let cards=[];
  root.classList.add('prototype-features');
  function update({notes,activePosition}) {
    const next=JSON.stringify(notes);
    if(next!==fingerprint) {
      fingerprint=next;cards=[];root.replaceChildren();
      const hint=doc.createElement('p');
      hint.className='prototype-features-hint';
      hint.textContent=notes.length?'本次任务在当前画面中的功能。悬停查看对应区域，点击定位。':'此页面尚未提供与本次任务相关的功能说明。';
      root.append(hint);
      for(const note of notes) {
        const node=doc.createElement(note.position?'button':'section');
        node.className='prototype-feature';node.dataset.featureNote=note.id;
        const title=doc.createElement('strong'),body=doc.createElement('span');
        title.textContent=note.title;body.textContent=note.text;node.append(title,body);
        if(note.position) {
          node.setAttribute('type','button');
          node.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch')options.onHighlight(note.position);});
          node.addEventListener('pointerleave',()=>{if(!node.matches(':focus-visible'))options.onHighlight();});
          node.addEventListener('focus',()=>options.onHighlight(note.position));
          node.addEventListener('blur',()=>options.onHighlight());
          node.addEventListener('click',()=>options.onHighlight(note.position,true));
        }
        root.append(node);cards.push({node,position:note.position});
      }
    }
    for(const card of cards)card.node.classList.toggle('is-active',Boolean(card.position&&card.position===activePosition));
  }
  update(options);
  return {update,destroy(){options.onHighlight();root.replaceChildren();root.classList.remove('prototype-features');}};
}

/** @param {Document} doc */
function createRegionHighlighter(doc) {
  /** @param {string|null|undefined} position @param {boolean} [reveal] */
  return (position,reveal=false)=>{
    doc.querySelectorAll('[data-prototype-highlight]').forEach(el=>el.removeAttribute('data-prototype-highlight'));
    if(!position)return;
    const nodes=[...doc.querySelectorAll('[data-prototype-position]')].filter(el=>el.getAttribute('data-prototype-position')===position&&el.getClientRects().length);
    nodes.forEach(el=>el.setAttribute('data-prototype-highlight','true'));
    if(reveal)nodes[0]?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  };
}

/**
 * Optional sandbox reading bridge. Card highlights never invoke onSelect.
 * @param {{pages:PrototypeScene[],getSelection:()=>{page:string,state:string},onSelect:(page:string,state:string)=>void}} options
 * @param {Window} [win]
 */
function connectPrototype(options,win=window) {
  const doc=win.document,paint=createRegionHighlighter(doc);
  let nonce='';
  const notes=(page,state)=>{
    const scene=options.pages.find(p=>p.id===page);
    return scene?[...scene.notes,...(scene.states.find(s=>s.id===state)?.notes||[])]:[];
  };
  const receive=event=>{
    const m=event.data;
    if(event.source!==win.parent||!m||typeof m.nonce!=='string'||!m.nonce)return;
    const scene=options.pages.find(p=>p.id===m.page);
    if(!scene||(m.state!==''&&!scene.states.some(s=>s.id===m.state)))return;
    if(m.type==='buildr:prototype:select'){
      nonce=m.nonce;paint(null);options.onSelect(m.page,m.state);
      win.requestAnimationFrame(()=>{
        const current=options.getSelection();
        if(nonce===m.nonce&&current.page===m.page&&current.state===m.state&&win.parent!==win)
          win.parent.postMessage({type:'buildr:prototype:rendered',nonce,page:m.page,state:m.state},'*');
      });
      return;
    }
    const current=options.getSelection();
    if(m.type!=='buildr:prototype:highlight'||m.nonce!==nonce||m.page!==current.page||m.state!==current.state)return;
    if(m.position!==null&&(typeof m.position!=='string'||!notes(m.page,m.state).some(n=>n.position===m.position)))return;
    paint(m.position,m.reveal===true);
  };
  const region=target=>{
    const current=options.getSelection(),declared=notes(current.page,current.state);
    let node=target?.nodeType===1?target:null;
    while(node){const position=node.getAttribute('data-prototype-position');if(position&&declared.some(n=>n.position===position))return position;node=node.parentElement;}
    return null;
  };
  const inform=position=>{
    paint(position);
    if(win.parent!==win&&nonce)win.parent.postMessage({type:'buildr:prototype:highlight',nonce,...options.getSelection(),position},'*');
  };
  const enter=event=>inform(region(event.target));
  const leave=event=>inform(region(event.relatedTarget));
  win.addEventListener('message',receive);
  doc.addEventListener('pointerover',enter);doc.addEventListener('pointerout',leave);
  doc.addEventListener('focusin',enter);doc.addEventListener('focusout',leave);
  if(win.parent!==win)win.parent.postMessage({type:'buildr:prototype:ready'},'*');
  return {
    report(page,state=''){paint(null);if(win.parent!==win&&nonce)win.parent.postMessage({type:'buildr:prototype:state',nonce,page,state},'*');},
    destroy(){nonce='';win.removeEventListener('message',receive);doc.removeEventListener('pointerover',enter);doc.removeEventListener('pointerout',leave);doc.removeEventListener('focusin',enter);doc.removeEventListener('focusout',leave);paint(null);},
  };
}

const startChats=()=>[
 {id:'layout',title:'统一 Development 顶栏',time:'刚刚',example:true,draft:'',turns:[],scroll:null,object:null},
 {id:'review',title:'浏览 Harness 变更',time:'昨天',intro:'上一轮已整理目录浏览的改动，可以在工作台打开源代码管理继续核对。',draft:'',turns:[],scroll:null,object:null},
 {id:'setup',title:'核对工作空间准备项',time:'昨天',intro:'环境和技能可以在工作空间中单独查看。需要时，也可以把当前对象带回这个对话。',draft:'',turns:[],scroll:null,object:null}
];
const seed=()=>({mode:'bench',history:true,mobileHistory:false,tool:'home',workOpen:false,tabs:[],side:true,diff:0,file:3,nav:'home',active:'layout',chats:startChats(),services:structuredClone(seedServices),edit:null});
let st=seed(),seq=0,toastTimer,helpTimer,helpPin=false,helpLock=false;
const embedded=window.parent!==window,main=$('#main'), transcript=$('#transcript'), draft=$('#draft'),dialog=$('#edit-dialog');
const manifest=JSON.parse($('#buildr-prototype').textContent);
const highlight=createRegionHighlighter(document);
const notes=mountFeatureNotes($('#feature-notes'),{notes:[],onHighlight:highlight});
const selection=()=>({page:st.mode,state:st.mode==='bench'?(st.workOpen?st.tool:''):''});
const bridge=connectPrototype({pages:manifest.pages,getSelection:selection,onSelect:(page,state)=>resetScene(page,state)});
function resetScene(page='bench',state=''){
 if(dialog.open)dialog.close(); st=seed();st.mode=page;st.workOpen=!!state;st.tool=state||'home';if(state==='changes'||state==='files')st.tabs=[state];$('.history-search').value='';main.style.removeProperty('--tool-width');main.style.removeProperty('--chat-width'); render();renderMessages();transcript.scrollTop=0;
}
function active(){return st.chats.find(c=>c.id===st.active)}
function toast(text){const el=$('.toast');clearTimeout(toastTimer);el.textContent=text;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,2300)}
function updateHelp(){const {page,state}=selection(),scene=manifest.pages.find(p=>p.id===page);notes.update({notes:[...scene.notes,...(scene.states.find(x=>x.id===state)?.notes||[])]});$('#scenes').value=page+':'+state;bridge.report(page,state)}
function render(){
 const bench=st.mode==='bench'; Object.assign(main.dataset,{mode:st.mode,history:String(st.history),tool:String(st.workOpen),side:String(st.side),mobileHistory:String(st.mobileHistory)});
 $$('[data-mode-btn]').forEach(b=>b.dataset.modeBtn===st.mode?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 $('#history').hidden=!bench;$('#history-toggle').hidden=!bench;$('#history-toggle').setAttribute('aria-expanded',String(window.innerWidth<=760||window.innerWidth<=1030&&st.workOpen?st.mobileHistory:st.history));
 $('#work-tools').hidden=!bench;const toggle=$('#toggle-work-area');toggle.setAttribute('aria-expanded',String(st.workOpen));toggle.title=st.workOpen?'收起对话工作区':'显示对话工作区';toggle.setAttribute('aria-label',toggle.title);$('#space-actions').hidden=bench;$('#hide-chat').hidden=bench;$('#chat').hidden=!bench&&!st.side;
 $('#space-nav').hidden=bench;$('#management').hidden=bench;$('#show-chat').hidden=st.side;
 $('#inspector').hidden=!bench||!st.workOpen;$('#divider').hidden=bench?!st.workOpen:!st.side;
 if(!bench)renderManage();else if(st.workOpen)renderInspector();
 renderHistory();renderComposer();updateHelp();
}
function renderHistory(){
 const term=$('.history-search').value.trim().toLowerCase(), hits=st.chats.filter(c=>c.title.toLowerCase().includes(term));
 $('#history-list').innerHTML=hits.map(c=>`<button class="list-btn history-item" type="button" data-chat="${c.id}" aria-current="${c.id===st.active}"><strong class="truncate">${clean(c.title)}</strong><small>${clean(c.time)}</small></button>`).join('')||'<p class="history-foot">没有匹配的对话</p>';
}
const userBubble=text=>`<div class="user-message"><p>${clean(text)}</p></div>`;
const agentLine=(time='14:26')=>`<div class="byline"><span class="agent-mark">${icon('agent')}</span>Codex <time>${time}</time></div>`;
const delta=f=>`<span class="stats">${f.delta[0]} <span class="removed">${f.delta[1]}</span></span>`;
function renderMessages(){
 const c=active();$('#chat-title').textContent=c.title;
 $('#messages').innerHTML='<div class="date-line">今天</div>'+(c.example?`${userBubble('把工作台和工作空间放到同一条产品顶栏。改完后我想先看看 diff。')}<article class="response">${agentLine()}<p>已把 <strong>工作台 / 工作空间</strong> 放进同一条产品顶栏，移除了单独的展开行。切换布局时会保留当前对话和输入。</p><p>要查看改动时，可以打开右侧工作区里的源代码管理。</p></article>`:c.intro?`<article class="response">${agentLine()}<p>${clean(c.intro)}</p></article>`:'<p class="muted">在这个工作空间开始一段新对话。</p>')+c.turns.map(t=>`${userBubble(t.text)}<article class="response">${agentLine('刚刚')}<p>${t.object?'收到了你要处理的对象：<strong>'+clean(t.object)+'</strong>。':'收到了。这个原型会保留这条消息和当前工作现场。'} 这里仅演示对话接续，不会启动真实执行。</p></article>`).join('');
}
function renderComposer(){const c=active();if(draft.value!==c.draft)draft.value=c.draft;$('#compose-context').hidden=!c.object;$('#compose-object').textContent=c.object||'';$('#send').disabled=!draft.value.trim()}
function retainScroll(action){const old=transcript.scrollTop; action();transcript.scrollTop=old}
const toolInfo={files:['资源管理器','folder'],changes:['源代码管理','diff']};
function openTool(tool){retainScroll(()=>{st.workOpen=true;st.tool=tool;if(tool!=='home'&&!st.tabs.includes(tool))st.tabs.push(tool);st.mobileHistory=false;render()});if(tool!=='home')$(`[data-select-tool="${tool}"]`)?.focus({preventScroll:true});else $('[data-launch-tool]')?.focus({preventScroll:true})}
function toggleWorkArea(){retainScroll(()=>{st.workOpen=!st.workOpen;st.mobileHistory=false;render()})}
function closeToolTab(tool){const i=st.tabs.indexOf(tool);st.tabs=st.tabs.filter(id=>id!==tool);if(st.tool===tool)st.tool=st.tabs[i]||st.tabs.at(-1)||'home';render();(st.tool==='home'?$('#add-tool'):$(`[data-select-tool="${st.tool}"]`))?.focus({preventScroll:true})}
function mode(next){if(next===st.mode)return;st.mobileHistory=false;retainScroll(()=>{st.mode=next;render()})}
function chooseChat(id){active().scroll=transcript.scrollTop;st.active=id;st.mobileHistory=false;render();renderMessages();transcript.scrollTop=active().scroll??0}
function renderInspector(){
 const tabs=$('#directory-tabs'), loc=$('#location'), content=$('#inspect-content');
 tabs.innerHTML=st.tabs.length?st.tabs.map(id=>{const [label,mark]=toolInfo[id];return `<span class="directory-tab${st.tool===id?' is-active':''}"><button type="button" class="quiet" data-select-tool="${id}" aria-pressed="${st.tool===id}">${icon(mark)}${label}</button><button type="button" class="icon close-tab" data-close-tab="${id}" aria-label="关闭${label}标签">${icon('close')}</button></span>`}).join(''):'<span class="workspace-label">工作区</span>';
 loc.hidden=st.tool==='home';$('#add-tool').setAttribute('aria-expanded',String(st.tool==='home'));
 if(st.tool==='home'){content.innerHTML=`<div class="directory-home"><h2>对话工作区</h2><p>在同一工作空间里浏览文件、查看变更。</p><nav aria-label="工作区内容">${Object.entries(toolInfo).map(([id,[label,mark]])=>`<button type="button" data-launch-tool="${id}">${icon(mark)}<strong>${label}</strong>${st.tabs.includes(id)?'<small>已打开</small>':''}</button>`).join('')}</nav></div>`;return}
 const change=st.tool==='changes', f=files[change?st.diff:st.file];
 $('#location').innerHTML=icon('diff')+'<strong>buildr</strong><span class="muted">/</span><span class="mono muted">dev</span><span class="spacer"></span><span class="muted">主工作树</span>';
 const list=change?files.slice(0,3):[files[3],...files.slice(0,3)];
 let old=f.before,now=f.after;
 const code=change?f.lines.map(([mark,s])=>{const a=mark==='+'||mark==='@'?'':old++, b=mark==='-'||mark==='@'?'':now++;return `<div class="code-row ${mark==='@'?'hunk':mark==='+'?'add':mark==='-'?'del':''}"><span>${a}</span><span>${b}</span><span>${mark==='@'?'':mark}</span><code>${clean(s)}</code></div>`}).join(''):f.read.map((line,i)=>`<div class="code-row plain"><span>${i+1}</span><code>${clean(line)}</code></div>`).join('');
 $('#inspect-content').innerHTML=`<div class="tree"><span class="small-label">${change?'未提交变更 · 3 个文件':'文件 · buildr'}</span>${list.map(item=>{const index=files.indexOf(item);return `<button type="button" class="list-btn" data-inspect="${index}" aria-current="${item===f}" aria-label="${item.name}">${icon('file')}<strong class="truncate">${item.name}</strong><span class="muted truncate">${item.path||''}</span><span class="spacer"></span>${change?'<span class="status">M</span>':''}</button>`}).join('')}</div><div class="reader-head">${icon('file')}<span class="truncate">${f.path?f.path+'/':''}${f.name}</span><span class="spacer"></span>${change?delta(f):'<span class="muted">文件内容</span>'}</div><div class="reader" tabindex="0" aria-label="${change?'文件差异':'文件内容'}"><div class="code-lines">${code}</div></div>`;
}
function renderManage(){
 $('#space-menu').innerHTML=['home','projects','services','repos','env','skills'].map(k=>(k==='projects'?'<span class="small-label">工程组成</span>':k==='env'?'<span class="small-label">环境与能力</span>':'')+`<button type="button" class="navitem" data-nav="${k}" ${k===st.nav?'aria-current="page"':''}>${icon(K[k][1])}${K[k][0]}</button>`).join('');
 const [title,,description]=K[st.nav];$('#manage-crumb').textContent=title;
 const header=`<h1>${title}</h1><p>${description}</p>`;
 let body=st.nav==='home'?`<h2>空间组成</h2><div class="cards">${[['projects','2 个项目'],['services',st.services.length+' 个服务'],['repos','1 个代码库'],['env','本机开发环境'],['skills','3 项可用技能']].map(([key,meta])=>`<button type="button" class="summary" data-nav="${key}">${icon(K[key][1])}<strong>${K[key][0]}</strong><span class="spacer"></span><span class="muted tiny">${meta}</span><small>${K[key][2]}</small></button>`).join('')}</div>`:st.nav==='services'?`<div class="table"><div class="table-row"><span>服务</span><span>说明 / 代码库</span><span>操作</span></div>${st.services.map((s,i)=>`<div class="table-row"><span><b>${s.name}</b><small class="mono">${s.slug}</small></span><span><b>${clean(s.detail)}</b><small class="mono">${s.repo}</small></span><button type="button" class="quiet" data-edit="${i}" aria-label="编辑 ${s.name}">编辑</button></div>`).join('')}</div><p class="manage-hint">可以手动编辑服务说明，也可以在右侧对话中讨论当前目录的配置。</p>`:`<div class="table"><div class="table-row"><span>名称</span><span>说明</span><span>当前状态</span></div>${dirs[st.nav].map(([a,b,c])=>`<div class="table-row"><b>${a}</b><span class="muted">${b}</span><span class="badge">${c}</span></div>`).join('')}</div>`;
 $('#manage-body').innerHTML=`<div class="manage-page">${header}${body}</div>`;
}
function unpinHelp(){helpPin=false;$('#help-pop').append($('#help-content'));$('#notes-fixed').hidden=true;$('#pin-help').textContent='固定'}
function openHelp(open){$('#help-pop').hidden=!open;$('#help-trigger').setAttribute('aria-expanded',String(open||helpPin));if(!open&&!helpPin)highlight(null)}
function queueClose(){clearTimeout(helpTimer);helpTimer=setTimeout(()=>{if(!helpLock&&!helpPin)openHelp(false)},180)}
const preview=$('#preview-tools');preview.hidden=embedded;
preview.addEventListener('pointerenter',()=>clearTimeout(helpTimer));preview.addEventListener('pointerleave',queueClose);
$('#help-trigger').addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'&&!helpPin)openHelp(true)});
$('#help-trigger').addEventListener('click',()=>{if(helpPin){unpinHelp();helpLock=false;openHelp(false)}else{helpLock=!helpLock;openHelp(helpLock)}});
$('#pin-help').addEventListener('click',()=>{if(helpPin){unpinHelp();helpLock=true;openHelp(true)}else if(window.innerWidth>760){helpPin=true;helpLock=false;$('#notes-fixed').append($('#help-content'));$('#notes-fixed').hidden=false;$('#pin-help').textContent='取消固定';openHelp(false)}});
$('#scenes').addEventListener('change',e=>{const [page,state]=e.target.value.split(':');resetScene(page,state)});
$('#reset').addEventListener('click',()=>{resetScene();toast('已重置演示')});
window.addEventListener('resize',()=>{if(window.innerWidth<=760&&helpPin){unpinHelp();openHelp(false)}st.mobileHistory=false; main.dataset.mobileHistory='false';$('#history-toggle').setAttribute('aria-expanded',String(window.innerWidth<=760||window.innerWidth<=1030&&st.workOpen?false:st.history))});
document.addEventListener('click',e=>{if(helpLock&&!preview.contains(e.target)&&!$('#notes-fixed').contains(e.target)){helpLock=false;openHelp(false)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#help-pop').hidden){helpLock=false;openHelp(false);$('#help-trigger').focus()}});
main.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='toggle-work-area'){toggleWorkArea();return}
 if(b.id==='add-tool'){openTool('home');return}
 if(b.dataset.selectTool||b.dataset.launchTool){openTool(b.dataset.selectTool||b.dataset.launchTool);return}
 if(b.dataset.closeTab){closeToolTab(b.dataset.closeTab);return}
 if(b.hasAttribute('data-inspect')){st[st.tool==='changes'?'diff':'file']=Number(b.dataset.inspect);renderInspector();$(`[data-inspect="${b.dataset.inspect}"]`).focus({preventScroll:true});return}
 if(b.dataset.nav){st.nav=b.dataset.nav;renderManage();$(`.space-menu [data-nav="${st.nav}"]`).focus({preventScroll:true});return}
 if(b.dataset.chat){chooseChat(b.dataset.chat);return}
 if(b.hasAttribute('data-edit')){st.edit=Number(b.dataset.edit);const s=st.services[st.edit];$('#edit-title').textContent='编辑 '+s.name;$('#edit-value').value=s.detail;dialog.showModal();$('#edit-value').focus();return}
 if(b.id==='history-toggle'){if(window.innerWidth<=760||window.innerWidth<=1030&&st.workOpen){st.mobileHistory=!st.mobileHistory}else{st.history=!st.history}retainScroll(render);return}
 if(b.id==='new-chat'){const id='new-'+ ++seq;st.chats.unshift({id,title:'新对话 '+seq,time:'刚刚',draft:'',turns:[],scroll:null,object:null});$('.history-search').value='';chooseChat(id);draft.focus();return}
 if(b.id==='remove-context'){active().object=null;renderComposer();draft.focus();return}
 if(b.id==='hide-chat'){retainScroll(()=>{st.side=false;render()});$('#show-chat').focus({preventScroll:true});return}
});
$('#show-chat').addEventListener('click',()=>{retainScroll(()=>{st.side=true;render()});$('#hide-chat').focus({preventScroll:true})});
$('#handoff').addEventListener('click',()=>{st.side=true;active().object='工作空间 · '+K[st.nav][0];retainScroll(render);draft.focus({preventScroll:true})});
$$('[data-mode-btn]').forEach(b=>b.addEventListener('click',()=>mode(b.dataset.modeBtn)));
$('.history-search').addEventListener('input',renderHistory);
draft.addEventListener('input',()=>{active().draft=draft.value;renderComposer()});
draft.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#composer').requestSubmit()}});
$('#composer').addEventListener('submit',e=>{e.preventDefault();const c=active(),text=c.draft.trim();if(!text)return;c.turns.push({text,object:c.object});c.draft='';c.object=null;renderComposer();renderMessages();transcript.scrollTop=transcript.scrollHeight;draft.focus()});
$('#cancel-edit').addEventListener('click',()=>dialog.close());
$('#edit-form').addEventListener('submit',e=>{e.preventDefault();const v=$('#edit-value').value.trim();if(!v)return;const index=st.edit;st.services[index].detail=v;dialog.close();renderManage();$(`[data-edit="${index}"]`).focus();toast('服务说明已在演示中保存')});
const divider=$('#divider');
function setPaneWidth(percent){const bench=st.mode==='bench';main.style.setProperty(bench?'--tool-width':'--chat-width',Math.min(bench?55:49,Math.max(bench?35:26,percent))+'%')}
divider.addEventListener('pointerdown',e=>{divider.setPointerCapture(e.pointerId);divider.classList.add('dragging')});
divider.addEventListener('pointermove',e=>{if(divider.hasPointerCapture(e.pointerId)){const box=main.getBoundingClientRect();setPaneWidth((box.right-e.clientX)/box.width*100)}});
divider.addEventListener('lostpointercapture',()=>divider.classList.remove('dragging'));
divider.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const p=st.mode==='bench'?$('#inspector'):$('#chat');setPaneWidth(p.offsetWidth/main.offsetWidth*100+(e.key==='ArrowLeft'?2:-2))}});
render();renderMessages();
</script></body></html>
