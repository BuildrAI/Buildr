</style></head><body>
<div id="shell"><header class="top"><div class="brand"><span class="mark">B</span>Buildr</div><div class="topnav"><span>工作台</span><span class="active">工作空间</span></div><div class="right"><span class="proto">交互原型</span><span class="workspace-name small">集鲜 · jixian</span><span class="avatar">陈</span></div></header><div class="layout"><aside><p class="caption">工作空间</p><button class="nav active" data-nav="projects"><span>▤</span><span class="label">项目</span></button><button class="nav" data-nav="services"><span>◇</span><span class="label">服务</span></button><button class="nav" data-nav="repositories"><span>⑂</span><span class="label">代码库</span></button><button class="nav" data-nav="skills"><span>ϟ</span><span class="label">技能</span></button><button class="nav" disabled><span>⚙</span><span class="label">设置</span></button><div class="sidefoot">集鲜工作空间<br>关系与代码基础</div></aside><main class="main"><div class="crumb">工作空间 <span>›</span> 集鲜 <span>›</span><b id="crumb-current">项目</b></div><div class="tabbar" id="tabs"></div><div class="page" id="page"></div></main></div></div>
<div id="overlay"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let repos=[{id:'r-pigs',code:'freshx-pigs',url:'git@example.com:jixian/freshx.git',branch:'dev-pigs',present:true},{id:'r-nm',code:'freshx-nm',url:'git@example.com:jixian/freshx.git',branch:'dev-nm',present:false}];
let services=[{id:'s-pig',name:'生猪业务服务',code:'pig-business',description:'生猪采购、入驻与交易的业务实现。',repo:'r-pigs',module:''},{id:'s-fish',name:'水产业务服务',code:'aquatic-business',description:'水产业务的采购与协作实现。',repo:'r-nm',module:''}];
let projects=[{id:'p-pig',name:'生猪',code:'pig',description:'生猪业务的需求、规范与交付管理。',services:['s-pig']},{id:'p-fish',name:'水产',code:'aquatic',description:'水产业务的需求、规范与交付管理。',services:['s-fish']}];
let view='projects',detail=null,projectDraft=null,serviceDraft=null,repoDraft=null,newRepoOpen=false,drawerKind=null,returnFocus=null;let timer;
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function allServices(){return [...services,...(projectDraft?.newServices||[])]}function allRepos(){return [...repos,...(serviceDraft?.fromProject===false?[]:(projectDraft?.newRepos||[])),...(serviceDraft?.newRepos||[])]}function repoBy(id){return allRepos().find(r=>r.id===id)}function serviceBy(id){return allServices().find(s=>s.id===id)}
function nav(v){view=v;detail=null;render()}
function render(){document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===(view==='create'||view==='detail'?'projects':view)));$('crumb-current').textContent=({projects:'项目',create:'创建项目',services:'服务',repositories:'代码库',detail:detail?.name})[view]||'';$('tabs').innerHTML=`<button class="tab ${view==='projects'?'active':''}" data-go="projects">项目目录</button>${projectDraft?`<button class="tab ${view==='create'?'active':''}" data-go="create">创建项目 <span class="muted">•</span></button>`:''}${view==='services'||view==='repositories'?`<button class="tab active">${view==='services'?'服务目录':'代码库目录'}</button>`:''}${view==='detail'?`<button class="tab active">${esc(detail.name)}</button>`:''}`;if(view==='create')renderCreate();else if(view==='detail')renderDetail();else if(view==='services')renderServices();else if(view==='repositories')renderRepos();else renderProjects();$('tabs').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go))}
function header(title,copy,action=''){return `<div class="head"><div><h1>${title}</h1><p>${copy}</p></div>${action}</div>`}
function renderProjects(){$('page').innerHTML=header('项目','围绕业务组织目标、规范和关联服务。',`<div class="head-actions"><span class="muted small">${projects.length} 个项目</span><button class="primary" id="create-project">＋ 创建项目</button></div>`)+`<section class="panel tablewrap"><table class="table"><thead><tr><th>项目</th><th>关联服务</th><th>代码基础</th><th></th></tr></thead><tbody>${projects.map(p=>`<tr><td><button class="text" data-project="${p.id}"><strong>${esc(p.name)}</strong></button><small>${esc(p.description)}</small></td><td>${p.services.map(id=>esc(serviceBy(id)?.name)).join('、')||'<span class="muted">尚未关联</span>'}</td><td>${[...new Set(p.services.map(id=>repoBy(serviceBy(id)?.repo)?.branch))].filter(Boolean).map(b=>`<span class="branch">⑂ ${esc(b)}</span>`).join(' ')||'—'}</td><td><button class="text small" data-project="${p.id}">查看 →</button></td></tr>`).join('')}</tbody></table></section>`;$('create-project').onclick=startProject;$('page').querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{detail=projects.find(p=>p.id===b.dataset.project);view='detail';render()})}

m()}if(kind==='skill')o.content=$('edit-content').value;drawerKind=null;closeDrawer();render();toast('修改已保存（原型演示）')}}

// Reviewed navigation: one secondary detail tab for each resource type.
let previewSlots={}, previewKind=null;
const previewLabels={service:'服务详情',repository:'代码库详情',skill:'技能详情'};
const closeResourcePreview=closeRefinedReading;
closeRefinedReading=function(){previewSlots={};previewKind=null;closeResourcePreview()};
openObject=function(kind,id){previewSlots[kind]=id;previewKind=kind;renderResourcePreview()};
function renderResourcePreview(){
 if(!previewKind)return;
 closeResourcePreview();
 const kind=previewKind,id=previewSlots[kind],o=objectCollection(kind).find(x=>x.id===id);
 if(!o)return;
 const el=document.createElement('div');el.id='refine-reading';
 el.innerHTML='<div class="refine-mask"></div><section class="refine-pane" role="region" aria-label="对象详情"><header><div role="tablist" id="preview-type-tabs"></div><button class="text" id="preview-close">关闭</button></header><div id="preview-detail"></div></section>';
 document.body.append(el);document.body.classList.add('refine-reading');
 $('preview-type-tabs').innerHTML=Object.keys(previewSlots).map(k=>'<button role="tab" aria-selected="'+(k===kind)+'" class="text" data-preview-kind="'+k+'">'+previewLabels[k]+'</button>').join('');
 el.querySelectorAll('[data-preview-kind]').forEach(b=>b.onclick=()=>{previewKind=b.dataset.previewKind;renderResourcePreview()});
 $('preview-close').onclick=()=>{delete previewSlots[kind];previewKind=Object.keys(previewSlots).at(-1);if(previewKind)renderResourcePreview();else closeRefinedReading()};
 el.querySelector('.refine-mask').onclick=closeRefinedReading;
 const noun={service:'服务',repository:'代码库',skill:'技能'}[kind];
 let body='<div class="head"><div><p class="hint">'+noun+' / '+esc(o.code||id)+'</p><h1>'+esc(o.name||o.code)+'</h1><p class="hint">'+esc(o.description||'尚未填写说明。')+'</p></div><button id="preview-edit">编辑'+noun+'</button></div>';
 const row=(name,copy,attrs)=>'<button class="refine-row" '+attrs+'><span class="objecticon">▤</span><span class="grow"><strong>'+esc(name)+'</strong><small>'+esc(copy)+'</small></span><span>›</span></button>';
 if(kind==='service'){
  const r=repoBy(o.repo);
  body+='<section class="refine-section"><h2>关联项目</h2>'+projects.filter(p=>p.services.includes(id)).map(p=>row(p.name,p.description,'data-preview-project="'+p.id+'"')).join('')+'</section><section class="refine-section"><h2>文档</h2>'+['README.md','AGENTS.md'].map(f=>row(f,f==='README.md'?'服务说明与使用入口':'实现规则与协作边界','data-preview-doc="'+f+'"')).join('')+'</section><section class="refine-section"><h2>代码库</h2>'+row(r.code,r.branch+' · '+(r.present?'本地可用':'待准备代码'),'data-preview-repo="'+r.id+'"')+'</section>';
 }else if(kind==='repository'){
  body+='<section class="refine-section"><h2>引用服务</h2>'+services.filter(s=>s.repo===id).map(s=>row(s.name,s.description||s.code,'data-preview-service="'+s.id+'"')).join('')+'</section><section class="refine-section"><h2>代码来源</h2><dl class="detailmeta"><dt>Git 地址</dt><dd>'+esc(o.url)+'</dd><dt>集成分支</dt><dd>'+esc(o.branch)+'</dd><dt>目录</dt><dd>repositories/'+esc(o.code)+'</dd></dl><button id="preview-prepare">准备代码</button></section>';
 }else body+='<section class="refine-section"><h2>工作方法与参考材料</h2>'+row('SKILL.md','适用目标、执行方法与完成标准','data-preview-doc="SKILL.md"')+'</section>';
 $('preview-detail').innerHTML=body;
 $('preview-edit').onclick=()=>editObject(kind,id);
 el.querySelectorAll('[data-preview-project]').forEach(b=>b.onclick=()=>{closeRefinedReading();showProject(b.dataset.previewProject)});
 el.querySelectorAll('[data-preview-repo]').forEach(b=>b.onclick=()=>openObject('repository',b.dataset.previewRepo));
 el.querySelectorAll('[data-preview-service]').forEach(b=>b.onclick=()=>openObject('service',b.dataset.previewService));
 el.querySelectorAll('[data-preview-doc]').forEach(b=>b.onclick=()=>{$('preview-detail').innerHTML='<button id="preview-back" class="text">← 返回详情</button><h2>'+esc(b.dataset.previewDoc)+'</h2><pre>'+esc(o.content||o.name+'\n\n根据当前项目目标、服务规则和代码库声明开展工作。')+'</pre>';$('preview-back').onclick=renderResourcePreview});
 if($('preview-prepare'))$('preview-prepare').onclick=()=>{drawerKind='prepare';showDrawer('准备代码',o.code,'<p class="hint">交给智能体核对来源与已有内容后准备代码。</p><pre>'+esc(o.url+'\n'+o.branch+'\nrepositories/'+o.code)+'</pre>','<span class="hint">尚未执行</span><button id="preview-done">关闭</button>');$('preview-done').onclick=closeDrawer};
}
const renderBeforePreview=render;render=function(){renderBeforePreview();if(previewKind)renderResourcePreview()};

let projectTrail=[];
const openListResource=openObject;
openObject=function(kind,id){
 if(view!=='detail'&&!projectTrail.length){openListResource(kind,id);return}
 closeRefinedReading();
 const saved=document.createDocumentFragment();while($('page').firstChild)saved.append($('page').firstChild);
 projectTrail.push({saved,kind,id});
 openListResource(kind,id);
 const body=$('preview-detail');
 body.remove();closeRefinedReading();
 const back=document.createElement('button');back.className='text';back.style.marginBottom='24px';back.textContent=projectTrail.length===1?'← 返回项目':'← 返回上一级';
 back.onclick=()=>{closeRefinedReading();const previous=projectTrail.pop();$('page').replaceChildren(previous.saved)};
 $('page').replaceChildren(back,body);
 body.querySelectorAll('[data-preview-doc]').forEach(button=>button.onclick=()=>{const item=objectCollection(kind).find(x=>x.id===id);refinedRead(button.dataset.previewDoc,item.content||item.name+'\n\n根据当前项目目标、服务规则和代码库声明开展工作。')});
};
const navBeforeDrill=nav;nav=function(v){projectTrail=[];navBeforeDrill(v)};


const renderBeforeTableAlignment=render;render=function(){renderBeforeTableAlignment();document.querySelectorAll('#page table').forEach(table=>{const headers=[...table.querySelectorAll('thead th')];headers.map((th,i)=>!th.textContent.trim()?i:-1).filter(i=>i>=0).reverse().forEach(i=>table.querySelectorAll('tr').forEach(row=>row.children[i]?.remove()));const th=table.querySelectorAll('thead th');if(th.length){th[0].textContent=th[0].textContent.split(' / ')[0]+' / 说明';th[th.length-1].textContent='操作'}})};
render();
