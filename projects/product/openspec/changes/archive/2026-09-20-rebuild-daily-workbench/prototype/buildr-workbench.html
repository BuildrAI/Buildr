function catalogPage(){const map={services:['服务','按业务职责组织实现，查看关联项目与代码位置。'],repositories:['代码库','查看代码来源，以及它支撑的服务。'],skills:['技能','找到可复用的工作方法，带着明确目标继续工作。'],articles:['文章','在工作空间中管理长期内容，按需要引用与阅读。'],settings:['设置','查看当前工作空间的基本信息。']};const [title,desc]=map[state.view];let content='';if(state.view==='settings')content='<div class="rail-card" style="max-width:620px"><dl class="facts"><dt>工作空间</dt><dd>Buildr</dd><dt>说明</dt><dd>组织产研工作、项目知识与共同方法。</dd><dt>阅读偏好</dt><dd>柔和浅色 · 保留返回位置</dd><dt>本页状态</dt><dd>原型中的示例设置</dd></dl></div>';else{const rows=state.view==='services'?projects.flatMap(p=>p.services.map(s=>[s,p.name,'业务服务','service'])):state.view==='repositories'?[['buildr','Buildr 产品','主要开发分支 · dev','architecture'],['team-tools','团队工具','主要开发分支 · main','environment']]:state.view==='skills'?[['智能体优先设计','Buildr 产品','围绕真实成果组织协作','method'],['用户体验设计法则','Buildr 产品','判断信息层级与操作方式','method'],['项目知识维护','工程知识','依据当前事实维护知识','knowledge']]:[['以共同事实接续工作','Buildr 产品','草稿 · 今天更新','article'],['怎样读懂一个服务','工程知识','已整理 · 昨天更新','knowledge']];content='<table class="catalog-table"><thead><tr><th>'+title+' / 说明</th><th>所属范围</th><th>查看</th></tr></thead><tbody>'+rows.map(([name,project,sub,doc])=>'<tr><td>'+B(name,'doc',doc,'')+'<small>'+sub+'</small></td><td>'+project+'</td><td>'+B(I('arrow'),'doc',doc,'icon-button')+'</td></tr>').join('')+'</tbody></table>'}return '<div class="page">'+breadcrumb(['<span>工作空间</span>','<span>'+title+'</span>'])+'<div class="page-head"><div><h1>'+title+'</h1><p class="subtitle">'+desc+'</p></div></div>'+content+'</div>'}
function docBody(id){const t=T(state.docOwner||state.task);const tables='<table class="doc-table"><thead><tr><th>页面区域</th><th>回答的问题</th></tr></thead><tbody><tr><td>待我处理</td><td>什么需要我判断或介入？</td></tr><tr><td>继续推进</td><td>手头工作到哪里了？</td></tr><tr><td>项目变化</td><td>最近发生了什么？</td></tr><tr><td>常用入口</td><td>怎样回到需要的资料？</td></tr></tbody></table>';const diagram='<div class="doc-diagram"><div class="diagram-node">共同的目标与当前事实</div><div class="diagram-arrow">↓</div><div class="diagram-row"><div class="diagram-node">人 · 判断与验收</div><div class="diagram-node">智能体 · 执行与交付</div></div><div class="diagram-arrow">↓</div><div class="diagram-node">同一份代码、文档与工作成果</div></div>';if(id==='proposal')return '<p>从日常关心的事情出发，逐步进入具体工作、项目和共享资料。</p><div class="quote">首页让人知道：现在值得关注什么，以及下一步可以做什么。</div><h2>先展示四类内容</h2>'+tables+'<h2>任务怎样出现</h2><ul><li>按需要关注的原因组织首页，不把全部历史混入当前工作。</li><li>跨项目查看，在每条记录上保留所属范围。</li><li>先展示目标、进展和成果，再展开详细依据。</li></ul><h2>这次需要确认</h2><p>四个区域是否符合你的日常关注顺序？哪些内容应该更靠前，哪些可以收起来？</p>';if(id==='prototype')return '<p>以现有顶部双入口和侧边导航为基础，增加日常工作概览。</p>'+tables+'<h2>主要浏览路径</h2><div class="doc-diagram"><div class="diagram-node">概览 · 发现关注事项</div><div class="diagram-arrow">↓</div><div class="diagram-node">任务 · 了解进展与下一步</div><div class="diagram-arrow">↓</div><div class="diagram-node">并排阅读成果 · 作出判断</div><div class="diagram-arrow">↓</div><div class="diagram-node">项目 · 继续了解业务与实现</div></div><p>返回时保留列表筛选与阅读位置。</p>';if(id==='report')return '<span class="badge green">已有范围内通过</span><h2>检查了什么</h2><ul><li>主要阅读路径和相关对象的跳转。</li><li>范围筛选后的列表与详情是否一致。</li><li>资料不可用时，其他内容是否可以继续查看。</li></ul><h2>未覆盖范围</h2><p>外部系统执行、真实发布与生产环境结果不在这份示例报告中。</p><h2>结果说明</h2><p>报告只表达检查范围内的观察结果。是否完成整体目标，仍需结合目标和实际成果判断。</p>';if(id==='environment')return '<p>团队工具的接入范围已整理，下一步需要选择用于验证的环境。</p><h2>两个可选方向</h2><table class="doc-table"><tr><th>方向</th><th>影响</th></tr><tr><td>使用现有测试环境</td><td>可更快开始，需协调共享使用时间。</td></tr><tr><td>单独准备新环境</td><td>范围更独立，需要额外准备和维护。</td></tr></table><h2>需要补充</h2><p>确认可用的环境与范围后，智能体（Agent）可以继续检查接入条件。</p>';if(id==='scope')return '<h2>要达成什么</h2><p>'+t.intent+'</p><h2>当前进展</h2><p>'+t.summary+'</p><h2>下一步</h2><p>'+t.next+'</p><h2>相关范围</h2><p>'+P(t.project).name+' · '+P(t.project).services.join('、')+'</p>';if(id==='daily')return '<p>9 月 19 日 · 摘要截至 16:30</p><h2>新增了什么</h2><p>项目知识增加了从架构文章进入技术图和代码位置的阅读路径。</p><h2>更新了什么</h2><p>服务与代码库的引用关系已整理，多个项目可使用共同服务。</p><h2>删除了什么</h2><p>合并了重复的资料入口，减少相同内容的多处维护。</p><h2>有什么弊端</h2><p>部分旧链接仍需按原定位查看。日摘要只覆盖选定的本地提交范围。</p><div class="divider"></div><p class="small muted">来源：所选项目的本地 Git 提交。未覆盖未提交改动及未获取的远端内容。</p>';if(id==='knowledge'||id==='architecture')return '<p>从同一份事实理解业务职责、协作关系和代码实现。</p><h2>产品与工作如何连接</h2>'+diagram+'<h2>从这里继续阅读</h2>'+artifacts(['architecture','service','method'].filter(x=>x!==id))+'<h2>阅读线索</h2><p>项目说明业务目标；服务说明实现职责；代码库保留具体代码来源。同一服务可以为多个项目所用。</p>';if(id==='service')return '<span class="badge teal">服务资料</span><h2>职责</h2><p>为当前业务提供明确的实现能力，并保留与项目和代码位置的关联。</p><h2>相关代码库</h2><div class="relation-card"><h3>buildr</h3><p>主要开发分支：dev</p></div><h2>继续查看</h2>'+artifacts(['architecture','report']);if(id==='article')return '<p>好的协作从共同理解当前情况开始。对话表达目标，页面承接阅读和判断，代码与文档保存具体成果。</p><h2>让工作可以接续</h2><p>下一位参与者应当能直接找到目标、当前进展、成果和依据，不必重新阅读全部对话。</p><h2>把长期内容放回工作范围</h2><p>日常入口可以引用内容，正式内容仍由所属项目和工作空间维护。</p>';return '<p>从一个明确目标开始，在实际工作中选择合适方法，持续形成可以查看和接续的成果。</p><h2>理解当前情况</h2><p>先核对真实代码、文档、数据和已有结果，再判断下一步。</p><h2>保留必要判断</h2><p>人提供目标与重要决定；智能体（Agent）在明确范围内推进工作。</p><h2>以结果接续</h2><p>每次继续时重新查看当前事实，说明新成果、未完成部分和下一步。</p>'}

function pageContent(){let content=state.view==='home'?home():state.view==='tasks'?tasksPage():state.view==='task'?taskPage():state.view==='activity'?activityPage():state.view==='workspace'?workspacePage():state.view==='project'?projectPage():catalogPage();return '<div class="reading-layout '+(state.doc?'has-reader':'')+'">'+content+(state.doc?reader():'')+'</div>'}
function render(){document.getElementById('app').innerHTML=shell();document.title=(state.view==='task'?T(state.task).title:state.view==='project'?P(state.projectId).name:state.view==='home'?'工作概览':state.view==='tasks'?'任务':state.view==='activity'?'动态':'工作空间')+' · Buildr 原型';renderModal()}
let toastTimer;function toast(text){document.getElementById('toast-root').innerHTML='<div class="toast" role="status">'+I('check')+E(text)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',2800)}
function go(view,value,replace=false){state.doc=null;state.modal=null;state.view=view;if(view==='task'){state.task=value||state.task;state.tab='overview'}if(view==='project')state.projectId=value||state.projectId;const hash='#'+view+(view==='task'?'/'+state.task:view==='project'?'/'+state.projectId:'');if(replace)history.replaceState(null,'',hash);else if(location.hash!==hash)history.pushState(null,'',hash);render();window.scrollTo(0,0)}

function renderModal(){let html='';const t=T(state.task);if(state.modal==='scenario')html=modalFrame('查看不同场景','<p style="margin-bottom:15px">切换示例内容，查看页面怎样处理不同情况。</p>'+[['normal','日常工作','包含待处理事项、进行中工作与近期变化'],['empty','刚开始使用','工作记录为空时的开始方式'],['error','局部读取失败','保留任务，仅项目变化读取失败'],['loading','正在读取','加载过程中保留页面结构']].map(([k,n,d])=>'<button class="scenario-option '+(state.scenario===k?'selected':'')+'" data-action="set-scenario" data-value="'+k+'">'+I(k===state.scenario?'check':'home')+'<span><strong>'+n+'</strong><small>'+d+'</small></span></button>').join('')+'<p class="modal-note">页面使用示例数据，所有操作仅改变当前演示。</p>',B('重置本次演示','reset','','button sm'));if(state.modal==='workspace')html=modalFrame('工作空间','<button class="scenario-option selected" data-action="close-modal">'+I('folder')+'<span><strong>Buildr</strong><small>当前示例空间 · 3 个项目</small></span>'+I('check')+'</button><p class="modal-note">本原型展示一个工作空间内的跨项目浏览。</p>');if(state.modal==='decision')html=modalFrame(t.attention==='acceptance'?'记录验收意见':'记录我的决定','<span class="badge amber">'+(attentionText[t.attention]||'当前事项')+'</span><h3 style="margin:13px 0 5px">'+t.title+'</h3><p>'+t.reason+'</p><label for="decision-text">你的意见与下一步</label><textarea id="decision-text" placeholder="写下你确认的方向，或需要调整的地方…">'+E(state.draftDecision)+'</textarea><p class="modal-note">保存后，这条事项从“待我处理”移出；工作状态仍按实际进展保留。</p>',B('取消','close-modal','','button')+B('保存决定','save-decision','','button primary'));if(state.modal==='goal')html=modalFrame('提出新目标','<p>描述想解决的问题和期望结果，带着当前范围交给智能体（Agent）继续。</p><label for="goal-project">工作范围</label><select id="goal-project" class="select" style="width:100%;max-width:none">'+projects.map(p=>'<option value="'+p.id+'" '+((state.project==='all'?'product':state.project)===p.id?'selected':'')+'>'+p.name+'</option>').join('')+'</select><label for="goal-text">希望完成什么？</label><textarea id="goal-text" placeholder="例如：梳理首次接入项目的体验，先给我看改进方案。">'+E(state.draftGoal)+'</textarea>',B('取消','close-modal','','button')+B('准备工作指令'+I('arrow'),'prepare-goal','','button primary'));if(state.modal==='prompt')html=modalFrame('交给智能体继续','<p>把当前目标、范围和必要资料一起带入后续工作。</p><label for="handoff-text">工作指令</label><textarea id="handoff-text" readonly style="min-height:215px">'+E(state.prompt)+'</textarea><p class="modal-note">此处只准备指令，尚未启动执行或创建真实记录。</p>',B('返回页面','close-modal','','button')+B(I('copy')+'复制指令','copy-prompt','','button primary'));if(state.modal==='search')html=modalFrame('查找工作与资料','<label class="search" style="margin:0">'+I('search')+'<input id="global-search" placeholder="输入工作、项目或资料名称" aria-label="全局搜索"></label><div id="global-results" class="global-search-list">'+globalResults('')+'</div>');if(state.modal==='resources')html=modalFrame('常用入口',resources.map(r=>'<div class="row" style="border-bottom:1px solid var(--line)"><button class="bookmark-row grow" data-action="modal-doc" data-value="'+r.id+'"><span class="resource-icon">'+I(r.icon)+'</span><span><strong>'+r.name+'</strong><small>'+P(r.project).name+' · '+r.type+'</small></span></button>'+iconButton('star','save-resource',r.id,state.saved.has(r.id)?'取消收藏：'+r.name:'收藏：'+r.name,state.saved.has(r.id)?'save-toggle':'')+'</div>').join(''));if(state.modal==='new-project')html=modalFrame('添加项目','<p>在完整产品中，可基于业务目标建立新的项目范围。</p><p style="margin-top:12px">这版原型先用三个示例项目，帮助你体验跨项目关注与深入浏览。</p>',B('查看示例项目','show-projects','','button primary'));document.getElementById('modal-root').innerHTML=html;document.body.style.overflow=html?'hidden':'';}
function globalResults(q){const hits=tasks.filter(t=>!q||(t.title+t.code).toLowerCase().includes(q.toLowerCase())).slice(0,5),rs=resources.filter(r=>!q||r.name.includes(q));return hits.map(t=>'<button class="search-result" data-action="search-task" data-value="'+t.id+'">'+I('tasks')+'<span><strong>'+t.title+'</strong><small>'+P(t.project).name+' · '+statusText[t.status]+'</small></span></button>').join('')+rs.map(r=>'<button class="search-result" data-action="modal-doc" data-value="'+r.id+'">'+I(r.icon)+'<span><strong>'+r.name+'</strong><small>'+r.type+'</small></span></button>').join('')+(hits.length+rs.length===0?'<p class="muted" style="padding:22px;text-align:center">没有匹配的工作或资料</p>':'')}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;if(a==='modal-backdrop'&&event.target!==el)return;if(a==='nav'){remember();go(v)}else if(a==='task'||a==='search-task'){remember();if(state.view!=='task')state.returnView=state.view;go('task',v)}else if(a==='return-task')returnTask();else if(a==='project'){remember();go('project',v)}else if(a==='project-tasks'){state.project=v;state.status='open';go('tasks')}else if(a==='collapse'){state.collapsed=!state.collapsed;render()}else if(a==='task-status'){state.status=v;state.query='';go('tasks')}else if(a==='group'){state.group=!state.group;render()}else if(a==='clear-filters'){state.project='all';state.status='all';state.query='';render()}else if(a==='pin'){T(v).pinned=!T(v).pinned;render();toast(T(v).pinned?'已置顶这项工作':'已取消置顶')}else if(a==='plan-next'){T(v).planned=!T(v).planned;render();toast(T(v).planned?'已加入接下来准备做的工作':'已从接下来移出，仍保留在待办中')}else if(a==='snooze'){state.snoozed.add(v);render();toast('已收起关注提醒，仍可在任务中查看')}else if(a==='book-tab'){state.bookTab=v;render()}else if(a==='doc'){openDoc(v)}else if(a==='close-doc'){state.doc=null;render()}else if(a==='save-doc'||a==='save-resource'){state.saved.has(v)?state.saved.delete(v):state.saved.add(v);render();toast(state.saved.has(v)?'已加入常用入口':'已取消收藏')}else if(a==='follow'){state.following.has(v)?state.following.delete(v):state.following.add(v);render();toast(state.following.has(v)?'已关注这个项目':'已取消关注')}else if(a==='detail-tab'){state.tab=v;render()}else if(a==='decision'){state.task=v;state.draftDecision='';showModal('decision')}else if(a==='save-decision'){const text=document.getElementById('decision-text').value.trim();if(!text){toast('请先写下你的意见');document.getElementById('decision-text').focus();return}const t=T(state.task);t.resolved=true;t.decision=text;t.summary='已记录你的决定，后续按确认的方向继续。';state.modal=null;render();toast('决定已保存到本次演示')}else if(a==='new-goal'){state.draftGoal='';showModal('goal')}else if(a==='prepare-goal'){const goal=document.getElementById('goal-text').value.trim();if(!goal){toast('请先描述希望完成什么');document.getElementById('goal-text').focus();return}state.draftGoal=goal;state.prompt='请在 Buildr 工作空间的「'+P(document.getElementById('goal-project').value).name+'」范围内开展工作。\n\n目标：'+goal+'\n\n请先核对当前事实、已有成果和相关规则，再提出下一步。需要我作出业务判断时，说明具体事项与影响。';showModal('prompt')}else if(a==='continue'){const t=T(v);if(['completed','abandoned'].includes(t.status)){state.project=t.project;state.draftGoal='基于「'+t.title+'」的已有成果，继续处理：';showModal('goal');return}state.prompt='请继续「'+t.title+'」。\n\n所属范围：'+P(t.project).name+'\n目标：'+t.intent+'\n最近进展：'+t.summary+'\n下一步：'+t.next+'\n\n请重新核对当前成果和范围，再在已有授权内继续；需要我判断的事项请明确说明。';showModal('prompt')}else if(a==='copy-prompt'){try{await navigator.clipboard.writeText(state.prompt);toast('工作指令已复制')}catch{const text=document.getElementById('handoff-text');text.select();toast('请复制已选中的工作指令')}}else if(a==='close-modal'){state.modal=null;renderModal()}else if(a==='modal-backdrop'){state.modal=null;renderModal()}else if(a==='search')showModal('search');else if(a==='resources')showModal('resources');else if(a==='modal-doc'){state.modal=null;openDoc(v)}else if(a==='scenario')showModal('scenario');else if(a==='set-scenario'){state.scenario=v;go('home')}else if(a==='refresh'){state.scenario='loading';render();setTimeout(()=>{state.scenario='normal';render();toast('已更新本次示例内容')},850)}else if(a==='retry'){state.scenario='normal';render();toast('项目变化已恢复')}else if(a==='workspace-menu')showModal('workspace');else if(a==='reset'){location.reload()}else if(a==='new-project')showModal('new-project');else if(a==='show-projects')go('workspace');});
document.addEventListener('change',event=>{if(event.target.id==='project-filter'){state.project=event.target.value;render()}});
document.addEventListener('input',event=>{if(event.target.id==='task-search'){state.query=event.target.value;document.getElementById('task-results').innerHTML=taskResults(filteredTasks())}if(event.target.id==='global-search')document.getElementById('global-results').innerHTML=globalResults(event.target.value);if(event.target.id==='goal-text')state.draftGoal=event.target.value;if(event.target.id==='decision-text')state.draftDecision=event.target.value;});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.modal){state.modal=null;renderModal()}else if(state.doc){state.doc=null;render()}}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();showModal('search')}if(event.key==='Tab'&&state.modal){const focusable=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select')].filter(el=>!el.disabled),first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}});
function routeFromHash(){const [view,id]=location.hash.slice(1).split('/');const allowed=['home','tasks','task','activity','workspace','project','services','repositories','skills','articles','settings'];state.view=allowed.includes(view)?view:'home';if(state.view==='task')state.task=tasks.some(t=>t.id===id)?id:'workbench';if(state.view==='project')state.projectId=projects.some(p=>p.id===id)?id:'product';state.doc=null;state.modal=null;render()}
window.addEventListener('popstate',routeFromHash);routeFromHash();
