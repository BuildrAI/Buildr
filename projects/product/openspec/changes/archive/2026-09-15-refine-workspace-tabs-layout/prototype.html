<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buildr · 自适应宽度与分屏交互原型 · 第二版</title><style>
:root{--green:#377f75;--line:#e2e7eb;--muted:#7c8793}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29313a;background:white}button,input,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:7px;padding:7px 12px;color:inherit}button:hover{background:#f0f6f4}button:focus-visible{outline:2px solid var(--green)}header{height:60px;display:flex;align-items:center;gap:26px;padding:0 28px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:650}.logo,.icon{background:var(--green);color:white;border-radius:9px;padding:8px 11px}.badge{font-size:11px;color:#a47526;background:#fff5dd;padding:4px 7px;border-radius:6px}.topactive{height:60px;display:flex;align-items:center;border-bottom:2px solid var(--green)}.spacer{flex:1}.primary{background:var(--green);color:white;border-color:var(--green)}.frame{display:flex;height:calc(100vh - 60px)}aside{width:224px;flex:none;padding:16px 12px;border-right:1px solid var(--line)}aside button{display:block;width:100%;text-align:left;border:0;margin-bottom:5px;padding:10px 12px}aside button.active{background:#ebf3f0;color:var(--green)}#stage{position:relative;flex:1;min-width:0;overflow:hidden}.tabs{height:44px;background:#f5f6f8;border-bottom:1px solid var(--line);display:flex;gap:3px;align-items:end;padding:5px 10px 0;overflow:auto}.tab{border-radius:9px 9px 0 0;white-space:nowrap;background:transparent;border-color:transparent;display:flex;align-items:center;gap:10px;font-size:12px;height:37px;flex:none}.tab.on{background:white;border-color:var(--line);border-bottom-color:white}.dot{color:var(--green)}.x{color:#99a3ac;padding:2px}.tab.dragging{opacity:.4}.body{height:calc(100% - 44px);overflow:auto}.content{width:var(--content-width);max-width:calc(100% - 64px);margin:26px auto 60px}.pane{height:100%;position:absolute;top:0}.left{left:0;width:100%;container-type:inline-size}.right{right:0;background:white;border-left:1px solid var(--line);display:none}.right.show{display:block}.right .content{width:auto;max-width:none;margin:24px}.divider{position:absolute;top:44px;bottom:0;width:10px;cursor:col-resize;z-index:10;display:none;touch-action:none}.divider:after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px}.divider:hover:after,.divider:focus:after{background:var(--green)}.moving{transition:width 200ms ease,left 200ms ease,transform 200ms ease}.hero{padding:24px;background:linear-gradient(120deg,#edf5f2,#fff);border:1px solid var(--line);border-radius:14px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:6px}h1{font-size:25px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:16px;margin:0}p{line-height:1.7;color:var(--muted);margin:8px 0}.row{display:flex;align-items:center;gap:9px}.stats{display:flex;gap:40px;border-top:1px dashed #dbe4df;margin-top:19px;padding-top:16px}.stats b{font-size:25px;color:var(--green);display:block}.stats small{color:var(--muted)}.section{border:1px solid var(--line);border-radius:13px;padding:20px;margin-top:18px}.section-title{display:flex;align-items:center;gap:9px;margin-bottom:16px}.section-title small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{width:100%;text-align:left;padding:18px;display:flex;align-items:flex-start;gap:13px;border-radius:11px;min-width:0}.card:hover{border-color:#8cb6a9;box-shadow:0 3px 12px #377f7510}.card p{font-size:13px;margin:5px 0 8px}.card strong{font-size:14px}.card .copy{min-width:0}.code{font-size:11px;color:var(--muted);margin-left:8px;overflow-wrap:anywhere}.blue{background:#4d82da}.pill{display:inline-block;font-size:11px;padding:2px 6px;border:1px solid #cfe0ff;background:#f0f5ff;color:#4a7ac5;border-radius:4px;margin-right:5px}.pill.gold{color:#b48537;background:#fff8e9;border-color:#eed6ab}.pill.green{color:#578549;background:#f4faee;border-color:#d6e7ca}.doc{display:flex;width:100%;border:0;border-bot /* 第二版：延续正式页面的尺寸与柔和边界。 */
header{height:56px;gap:24px}.topactive{height:56px}.frame{height:calc(100vh - 56px)}aside{width:224px;padding:12px 10px}aside button{min-height:34px;padding:7px 10px;font-size:13px}.content{margin-top:24px}.hero{padding:22px;border-radius:14px;background:linear-gradient(145deg,#edf4f2,#fff)}.section{padding:18px;margin-top:16px}.card{padding:14px 16px;gap:12px;min-height:114px}.icon{min-width:38px;text-align:center}.stats{gap:34px}.doc{padding:14px 4px}.tab{gap:7px;font-size:12.5px;touch-action:none;user-select:none;transition:background 120ms,color 120ms}.x{border-radius:4px}.x:hover{background:#e6ebee;color:#52616b}.drag-slot{background:#e1eee9!important;color:transparent!important;border:1px dashed #8db5a8!important}.drag-slot>*{visibility:hidden}.drag-ghost{position:fixed;z-index:100;pointer-events:none;background:#fff!important;border:1px solid #88ad9f!important;box-shadow:0 6px 20px #284c3a26;opacity:.98}.dragging-tabs,.dragging-tabs *{cursor:grabbing!important;user-select:none}.divider{top:0;background:#f8faf9}.divider:after{background:#d9e3de;width:1px}.divider:before{content:"";position:absolute;top:48%;left:2px;width:5px;height:32px;border-radius:4px;background:#b7c8c0}.divider:hover:after{width:2px}.detail-toolbar{display:flex;justify-content:flex-end;margin:0 0 14px}.right .content{margin:20px}.right .tabs{padding-right:44px}.right .tabs>button:last-child{position:absolute;right:6px;top:7px;height:28px;padding:3px 9px;background:#fff}.body{scrollbar-gutter:stable}.content{max-width:calc(100% - 48px)}.right pre{overflow-wrap:anywhere}.right.show{animation:panel-in 160ms ease-out}@keyframes panel-in{from{opacity:.7;transform:translateX(8px)}to{opacity:1;transform:none}}@container(max-width:720px){.cards{grid-template-columns:1fr}.stats{gap:22px}.doc{flex-wrap:wrap}.doc span:not(.arrow){font-size:12px}}@media(prefers-reduced-motion:reduce){.right.show{animation:none}.tab{transition:none}}
</style></head><body>
<header><div class="brand"><span class="logo">B</span>Buildr Web <span class="badge">原型 · 第二版</span></div><button onclick="notice('当前演示工作空间：Buildr')">工作空间　<b>Buildr</b>⌄</button><span>工作台</span><b class="topactive">工作空间</b><span class="spacer"></span><button onclick="notice('独立演示，无真实写入')">退出</button><button class="primary" onclick="notice('原型演示：正式操作将交给 Agent')">＋ 交给 Agent</button></header>
<div class="frame"><aside><button data-nav="projects" onclick="openPage('projects')">▱　项目</button><button data-nav="services" onclick="openPage('services')">▦　服务</button><button data-nav="skills" onclick="openPage('skills')">ϟ　技能</button><button data-nav="settings" onclick="openPage('settings')">⚙　设置</button></aside><main id="stage"><section class="pane left" id="left"><nav class="tabs" id="tabs" aria-label="打开的页面"></nav><div class="body" id="leftbody"><div class="content" id="content"></div></div></section><div id="divider" class="divider" role="separator" aria-label="调整分屏宽度" tabindex="0"></div><section class="pane right" id="right"><nav class="tabs" id="rtabs"></nav><div class="body"><div class="content" id="detail"></div></div></section></main></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id), titles={project:'Buildr 产品',projects:'项目目录',services:'服务目录',skills:'技能',settings:'设置',backend:'Buildr 后端',frontend:'Buildr 前端'};let tabs=['project','services','projects'],active='project',objects=[],obj=null,rightWidth=0,manual=false,dragged=null;const scrolls={};
try{const saved=JSON.parse(localStorage.getItem('buildr-prototype-tabs'));if(Array.isArray(saved)&&saved.length&&saved.every(t=>titles[t]))tabs=saved}catch{}
function notice(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function save(){localStorage.setItem('buildr-prototype-tabs',JSON.stringify(tabs))}
let suppressClick=false;
function bindDrag(host,items,attr,persist){
 const els=[...host.querySelectorAll('['+attr+']')];
 els.forEach(el=>{el.onpointerdown=e=>{
 if(e.button!==0||e.target.closest('.x'))return;
 const key=el.getAttribute(attr),start=e.clientX,rect=el.getBoundingClientRect();let moving=false,ghost=null;
 e.preventDefault();
 document.onpointermove=v=>{
 if(!moving&&Math.abs(v.clientX-start)<5)return;
 if(!moving){moving=true;ghost=el.cloneNode(true);ghost.removeAttribute(attr);ghost.classList.add('drag-ghost');Object.assign(ghost.style,{left:rect.x+'px',top:rect.y+'px',width:rect.width+'px',height:rect.height+'px'});document.body.append(ghost);el.classList.add('drag-slot');document.body.classList.add('dragging-tabs')}
 ghost.style.transform='translateX('+(v.clientX-start)+'px)';
 const others=[...host.querySelectorAll('['+attr+']')].filter(x=>x!==el);let index=others.filter(x=>{let r=x.getBoundingClientRect();return v.clientX>r.x+r.width/2}).length;
 if(items.indexOf(key)!==index){const before=new Map([...host.children].map(x=>[x,x.getBoundingClientRect().x]));items.splice(items.indexOf(key),1);items.splice(index,0,key);items.forEach(k=>host.append(host.querySelector('['+attr+'="'+k+'"]')));host.querySelectorAll('['+attr+']').forEach(x=>{if(x!==el){const dx=before.get(x)-x.getBoundingClientRect().x;if(dx&&!matchMedia('(prefers-reduced-motion: reduce)').matches)x.animate([{transform:'translateX('+dx+'px)'},{transform:'translateX(0)'}],{duration:160,easing:'ease-out'})}})}
 };
 const end=()=>{document.onpointermove=null;document.onpointerup=null;document.onpointercancel=null;if(moving){suppressClick=true;setTimeout(()=>suppressClick=false,80);el.classList.remove('drag-slot');document.body.classList.remove('dragging-tabs');const dest=el.getBoundingClientRect();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const anim=ghost.animate([{transform:ghost.style.transform},{transform:'translateX('+(dest.x-rect.x)+'px)'}],{duration:130,easing:'ease-out'});anim.onfinish=()=>ghost.remove()}else ghost.remove();persist()}};
 document.onpointerup=end;document.onpointercancel=end;
 }});
}
function renderTabs(){ $('tabs').innerHTML=tabs.map(t=>`<button class="tab ${active===t?'on':''}" data-tab="${t}" aria-label="切换到${titles[t]}"><span class="dot">●</span>${titles[t]}<span class="x" role="button" aria-label="关闭${titles[t]}">×</span></button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(el=>{el.onclick=e=>{if(suppressClick)return;e.target.closest('.x')?closePage(el.dataset.tab):openPage(el.dataset.tab)};el.onkeydown=e=>{if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();let i=tabs.indexOf(el.dataset.tab),j=Math.max(0,Math.min(tabs.length-1,i+(e.key==='ArrowLeft'?-1:1)));[tabs[i],tabs[j]]=[tabs[j],tabs[i]];save();renderTabs()}}});bindDrag($('tabs'),tabs,'data-tab',save);
 document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===(active==='project'?'projects':active==='backend'||active==='frontend'?'services':active)))}
function openPage(t){scrolls[active]=$('leftbody').scrollTop;active=t;if(!tabs.includes(t))tabs.push(t);save();renderTabs();$('content').innerHTML=page(t);$('content').classList.remove('fade');void $('content').offsetWidth;$('content').classList.add('fade');$('leftbody').scrollTop=scrolls[t]||0;layout()}
function closePage(t){let i=tabs.indexOf(t);tabs=tabs.filter(x=>x!==t);if(!tabs.length)tabs=['projects'];if(active===t)openPage(tabs[Math.max(0,i-1)]||tabs[0]);else renderTabs();save()}
const svc=(key,name,code,desc,front=false)=>`<button class="card" onclick="${active==='services'?'openPage':'openObject'}('${key}')"><span class="icon ${front?'blue':''}">${front?'前':'后'}</span><div class="copy"><strong>${name}</strong><span class="code">${code}</span><p>${desc}</p><span class="pill">应用</span><span class="pill gold">${front?'本地路径':'Git'}</span><span class="pill green">可用</span></div><span class="arrow">→</span></button>`;
const cards=()=>svc('backend','Buildr 后端','buildr','Buildr 的 CLI、本机应用运行与打包发布实现。')+svc('frontend','Buildr 前端','buildr-web','Buildr Web React/Vite 前端源码与正式构建。',true);
const docs=()=>['README.md','AGENTS.md','每日演进'].map((s,i)=>`<button class="doc" onclick="openObject('${s}')">▤ <b>${s}</b><span>${['项目说明与入口','规则与授权边界','按提交范围生成的四问摘要'][i]}</span><span class="arrow">→</span></button>`).join('');
function page(t){if(t==='project')return `<div class="hero"><div class="row"><div><div class="eyebrow">项目</div><h1>Buildr 产品</h1></div><span class="spacer"></span><button onclick="notice('原型演示：编辑项目')">编辑项目</button></div><p>Buildr 自身产品实现，围绕工作空间、智能体协作与交付组织长期工作资产。</p><div class="stats">${[['2','已登记服务'],['3','项目文档'],['12','每日演进'],['4','进行中变更']].map(x=>`<div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div></div><section class="section"><div class="section-title"><h2>服务</h2><small>2 个已登记</small><span class="spacer"></span><button onclick="notice('原型演示：接入服务')">＋ 接入服务</button></div><div class="cards">${cards()}</div></section><section class="section"><div class="section-title"><h2>文档</h2><small>3 份</small></div>${docs()}</section><div class="foot">所属工作空间 Buildr · 登记于 2026–08–20</div>`;
if(t==='projects')return `<div class="row"><h1>项目</h1><span class="spacer"></span><span>1 个项目</span><button onclick="notice('原型演示：创建项目')">＋ 创建项目</button></div><p>选择项目进入全景，查看其文档与所属服务。</p><section class="section"><button class="doc" onclick="openPage('project')"><b>Buildr 产品</b><span>Buildr 自身产品实现与工作空间治理</span><span class="arrow">→</span></button></section>`;
if(t==='services')return `<h1>服务目录</h1><p>查看当前工作空间中已登记的服务。</p><section class="section"><div class="cards">${cards()}</div></section>`;
if(t==='skills')return `<h1>技能</h1><p>查看工作空间中可用的专业能力。</p><section class="section">${['界面原型','体验设计','代码架构','任务验证'].map(x=>`<button class="doc" onclick="openObject('${x}')">ϟ <b>${x}</b><span>已安装 · 可用</span><span class="arrow">→</span></button>`).join('')}</section>`;
if(t==='settings')return `<h1>设置</h1><p>当前工作空间的基本信息。</p><section class="section"><h2>工作空间</h2><p>名称</p><input aria-label="工作空间名称" value="Buildr" style="padding:10px;border:1px solid #ddd;border-radius:6px;width:360px;max-width:100%"><p><button onclick="notice('已保存演示设置，仅本页有效')">保存</button></p></section>`;
return detail(t)}
function detail(t){if(t==='backend'||t==='frontend')return `<div class="hero"><div class="eyebrow">服务</div><h1>${titles[t]}</h1><p>${t==='backend'?'Buildr CLI、本机应用、运行与打包发布。':'Buildr Web React/Vite 前端源码与正式构建。'}</p><span class="pill">应用</span><span class="pill green">可用</span></div><section class="section"><h2>所属项目</h2><button class="doc" onclick="openPage('project')">▱　Buildr 产品<span class="arrow">→</span></button></section><section class="section"><h2>文档</h2>${docs()}</section>`;return `<h1>${t}</h1><p>Buildr 产品</p><section class="section"><h2>${t==='每日演进'?'最近演进':'项目说明'}</h2><p>Buildr 围绕真实工作现场，帮助人和智能体共同维护工作资产。</p><pre>工作空间\n  项目 · 长期工作单元\n  服务 · 可执行资产\n  文档 · 当前知识与规则</pre><p>本页为交互演示内容，用于比较并排阅读体验。</p></section>`}
function openObject(t){if(!objects.includes(t))objects.push(t);obj=t;renderRight();layout(true)}
function closeObject(t){objects=objects.filter(x=>x!==t);obj=objects.at(-1);renderRight();layout(true)}
function renderRight(){$('rtabs').innerHTML=objects.map(t=>`<button class="tab ${t===obj?'on':''}" onclick="openObject('${t}')">${titles[t]||t}<span class="x" role="button" aria-label="关闭右侧${titles[t]||t}" onclick="event.stopPropagation();closeObject('${t}')">×</span></button>`).join('')+(objects.length?`<button style="margin:0 0 5px auto" aria-label="关闭右侧分屏" onclick="objects=[];obj=null;renderRight();layout(true)">×</button>`:'');$('detail').innerHTML=obj?((obj==='backend'||obj==='frontend')?`<div class="detail-toolbar"><button onclick="openPage('${obj}');closeObject('${obj}')">在主区域打开 ↗</button></div>`:'')+detail(obj):''}
function baseWidth(){return Math.min(1440,Math.max(900,$('stage').clientWidth*.675),$('stage').clientWidth-64)}
function layout(animate=false){const s=$('stage').clientWidth,c=baseWidth(),opened=objects.length>0;let r=manual?rightWidth:Math.min(640,Math.max(360,s-c-73));r=Math.min(Math.max(260,s-369),Math.max(260,r));$('stage').style.setProperty('--content-width',c+'px');$('left').classList.toggle('moving',animate);$('right').classList.toggle('show',opened);$('right').classList.remove('overlay');$('left').style.width=opened?s-r-9+'px':'100%';$('right').style.width=r+'px';$('divider').style.display=opened?'block':'none';$('divider').style.right=r+'px';$('divider').setAttribute('aria-valuemin',260);$('divider').setAttribute('aria-valuemax',Math.round(s-369));$('divider').setAttribute('aria-valuenow',Math.round(r));rightWidth=r}
$('divider').onpointerdown=e=>{e.preventDefault();$('divider').setPointerCapture(e.pointerId);manual=true;$('left').classList.remove('moving');$('divider').onpointermove=v=>{rightWidth=$('stage').getBoundingClientRect().right-v.clientX;layout()};$('divider').onpointerup=()=>{$('divider').onpointermove=null}};
$('divider').onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();manual=true;rightWidth+=(e.key==='ArrowLeft'?24:-24);layout()}};
window.addEventListener('resize',()=>layout());renderRight();openPage(active);
</script></body></html>
