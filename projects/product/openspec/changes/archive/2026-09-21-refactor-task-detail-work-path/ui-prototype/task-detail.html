const scenarios={

 if(state.scenario==='review')items=[['11:26','方案进入修订','根据两个问题完善版本边界。','design'],['11:12','第一轮方案审查结束','需要修改，已记录问题与建议。','planning'],['10:08','本次范围已授权实施','按既定范围自主推进至提交验收。','authorization']];

 else if(state.scenario==='acceptance')items=[['16:32','开发验证已有完整结论','受影响的检查通过，成果可供验收。','verification'],['15:36','实现复审通过','保存冲突的修复已核对。','review'],['15:28','修复保存冲突','旧页面提交不会覆盖新的确认。','implementation']];
 else if(state.scenario==='change')items=[['16:08','新增批量确认诉求','超出原定单篇处理范围，等待决定。','requirements'],['15:56','原范围验证完成','原有成果和验证结论继续保留。','verification'],['15:36','实现复审通过','对应原定范围的实现。','review']];
 else items=[['15:42','开始补充验证','针对保存冲突修复重新检查。','verification'],['15:36','实现复审通过','已核对修正内容和受影响边界。','review'],['15:18','发现一项保存冲突','第一轮验证未通过，已进入修复。','verification']];
 if(!compact&&state.scenario!=='review')items=items.concat([['14:20','完成本轮实现','三个功能点进入实现审查。','implementation'],['12:05','第二轮方案审查通过','两项问题已修订并复核。','planning'],['10:08','明确任务目标与授权','需求在进入任务后补充记录。','requirements']]);
 return '<div class="timeline">'+items.map((it,i)=>'<div class="event '+(i===0?'latest':'')+'"><div class="time">今天 '+it[0]+'</div><div>'+it[1]+'</div><p>'+it[2]+'</p><button class="text-btn" data-action="'+(it[3]==='authorization'?'reader':'node')+'" data-'+(it[3]==='authorization'?'doc':'node')+'="'+it[3]+'">查看相关内容 '+icon('chevron')+'</button></div>').join('')+'</div>';

function requirementContent(){
 const head=contentHead('任务需求','Task Requirements · 在任务推进中补充需要保留的内容','<button class="btn" data-action="edit-requirements">'+icon('edit')+'编辑</button>','01');

function verificationResult(m,full=false){

 return '<div class="node-result"><span>'+(result==='验证中'?'当前进度':'验证结果')+'</span>'+pill(result,passed?'green':result==='未通过'?'red':'amber')+'<p>'+explanation+'</p></div>'+
 '<div class="node-progress"><b>当前进展</b><p>'+progress+'</p>'+(!passed&&m.key!=='config'?'<button class="text-btn" data-action="path-select" data-key="implementation">查看实现 / 修复 '+icon('arrow')+'</button>':'')+'</div>'+

  if(m.attention&&m.attention.key==='requirements')body+='<div class="node-progress"><p>新增批量确认需要你决定。</p><button class="btn primary" data-action="node-decision-edit">记录决定</button></div>';
 }else if(key==='design'){
  body=m.key==='feature'?nodeFile('proposal','提案','proposal.md','为什么做、改变什么、范围是什么。')+nodeFile('design','设计','design.md','实现做法、关键取舍与边界。')+nodeFile('knowledge-spec','规范：知识处理','specs/project-knowledge-browsing/spec.md','知识处理应满足的行为。')+nodeFile('workspace-spec','规范：登记与更新','specs/workspace-asset-management-interactions/spec.md','项目登记和页面更新应满足的行为。'):nodeFile('design','处理说明','已有任务说明','本次修改的做法与影响范围。');
 }else if(key==='implementation'){
  body=nodeFile('tasks',m.key==='feature'?'实施清单':'实现记录',m.key==='feature'?'tasks.md':'已有进展记录','当前完成事项与实现、修复进展。')+'<div class="node-progress"><b>当前进展</b><p>'+ (state.scenario==='repair'?'正在修复保存冲突，之后复审并再次验证。':state.scenario==='review'?'尚未开始开发。':m.next)+'</p></div>';
 }else if(key==='planning'||key==='review')body=reviewRecords(key,m);
 else if(key==='verification')body=verificationResult(m);
 else if(key==='acceptance')body=confirmationRecord(m);
 else body=closeoutRecord(m);
 if(m.key!=='feature'&&key==='requirements')desc='已有的任务目标与说明。';
 if(m.key!=='feature'&&key==='implementation')desc='已有实现记录和当前进展。';
 return '<section class="path-panel node-content-panel" aria-label="所选内容"><header><div><h2>'+label[0]+'<small>（'+label[1]+'）</small></h2><p>'+desc+'</p></div>'+maintenance+'</header>'+body+'</section>';
}
function afterRecord(stage){closeOverlay(false);state.pathSelection=stage;state.node='overview';render();updateHash();}

state.readRef=null;
state.writerActive=false;
state.writerSnapshot=null;
function ensureReadSide(){
 if(document.getElementById('read-side'))return;
 const pane=document.createElement('aside');pane.id='read-side';pane.className='side-reader';pane.hidden=true;pane.setAttribute('aria-label','副屏阅读');document.body.appendChild(pane);
}
function nodeReadDescription(id){
 const m=workCase();
 if(id==='brief')return{title:'需求或说明',file:m.key==='feature'?'brief.md':'已有任务说明',body:()=>{
  let body=briefContent(m);
  if(m.attention?.key==='requirements')body+='<div class="node-progress"><b>待决定</b><p>是否把批量确认纳入本次范围？这会增加设计与验证工作。</p><button class="btn primary" data-action="node-decision-edit">记录决定</button></div>';
  if(state.responded)body+='<div class="node-progress"><b>你的意见</b><p>'+esc(state.response)+'</p></div>';
  return body;
 }};
 if(['proposal','design','knowledge-spec','workspace-spec'].includes(id)){
  const meta={proposal:['提案','proposal.md'],design:['设计','design.md'],'knowledge-spec':['规范：知识处理','specs/project-knowledge-browsing/spec.md'],'workspace-spec':['规范：登记与更新','specs/workspace-asset-management-interactions/spec.md']}[id];
  return{title:meta[0],file:m.key==='feature'?meta[1]:'已有处理说明',body:()=>planContent(id,m)};
 }
 if(id==='tasks')return{title:m.key==='feature'?'实施清单':'实现记录',file:m.key==='feature'?'tasks.md':'已有进展记录',body:()=>implementationContentSimple(m).replace(/<div class="node-direct-link">[\s\S]*?<\/div>$/,'')};
 if(id==='verification')return{title:'验证结果',file:'当前结果与修复进展',body:()=>verificationResult(m,true)};
 if(id==='acceptance')return{title:'用户确认',file:'当前成果与用户意见',body:()=>detailRows(m.changes)+confirmationRecord(m)};
 if(id==='closeout')return{title:'任务收尾',file:'完成摘要与实际交付',body:()=>closeoutRecord(m)};
 return{title:'内容',file:'暂无记录',body:()=>'<div class="node-empty">暂无内容。</div>'};
}
function currentReadDescription(){
 const r=state.readRef;if(!r)return null;
 if(r.kind==='node')return nodeReadDescription(r.id);
 if(r.kind==='review'){
  const m=workCase(),item=reviewItems(r.key,m)[r.index],title=r.key==='planning'?'方案审查':'实现审查';
  if(!item)return{title,file:'暂无记录',body:()=>'<div class="node-empty">暂无该条记录。</div>'};
  return{title:title+' · '+item.when,file:item.object,body:()=>'<article class="node-paper"><div class="row">'+pill(item.passed?'通过':'需要修改',item.passed?'green':'amber')+'</div><h4>审查对象</h4><p>'+item.object+'</p><h4>结论与问题</h4><p>'+item.text+'</p><h4>审查范围</h4><p>'+ (r.key==='planning'?'本次要求、处理办法及其边界。':'本次实际修改、错误处理和与约定的一致性。')+'</p></article>'};
 }
 const d=documents[r.id];return d?{title:d.title,file:d.subtitle,body:d.body}:{title:'内容',file:'暂无记录',body:()=>'<div class="node-empty">暂无内容。</div>'};
}
function paintReadSide(focus=false){
 if(!state.readRef)return;ensureReadSide();const d=currentReadDescription();if(!d)return;
 const el=document.getElementById('read-side');el.hidden=false;
 el.innerHTML='<header class="side-reader-header"><div><span>副屏阅读</span><h2 id="read-title" tabindex="-1">'+d.title+'</h2><p>'+d.file+'</p></div><button class="btn quiet icon" data-action="read-side-close" aria-label="关闭副屏">'+icon('close')+'</button></header><div class="side-reader-body">'+d.body()+'</div>';
 document.body.classList.add('has-read-side');
 if(focus)document.getElementById('read-title').focus({preventScroll:true});
}
function openNodeRead(id){state.readRef={kind:'node',id};paintReadSide(true);}
function closeReadSide(){
 const el=document.getElementById('read-side');if(el){el.hidden=true;el.innerHTML='';}
 document.body.classList.remove('has-read-side');state.readRef=null;state.sheet=null;state.drawer=null;state.trail=[];
}
function openReader(id){
 const direct={design:'design','behavior-spec':'knowledge-spec','implementation-list':'tasks','requirement-entry':'brief','design-entry':'design','delivery-entry':'closeout'};
 if(direct[id])return openNodeRead(direct[id]);
 if(id==='planning-report'||id==='review-report'){const key=id==='planning-report'?'planning':'review';state.readRef={kind:'review',key,index:Math.max(0,reviewItems(key,workCase()).length-1)};paintReadSide(true);return;}
 if(['materials','task-details','needs-and-plan','whole-process'].includes(id)){selectPath(id==='needs-and-plan'?'design':'requirements');return;}
 state.readRef={kind:'legacy',id};paintReadSide(true);
}
function paintSheet(){if(!state.sheet)return;if(state.sheet.type==='stage')goNode(state.sheet.id);else openReader(state.sheet.id);}
function goNode(id){
 if(id==='overview'){closeOverlay(false);return;}
 const direct={requirements:'brief',design:'design',implementation:'tasks',verification:'verification',acceptance:'acceptance',closeout:'closeout'};
 if(direct[id])return openNodeRead(direct[id]);
 if(id==='planning'||id==='review'){state.readRef={kind:'review',key:id,index:Math.max(0,reviewItems(id,workCase()).length-1)};paintReadSide(true);}
}
function modal(title,body,actions){
 state.writerSnapshot={response:state.response,decision:state.decision,reqSaved:state.reqSaved,adjustment:state.adjustment,accepted:state.accepted,responded:state.responded};
 state.writerActive=true;lastFocused=document.activeElement;
 document.getElementById('overlay-root').innerHTML='<div class="overlay writer-overlay" data-action="backdrop-close"><section class="drawer writer-drawer" role="dialog" aria-modal="true" aria-labelledby="writer-title"><header class="drawer-header"><div><span class="writer-label">数据维护</span><h2 id="writer-title">'+title+'</h2></div><span class="spacer"></span><button class="btn quiet icon" data-action="cancel-modal" aria-label="关闭维护抽屉">'+icon('close')+'</button></header><div class="writer-body">'+body+'</div><footer class="writer-footer"><button class="btn" data-action="cancel-modal">取消</button>'+actions+'</footer></section></div>';
 document.body.style.overflow='hidden';(document.querySelector('.writer-drawer textarea')||document.querySelector('.writer-drawer input')||document.querySelector('.writer-drawer button')).focus();
}
function closeOverlay(cancel=true){
 if(state.writerActive&&cancel&&state.writerSnapshot)Object.assign(state,state.writerSnapshot);
 document.getElementById('overlay-root').innerHTML='';document.body.style.overflow='';state.writerActive=false;state.writerSnapshot=null;
 if(cancel&&lastFocused?.isConnected)lastFocused.focus();
}
function cancelModal(){closeOverlay(true);paintReadSide(false);}
function openDecisionDrawer(){modal('记录你的决定',decisionBox(),'');}
function briefEditorText(m){
 if(state.reqSaved)return state.reqSaved;
 if(m.key==='feature'&&state.scenario==='empty')return '';
 return m.goal+'\n\n'+m.needs.map(r=>r[0]+'：'+r[1]).join('\n');
}
const previousRender=render;
render=function(){previousRender();paintReadSide(false);};
const previousChangeCase=changeCase;
changeCase=function(key){closeReadSide();previousChangeCase(key);};
const previousSetScenario=setScenario;
setScenario=function(id){closeReadSide();previousSetScenario(id);};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(action==='node-read'){e.stopImmediatePropagation();openNodeRead(el.dataset.id);}
 else if(action==='node-review-read'){e.stopImmediatePropagation();state.readRef={kind:'review',key:el.dataset.key,index:Number(el.dataset.index)};paintReadSide(true);}
 else if(action==='read-side-close'){e.stopImmediatePropagation();closeReadSide();}
 else if(action==='edit-requirements'){
  e.stopImmediatePropagation();const m=workCase();
  modal('编辑需求或说明','<label class="field" for="requirement-input">内容</label><textarea class="textarea" id="requirement-input" rows="13" placeholder="没有需要补充的内容时可以留空。">'+esc(briefEditorText(m))+'</textarea>','<button class="btn primary" data-action="save-requirements">保存内容</button>');
 }
 else if(action==='node-decision-edit'||action==='path-decision'){e.stopImmediatePropagation();openDecisionDrawer();}
 else if(action==='path-attention'){
  e.stopImmediatePropagation();const key=workCase().attention?.key||'requirements';selectPath(key);openNodeRead(key==='acceptance'?'acceptance':'brief');
 }
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.writerActive&&state.readRef)closeReadSide();});

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.writerActive){e.stopImmediatePropagation();cancelModal();}},true);

restoreHash();

</script>
</body>
</html>
