function legacyArticlePage(){crumbs([['项目','projects'],['Buildr 产品','project'],[origin==='service'?'服务知识':'项目知识','knowledge'],['技能投射']]);return `<article class="article"><button class="back" data-route="knowledge">← 返回${origin==='service'?'服务':'项目'}知识</button><p class="eyebrow">关键能力 · Buildr 服务</p><h1 class="article-title">Buildr 如何让智能体找到技能</h1><p class="lead">源文件是修改的起点，生成目录是读取的入口。Buildr 负责连接两者，并保护已有内容。</p><div class="meta"><span>内容快照 · 2026-09-16</span><span>范围：普通技能到 Codex 工作空间</span><button class="textbtn" data-action="sources">查看依据</button></div><div class="article-summary">你修改技能源文件后，Buildr 读取并组合必要内容，核对目标目录与文件归属，再更新可发现目录。<strong>目录生成只说明入口已准备好，宿主是否加载需要另行确认。</strong></div><div class="anchors"><button data-anchor="principle">怎样工作</button><button data-anchor="safety">怎样安全修改</button><button data-anchor="boundary">完成到哪一步</button></div><section id="principle"><h2>从来源到入口，经过哪些环节？</h2><p>普通技能来自工作空间。组件可以补充正文和协作说明；Buildr 将它们组合成目标文件计划，再交给统一的检查与写入过程。</p><div class="figure"><div class="figurehead"><span>来源与结果的关系</span><button class="textbtn" data-action="zoom">放大图示 ↗</button></div>${diagram()}<p class="figcaption">点击节点可在旁边查看职责与实现依据。箭头表达内容与数据关系。</p></div><div class="answerlist"><div class="answer"><h3>为什么最终文件和源文件不完全一样？</h3><p>源正文会加入适用的组件增强、当前技能需要的能力入口，以及生成标记。附属文件保持自己的内容，增强不会反向改写上游正文。</p><button class="textbtn" data-inspect="compose">查看内容组合的实现 →</button></div></div></section><section id="safety"><h2>我应该改哪里？会覆盖已有修改吗？</h2><div class="answer"><h3>从源资产修改</h3><p>普通技能从源目录维护。Buildr 受管内置技能从产品资源修改，再通过相应同步交付。不要把生成目录当成长期修改入口。</p><button class="textbtn" data-inspect="source">查看来源与修改位置 →</button></div><div class="flow"><div class="step"><b>先核对目标与归属</b><p>核对计划、目标文件与归属，识别已有内容是否允许更新。</p></div><div class="step"><b>有冲突 → 停止</b><p>预检发现冲突时停止写入，保留已有文件，先处理差异。</p></div><div class="step"><b>无冲突 → 更新</b><p>只更新实际变化的内容，相同内容不重复写入。</p></div><div class="step"><b>正常更新后 → 记录归属</b><p>记录文件身份与完整性，作为后续比较和清理的依据。</p></div></div><button class="textbtn" data-inspect="write">对照写入保护的实现 →</button><div class="note">这里保证的是“预检发现冲突时零写入”。任意磁盘或文件系统故障下的整体回滚，不在这一保证之内。</div></section><section id="boundary"><h2>怎样判断完成到了哪一步？</h2><table class="responsibility"><thead><tr><th>观察到的结果</th><th>能够说明什么</th></tr></thead><tbody><tr><td>目标目录已生成</td><td>可发现入口已准备好</td></tr><tr><td>归属记录完整</td><td>Buildr 能追踪受管文件身份</td></tr><tr><td>宿主实际加载或调用</td><td>需要对应会话中的独立观察</td></tr></tbody></table><p class="muted small" style="margin-top:15px">本专题解释实现机制，不表示你当前运行环境已完成上述所有步骤。</p><button class="textbtn" data-inspect="output">查看宿主与生成目录的边界 →</button></section><div class="reader-footer"><span>有了具体判断，可以带着当前专题继续讨论。</span><button class="btn" data-action="feedback">留下我的建议</button></div></article>`}

el="关闭放大图示">×</button></div>'+diagram(),true);else if(a==='close-modal')closeModal();else if(a==='feedback'||b.id==='feedback-top')feedback();else if(a==='save-feedback'){try{localStorage.setItem('buildr-knowledge-prototype-feedback',$('#feedback-text').value);$('#draft-state').textContent='草稿已保存在此浏览器';note('已保存草稿，未发送')}catch{$('#draft-state').textContent='浏览器不允许保存，请复制建议'}}else if(a==='copy-feedback'){try{await navigator.clipboard.writeText('Buildr 项目知识试用建议\n'+$('#feedback-text').value);$('#draft-state').textContent='已复制，可粘贴到当前对话'}catch{$('#feedback-text').select();$('#draft-state').textContent='请复制已选中的文字'}}else if(a==='rules'||a==='project-context')context(a)});
