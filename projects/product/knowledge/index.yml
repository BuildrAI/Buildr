  - id: topic-children
    title: 子主题入口
    kind: code
    path: services/buildr-web/src/features/knowledge/components/KnowledgeTopicChildren.tsx
    summary: 从当前父主题进入直接子主题，组织节点无需另写正文。
  - id: topic-navigation
    title: 知识主题目录
    kind: code
    path: services/buildr-web/src/features/knowledge/components/KnowledgeTopicNavigation.tsx
    summary: 项目与服务共享的主题父子导航，窄区折叠并保留全部资料。
  - id: topic-tabs
    title: 主题表达形式
    kind: code
    path: services/buildr-web/src/features/knowledge/components/KnowledgeTopicTabs.tsx
    summary: 在当前主题内切换说明、技术图与代码地图。
  - id: topic-start
    title: 主题阅读入口
    kind: code
    path: services/buildr-web/src/features/knowledge/components/KnowledgeTopicStart.tsx
    summary: 没有默认主题时提供已有主题入口与探索接续。
  - id: topic-navigation-state
    title: 主题读取状态
    kind: code
    path: services/buildr-web/src/features/knowledge/useKnowledgeNavigation.ts
    summary: 完整轻量主题请求与范围切换、过时响应保护。
  - id: topic-model
    title: 主题导航规则
    kind: code
    path: services/buildr-web/src/features/knowledge/knowledge-topics.ts
    summary: 默认主题选择、祖先路径、成果归属和分类规则。
  - id: skill-source-1
    title: 资源清单
    kind: evidence
    path: services/buildr/resources/manifest.yml
    summary: "Buildr 随包工作资产的资源登记与交付范围。"
  - id: skill-source-2
    title: 投射规范
    kind: spec
    path: openspec/specs/workspace-first-runtime-projection/spec.md
    summary: "工作空间源资产投射为不同智能体入口时的职责和边界。"
  - id: skill-source-3
    title: 组件增强规范
    kind: spec
    path: openspec/specs/buildr-package-assets/spec.md
    summary: "随包资产、组件成员及内容增强的行为承诺。"
  - id: skill-source-4
    title: runtime-projection.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/application/runtime-projection.ts
    summary: "解析目标与投射位置，校验候选不能写共享位置，组装计划并检查已有发现位置，最后应用计划。"
  - id: skill-source-5
    title: projection.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/projection.ts
    summary: "根据选择组装规则、产品入口和工作空间技能的计划；本地图只展开技能支路。"
  - id: skill-source-6
    title: render-plan.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/skills/render-plan.ts
    summary: "为普通技能关联当前工作空间依赖图中的局部绑定；拒绝已退役的项目技能安装范围。组合片段与局部能力说明，添加生成标记，生成正文、附属文件与归属记录的写入计划。"
  - id: skill-source-7
    title: sources.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/skills/sources.ts
    summary: "前者读取 `skills/manifest.yml` 并附加组件贡献；后者解析随包产品入口，两条来源分别进入计划。"
  - id: skill-source-8
    title: contributions.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/skills/contributions.ts
    summary: "读取已安装组件，核对路径、成员完整性和唯一归属后返回正文片段与依赖增强。"
  - id: skill-source-9
    title: capability-graph-repository.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/persistence/capability-graph-repository.ts
    summary: "解析已有协作约定、依赖和绑定，给每个调用方提供局部视图。"
  - id: skill-source-10
    title: projection-files.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/skills/projection-files.ts
    summary: "表达文件摘要、可执行位和投射身份，解析记录位置。"
  - id: skill-source-11
    title: adapter-contract.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/adapter-contract.ts
    summary: "前者取得已声明适配器的目标布局，不证明当前执行者身份；后者给出某一投射范围内的目标根，当前每个适配器各只有一个。"
  - id: skill-source-12
    title: inventory.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/skills/inventory.ts
    summary: "检查可见位置，区分可写候选、已由用户位置满足和冲突。"
  - id: skill-source-13
    title: runtime-reconciler.ts
    kind: code
    path: services/buildr/src/modules/agent-assets/infrastructure/runtime/runtime-reconciler.ts
    summary: "核对目标安全、当前内容与归属，发现计划冲突时保持零写入；正常时更新实际变化文件并处理已证明可清理目标。"
