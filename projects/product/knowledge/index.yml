sources:
  - id: npm-update-application-source
    title: 安装更新应用
    kind: code
    path: services/buildr/src/modules/installation/application/cli-update.ts
    summary: 更新当前软件包后委托网页交接能力；保留安装结果，并分别报告网页切换状态。
    observedDigest: f3a05fe1a7f6bc9278cca64827da339f0182042bc1f338f8b782f9693c44e721
  - id: npm-update-identity-source
    title: 更新安装归属
    kind: code
    path: services/buildr/src/modules/installation/infrastructure/current-product-identity.ts
    summary: 重新读取已验证安装登记，比较同一安装槽位中的历史身份，提供新版精确运行入口。
    observedDigest: 99edf1f72e36fc58724affa8b21fb466f03a816a411fea3fcbc7613ac7c1f7a3
  - id: web-update-store-source
    title: 本机更新记录
    kind: code
    path: services/buildr/src/modules/installation/infrastructure/update-flow-store.ts
    summary: 按安装路径隔离更新观察，校验内容并以独占锁、记录版本和原子替换防止覆盖。
  - id: web-update-launcher-source
    title: 更新启动入口
    kind: code
    path: services/buildr/src/modules/installation/application/update-launcher.ts
    summary: 核对精确安装及历史槽位，仅检查和修复已有启动入口，缺失时跳过。
  - id: web-update-dialog-source
    title: 更新弹窗
    kind: code
    path: services/buildr-web/src/features/installation/components/UpdateDialog.tsx
    summary: 正式页面与原型共用的更新弹窗，表达下载、确认、阶段结果和局部恢复。
  - id: web-update-view-source
    title: 更新视图状态
    kind: code
    path: services/buildr-web/src/features/installation/lib/update-view.ts
    summary: 按真实版本、阶段和连接事实选择显示内容；区分启动入口、重连和安装核验失败。
  - id: web-update-flow-application-source
    title: 页面分阶段更新任务
    kind: code
    path: services/buildr/src/modules/installation/application/update-flow.ts
    summary: 按安装隔离的持久更新任务，钉住版本下载和安装，分别核验启动入口与网页；仅恢复失败环节，开发来源零安装副作用。
    observedDigest: 303044dff95fba2bd6a28dac31b70b964f7b9b2e1e304841d03fa868817d0a5d
  - id: web-update-flow-http-source
    title: 页面更新任务 HTTP 接口
    kind: code
    path: services/buildr/src/modules/installation/interfaces/http/update-flow-http.ts
    summary: 提供状态读取、准备、应用及恢复四个路由；写操作复用会话授权，预览拒绝写入。
    observedDigest: 7efd07da43de2dfaffaf7a2bf28318eb47eb3263615ba29952526bea129fe76a
  - id: web-update-flow-contracts-source
    title: 页面更新任务 HTTP 契约
    kind: code
    path: services/buildr/src/modules/installation/interfaces/http/update-flow-http-contracts.ts
    summary: 声明更新任务请求、任务快照与错误 Schema 并编译校验器，operation 覆盖登记随契约闭合。
    observedDigest: 1ea338860118aa6c7473fa7eac53934a880cb649d0cd8af1d0e0e370c70fb006
  - id: web-update-entry-source
    title: 页面检查更新入口
    kind: code
    path: services/buildr-web/src/features/installation/components/UpdateEntry.tsx
    summary: 更多菜单主动检查；有更新或待恢复事项才显示图标，弹窗组织下载、确认、安装和恢复。
    observedDigest: e22c0050970a893d0d522ab287979b6089680a9a19073646ec3cffe6bae33321
  - id: web-update-flow-hook-source
    title: 页面更新任务轮询
    kind: code
    path: services/buildr-web/src/features/installation/hooks/useUpdateFlow.ts
    summary: 周期检查版本与任务，活动任务加速轮询；断开保留弹窗，等待新会话并核验实际运行版本。
    observedDigest: 729f1328015a64e70c3d23c2a8db465a38c1511a08b50826d054a68056c925e0
  - id: web-update-simulated-target-source
    title: 开发模拟更新目标
    kind: code
    path: services/buildr-web/src/features/installation/lib/simulated-update.ts
    summary: development 渠道的模拟更新目标版本推算，只提升版本号末尾数字段，不访问真实 registry。
    observedDigest: 35effccb7187291ef3bb77d3d513df418922e71d1c5d1ec39e7c2514351f36bb
  - id: web-update-handoff-source
    title: 网页更新交接
    kind: code
    path: services/buildr/src/web/application/update-web-handoff.ts
    summary: 以新版独立进程发起同一安装的网页交接，并核对实际服务健康身份与失败结果。
    observedDigest: ae16e70d33fb5500c36fbe0c00716ba55d4de0dbb531e2764394a0caa4a12184
  - id: web-update-lifecycle-source
    title: 网页实例生命周期
    kind: code
    path: services/buildr/src/web/application/instance-lifecycle.ts
    summary: 唯一编排默认实例启动、复用和认证退出，在启动锁内核对更新目标并启动新版。
    observedDigest: ac542c2657b6ff9245d60225fe9f972ad183ff3b78bb3ce4ceb60ae176594043
  - id: verification-local-source
    title: 通用与本机平台源码检查
    kind: code
    path: services/buildr/test/verification/source.ts
    summary: 独立选择通用源码和本机平台源码，同轮保留成功后只准备和执行失败及未执行项，不生产最终原包。
  - id: verification-candidate-round
    title: 同轮候选普通结果日志
    kind: code
    path: services/buildr/test/verification/candidate-round.ts
    summary: 同轮成功保留，只补失败及未执行项；不按文件、配方或依赖摘要使成功失效。
  - id: verification-platform-boundaries
    title: 两系统源码与原包真实边界
    kind: code
    path: services/buildr/test/verification/platform-boundaries.ts
    summary: 记录 macOS 与 Windows 原生命令、路径、锁、文件描述符、进程和原包启动器的具体机制及最小断言。
  - id: verification-local-artifact
    title: 通用与本机平台原包检查
    kind: code
    path: services/buildr/test/verification/artifact.ts
    summary: 显式消费同一原包，独立选择通用检查与当前操作系统差异，分别保存最低和当前 Node 的真实执行证明，不重新制包。
  - id: verification-artifact-reuse
    title: 原包检查证明交接与复用
    kind: code
    path: services/buildr/test/verification/candidate-artifact-reuse.ts
    summary: 核验原包字节、检查输入、真实环境和原始来源，暂留应由本机补齐的缺项，已有有效证明不重复执行。
  - id: release-coordination-source
    title: 发布协调入口
    kind: skill
    skillId: buildr-release
    path: scripts/release-orchestration-runner.ts
  - id: release-selection-source
    title: 冻结发布选择
    kind: skill
    skillId: buildr-release
    path: scripts/release-selection.ts
  - id: release-publication-source
    title: 公开效果与恢复
    kind: skill
    skillId: buildr-release
    path: scripts/release-publication.ts
  - id: verification-source-reader
    title: 共享检查源码输入
    kind: code
    path: services/buildr/test/verification/verification-source-inputs.ts
    summary: 本机与正式补验共享字节、权限、范围及依赖选择，历史提交只读核验。
  - id: verification-scoped-inputs
    title: 检查输入范围与保守回退
    kind: code
    path: services/buildr/test/verification/verification-inputs.ts
    summary: 分离已核验运行检查的产品内容和测试配方，跟踪静态导入及子脚本，未解析读取保留保守输入。
  - id: verification-candidate-repair
    title: 原包正式补验计划
    kind: code
    path: services/buildr/test/verification/candidate-repair.ts
    summary: 核验原运行、包身份及真实平台；同轮成功保留，只补失败及未执行项，保留原始来源。
  - id: verification-candidate-repair-entry
    title: 受控补验入口与插件原包采用
    kind: code
    path: services/buildr/test/verification/candidate-repair-cli.ts
    summary: 读取受控原运行和真实压缩包，生成执行矩阵及保留证据，采用输入不变的插件完整证明。
