        path: knowledge/docs/architecture/technical.md
        title: "Buildr 怎样实现"
        summary: "理解两个服务（Service）、模块协作、运行和写入保护。"
      - location: scope
        path: knowledge/code-map/README.md
        title: "代码全景与定位指南"
        summary: "从产品总树找到服务、模块和修改应归属的位置。"
      - location: scope
        path: knowledge/docs/architecture/buildr-data-design.md
        title: "数据全景与领域设计"
        summary: "理解工作资产、协作记录及本机现场分别由谁保存和维护。"
      - location: scope
        path: knowledge/docs/architecture/buildr-database-tables.md
        title: "数据库表与实体关系"
        summary: "查阅表职责、字段、关联、约束及应用层完整性边界。"
      - location: scope
        path: services/buildr/docs/cli-architecture.md
        title: "命令行（CLI）与模块设计"
        summary: "定位入口装配、模块边界、命令分发与公开兼容承诺。"
      - location: scope
        path: knowledge/code-map/system-services-assets.md
        title: "服务与工程目录定位"
        summary: "按产品能力找到前后端代码、工程工具与构建职责。"
      - location: scope
        path: knowledge/code-map/technical-layers.md
        title: "模块与分层代码地图"
        summary: "逐步定位领域、应用、数据访问、接口及基础技术实现。"
  - id: development-and-verification
    title: "开发与验证"
    summary: "准备开发环境，选择合适检查，并按需深入测试实现。"
    entries:
      - location: workspace
        path: CONTRIBUTING.md
        title: "参与开发：环境与约定"
        summary: "准备开发环境，了解变更方式、必要验证和贡献要求。"
      - location: scope
        path: knowledge/docs/architecture/workspace-testing-and-verification-framework.md
        title: "为项目选择与建设测试"
        summary: "围绕目标选择已有检查，补齐缺口并记录可信结果。"
      - location: scope
        path: knowledge/docs/architecture/verification-framework.md
        title: "Buildr 自身如何测试"
        summary: "理解 Buildr 自测的选择、执行、隔离与候选验证范围。"
      - location: scope
        path: services/buildr/test/browser-smoke/README.md
        title: "浏览器测试：准备与运行"
        summary: "准备测试浏览器并运行已有入口，了解缓存和隔离边界。"
      - location: scope
        path: services/buildr-web/test/browser/README.md
        title: "前端验证：布局、交互与工具替换"
        summary: "运行页面检查，判断现场工具能够证明哪些交互和视觉结果。"
      - location: scope
        path: knowledge/docs/guides/repository-header-layout.md
        title: "代码库列表顶部布局修复说明"
        summary: "核对窄栏问题、共享目录适配、实际验证、任务关联及独立遗留。"
      - location: scope
        path: knowledge/docs/guides/node-test-context-runtime.md
        title: "Node.js 测试准备的复用与隔离"
        summary: "按需复用昂贵准备，同时保持案例隔离和可靠清理。"
      - location: scope
        path: knowledge/code-map/verification-framework.md
        title: "项目测试地图与验证报告的实现位置"
        summary: "定位用户项目测试声明、范围解析和任务验证报告的实现。"
      - location: scope
        path: knowledge/code-map/product-verification-tools.md
        title: "Buildr 自测工具的实现位置"
        summary: "定位产品自测的发现、选择、执行、资源协调和证据聚合。"
  - id: extensions-and-reference
    title: "扩展与接口"
    summary: "按具体问题查命令与数据格式，扩展工具接入和工作方法。"
    entries:
      - location: scope
        path: services/buildr/docs/agent-runtime-adapters.md
        title: "智能体（Agent）工具支持与加载方式"
        summary: "确认所用工具的支持范围、发现入口和刷新要求。"
      - location: scope
        path: services/buildr/docs/cli-reference.md
        title: "命令行（CLI）参考"
        summary: "查找安装、工作范围、资产、任务和诊断命令。"
      - location: scope
        path: knowledge/docs/reference/json-contracts.md
        title: "公开数据格式与兼容约定"
        summary: "核对输出身份、字段含义及脚本应遵循的兼容边界。"
      - location: scope
        path: services/buildr/docs/skill-capability-contracts.md
        title: "技能（Skill）协作与能力约定"
        summary: "理解方法之间何时需要稳定约定，以及怎样声明、绑定和替换。"
      - location: scope
        path: knowledge/docs/reference/agent-runtime-adapter-contribution.md
        title: "接入新的智能体（Agent）工具"
        summary: "收集真实发现和加载证据，实施适配并确认支持范围。"
      - location: scope
        path: services/buildr/docs/archify-component.md
        title: "使用与维护 Archify 绘图能力"
        summary: "了解可选绘图能力的来源、使用、更新与完整升级边界。"
  - id: release-and-maintenance
    title: "发布与维护"
    summary: "查阅版本变化，理解正式发布、安全报告和首版准备状态。"
    entries:
      - location: scope
        path: services/buildr/docs/known-limitations.md
        title: "当前能力与使用边界"
        summary: "核对安装平台、本机数据、工具接入及尚未提供的能力。"
      - location: workspace
        path: CHANGELOG.md
        title: "版本变化"
        summary: "按版本了解已经记录的变化，并区分尚未发布的内容。"
      - location: scope
        path: knowledge/docs/flows/open-source-release.md
        title: "发布与恢复流程"
        summary: "核对版本内容、候选产物、发布授权及失败后的恢复方式。"
      - location: scope
        path: knowledge/docs/flows/dsh-plugin-release.md
        title: "DSH 插件独立发布"
        summary: "了解 DSH 插件的独立版本、候选和公开安装，与 Buildr 主包发布如何分离。"
      - location: scope
        path: knowledge/reviews/v0.1.0-readiness.md
        title: "0.1.0 发布准备审查"
        summary: "查看首版阶段审查的历史结论与当时验证边界；不代表当前发布状态。"
      - location: workspace
        path: SECURITY.md
        title: "安全问题与报告方式"
        summary: "了解安全维护范围，以及如何私密报告敏感问题。"
  - id: product-articles
    title: "理念文章"
    summary: "通过已发表文章理解 Buildr 的长期价值与建设思路。"
    entries:
      - location: scope
        path: docs/publications/buildr-agent-work-infrastructure.md
        title: "Buildr：Agent 的工作基础设施"
        summary: "从工作基础设施的角度理解资料、方法与智能体（Agent）的关系。"
      - location: scope
        path: docs/publications/buildr-agent-more-and-better.md
        title: "Buildr：让 Agent 越做越多，越做越好"
        summary: "理解已有积累怎样帮助智能体（Agent）扩展工作范围并改善结果。"
      - location: scope
        path: docs/publications/buildr-dsh-plugin.md
        title: "在 DSH 里打开 Buildr"
        summary: "了解在 DSH 中直接打开 Buildr 的使用方式、边界与安装途径。"
      - location: scope
        path: docs/publications/README.md
        title: "文章目录与发布状态"
        summary: "查看文章发布目标、已有链接及正文和配图的维护方式。"
        supplementary: true
objects:
  - id: product-overview
    title: Buildr 整体认识
    summary: 从业务目的、主要职责及目标、方法、成果三组关系理解 Buildr，按具体问题继续探索。
  - id: system-structure
    title: 系统组成
    summary: 从业务目标与实现的关系、可复用工作方法两条线理解 Buildr 的主要组成。
  - id: project-service-repositories
    parent: system-structure
    title: 项目、服务与代码库如何协作
    summary: 理解三类对象的职责、共享引用、代码定位，以及关联和分支修改的影响。
  - id: skill-system-topic
    parent: system-structure
    title: Buildr 技能体系
    summary: 理解工作方法从源文件、组合到可发现入口的关系，以及能力选择和诊断边界。
  - id: task-system
    title: 从需求讨论到任务收尾
    summary: 关键过程、人的决定、实际成果与完成记录的区别，以及普通完成和显式组合结束的边界。
  - id: data-design
    title: 数据全景与领域设计
    summary: 从业务含义、身份、关联、存储和修改约束理解全部数据领域，不把本机事实误当缓存。
  - id: data-sqlite
    parent: data-design
    title: 数据库表与实体关系
    summary: 当前 SQLite 普通表、全文检索、完整字段、主外键、关系基数及应用层引用的区别。
  - id: verification-framework
    title: 测试与验证
    summary: Buildr 如何引导智能体按用户目标，为不同项目和服务建设测试、声明能力、选择执行并交付可信结果。
  - id: verification-product-tools
    parent: verification-framework
    title: Buildr 产品测试工具
    summary: Buildr 自身的路径选择、执行注册表、资源协调、隔离与候选证据。
  - id: verification-test-context
    parent: verification-product-tools
    title: Node.js 测试上下文
    summary: 面向 Node.js 的可选能力：复用昂贵准备，保持案例隔离，管理创建、恢复和清理。
  - id: knowledge-maintenance
    title: 知识建设与维护
    summary: 谁指导事实建设，谁维护表达，职责落在哪些文件，以及变化后怎样跟上。
