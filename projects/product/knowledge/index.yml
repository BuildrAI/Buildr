sources:
  - id: query
    title: 读取与来源观察
    kind: code
    path: services/buildr/src/modules/knowledge/application/knowledge-query.ts
    observedDigest: 496de44b9ff4e31fa432ab624ab9e265e75d8e7140627d9d33a60f58334a2945
    summary: 组织知识读取与当前内容观察；从当前可读原生图示 HTML 的主 SVG 提取只读尺寸，供嵌入预览适配。摘要差异只提示来源变化，不判定语义正确。
  - id: index-model
    title: 知识对象与关联校验
    kind: code
    path: services/buildr/src/modules/knowledge/domain/knowledge-index.ts
    observedDigest: c6cda33ad432993a831d5a19dc1b60b93f5449744a5b271fbf8da3eb5b1a0a30
    summary: 定义知识对象、成果、来源及关系的结构，解析并校验局部索引。它检查身份唯一性、关联有效性和层级循环，不负责读取实际文件。
  - id: files
    title: 有界文件读取
    kind: code
    path: services/buildr/src/modules/knowledge/infrastructure/knowledge-files.ts
    observedDigest: 3fc668cbd861c01cf8aef0ea6410deea853375329da092297ecda8a7181a24b9
    summary: 集中处理只读文件操作，核对相对路径、真实路径、文件类型与大小，并计算内容摘要。它保护读取范围，不决定文件的业务职责。
  - id: http
    title: 只读协议入口
    kind: code
    path: services/buildr/src/modules/knowledge/interfaces/http/knowledge-http.ts
    observedDigest: 7ecceae5b257a729d01df1f07b06f59e2755e1042502f9b8036134f09f91545a
    summary: 知识读取的 HTTP 入口：解析请求身份，调用读取应用，并输出受校验的响应。图示通过单独隔离响应保留原 HTML；读取不修改规范或代码。
  - id: module
    title: 能力装配
    kind: code
    path: services/buildr/src/modules/knowledge/module.ts
    observedDigest: 1f3029744bc3f636904f699982e4d7731849212518c24506d2f405bb3b29e0dd
    summary: 装配知识模块需要的工作空间和技能来源依赖，对外公开读取能力并登记 HTTP 入口。它连接对象，不保存另一套业务事实。
  - id: page
    title: 知识阅读页面
    kind: code
    path: services/buildr-web/src/features/knowledge/pages/KnowledgePage.tsx
    observedDigest: 19c2f13c67bc29dc458fbb25c75c2a49803cd00692d3aed8b7ffae923cae9c26
    summary: 组织当前知识范围、主屏详情、目录分类和关联阅读，保持同一项目的副屏；打开资料时由工作台（Workbench）组件独立记录最近访问，收藏写个人偏好，不改知识正文。
  - id: diagram-reader
    title: 隔离图示阅读
    kind: code
