documentSections:
  - id: getting-started
    title: "了解与上手"
    summary: "先判断 Buildr 是否适合，再开始使用并了解必要边界。"
    entries:
      - location: scope
        path: knowledge/docs/overview.md
        title: "了解 Buildr"
        summary: "理解各方怎样协作，区分当前能力、使用边界与未来方向。"
      - location: scope
        path: knowledge/docs/guides/getting-started.md
        title: "开始使用 Buildr"
        summary: "完成安装配置，并在智能体（Agent）中工作、接续、交付和更新。"
      - location: scope
        path: knowledge/docs/architecture/project-service-repositories.md
        title: "工作对象与协作"
        summary: "理解业务目标与实现位置的关系，以及共享引用和修改影响。"
      - location: workspace
        path: README.md
        title: "Buildr 是什么、如何开始"
        summary: "产品介绍与直接开始入口；与三篇核心说明共用同一事实。"
        supplementary: true
      - location: scope
        path: README.md
        title: "产品项目入口"
        summary: "了解产品工程组成，并跳转到知识、规范和阅读材料。"
        supplementary: true
      - location: workspace
        path: README.en.md
        title: "项目首页（English）"
        summary: "以英文阅读产品介绍、上手方式和自举说明。"
        supplementary: true
      - location: scope
        path: services/buildr/README.md
        title: "npm 安装包说明"
        summary: "查阅面向安装包使用者的产品介绍与安装环境要求。"
        supplementary: true
      - location: workspace
        path: docs/README.md
        title: "仓库文档导航"
        summary: "从仓库公共入口按使用、理解或开发目的继续阅读。"
        supplementary: true
      - location: scope
        path: knowledge/README.md
        title: "旧知识入口"
        summary: "保留首页原链接，转入同一阅读目录。"
        supplementary: true
      - location: scope
        path: knowledge/docs/README.md
        title: "Buildr 阅读目录"
        summary: "从了解、开始和对象关系进入，按需查找开发、维护与技术参考。"
  - id: work-collaboration
    title: "组织工作与协作"
    summary: "理解目标、代码、方法与成果怎样连接，工作怎样继续推进。"
    entries:
      - location: scope
        path: knowledge/docs/glossary.md
        title: "核心概念与术语"
        summary: "查清工作对象、资料和协作记录的含义与区别。"
      - location: scope
        path: knowledge/docs/architecture/buildr-skill-system.md
        title: "技能如何成为可用的工作方法"
        summary: "了解方法的来源、组合、选择和交给工具发现的过程。"
      - location: scope
        path: knowledge/docs/architecture/task-system.md
        title: "从讨论到交付"
        summary: "区分目标、进展、设计和实际成果，理解人的参与与任务收尾。"
      - location: scope
        path: knowledge/docs/architecture/knowledge-maintenance.md
        title: "怎样建设和维护项目知识"
        summary: "把调查组织成可理解的说明、图示与目录，并随真实变化维护。"
      - location: scope
        path: knowledge/docs/flows/project-daily-progress.md
        title: "项目每日演进"
        summary: "按明确提交范围查看、生成或重跑每日摘要，了解其数据边界。"
      - location: scope
        path: knowledge/code-map/project-service-repositories.md
        title: "工作范围与代码关联的实现位置"
        summary: "从对象登记、关系写入和代码定位找到对应实现。"
      - location: scope
        path: knowledge/code-map/skill-projection.md
        title: "技能发现与投射的实现位置"
        summary: "定位方法解析、组合、文件计划、受管写入及冲突保护。"
      - location: scope
        path: knowledge/code-map/task-system.md
        title: "任务协作的实现位置"
        summary: "定位工作台、答复、任务记录、专业结果与交付相关实现。"
      - location: scope
        path: knowledge/code-map/knowledge-maintenance.md
        title: "知识阅读与维护的实现位置"
        summary: "定位知识索引、文件发现、阅读编排、正文读取和页面呈现。"
  - id: system-and-data
    title: "系统与数据"
    summary: "从整体组成进入代码与数据，理解谁实现、谁保存、谁修改。"
    entries:
