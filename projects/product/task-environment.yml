schemaVersion: buildr.project-task-environment/v1
services:
  buildr:
    dependencyRoots:
      - id: npm
        manager: npm
        root: .
        manifest: package.json
        lockfile: package-lock.json
        required: true
    requires:
      - service: buildr-web
        purpose: Local App source build and browser verification
  buildr-web:
    dependencyRoots:
      - id: npm
        manager: npm
        root: .
        manifest: package.json
        lockfile: package-lock.json
        required: true
    requires: []
