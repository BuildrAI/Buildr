schemaVersion: buildr.project-verification/v4
testing:
  - id: buildr-static
    title: Buildr 静态检查（Static Check）
    scope:
      project: product
      services: [buildr, buildr-web, buildr-agent, dsh-plugin]
    purpose: 检查四服务类型、源码依赖、声明、资源和交付结构，不执行业务流程。
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
      - services/buildr-agent/**
      - services/dsh-plugin/**
      - verification.yml
      - preparation.yml
    testRoots:
      - services/buildr/test/**
      - services/buildr-web/test/**
      - services/buildr-agent/test/**
      - services/dsh-plugin/test/**
    full:
      kind: command
      argv: [tools/development/run-development-npm, run, test:static]
      cwd: services/buildr
    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 推送前必须取得四服务全部静态检查（Static Check）与单元测试（Unit Test）的有效完整证明；不能仅用相关检查冒充全量。
      - DSH 插件的 plugin-typecheck 与 plugin-test-typecheck 依赖外部准备的 DSH SDK，登记为仅显式选择，由插件服务 test:static 与发布/候选验证执行，不属于日常 check 全量范围。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
  - id: buildr-unit
    title: Buildr 单元测试（Unit Test）
    scope:
      project: product
      services: [buildr, buildr-web, buildr-agent, dsh-plugin]
    purpose: 验证四服务隔离条件下的内部逻辑与完整内部功能；替换外部协作者，整套保持低成本。
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
      - services/buildr-agent/**
      - services/dsh-plugin/**
      - verification.yml
      - preparation.yml
    testRoots:
      - services/buildr/test/**
      - services/buildr-web/test/**
      - services/buildr-agent/test/**
      - services/dsh-plugin/test/**
    full:
      kind: command
      argv: [tools/development/run-development-npm, test]
      cwd: services/buildr
    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 推送前必须取得四服务全部静态检查（Static Check）与单元测试（Unit Test）的有效完整证明；不能仅用相关检查冒充全量。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
  - id: buildr-integration
    title: Buildr 集成测试（Integration Test）
    scope:
      project: product
      services: [buildr, buildr-web, buildr-agent, dsh-plugin]
    purpose: 验证真实数据库、HTTP、文件系统、Git、消息和子进程等技术边界；按真实平台和依赖执行。
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
      - services/buildr-agent/**
      - services/dsh-plugin/**
      - verification.yml
      - preparation.yml
    testRoots:
      - services/buildr/test/**
      - services/buildr-web/test/**
      - services/buildr-agent/test/**
      - services/dsh-plugin/test/**
    full:
      kind: command
      argv: [tools/development/run-development-npm, run, test:integration]
      cwd: services/buildr
    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 发布或明确要求时按所需范围执行；任务已涉及的必要真实边界在开发完成前验证，不因发布阶段命名而推迟。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
      - 对应检查声明的真实平台与独立环境；浏览器、软件开发工具包（SDK）及准确原包按需准备
      - 不自动借用真实账号、调用付费模型或派发公开发布，超出现有授权时反馈用户决定
  - id: buildr-e2e
    title: Buildr 端到端测试（End-to-End Test，E2E）
    scope:
      project: product
      services: [buildr, buildr-web, buildr-agent, dsh-plugin]
