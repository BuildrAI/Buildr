    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 发布或明确要求时按所需范围执行；任务已涉及的必要真实边界在开发完成前验证，不因发布阶段命名而推迟。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
      - 对应检查声明的真实平台与独立环境；浏览器、软件开发工具包（SDK）及准确原包按需准备
      - 不自动借用真实账号、调用付费模型或派发公开发布，超出现有授权时反馈用户决定
