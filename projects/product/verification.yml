schemaVersion: buildr.project-verification/v4
testing:
  - id: buildr-static
    title: Buildr 静态检查（Static Check）
    scope:
      project: product
      services:
        - buildr
        - buildr-web
        - buildr-harness
        - dsh-plugin
        - buildr-harness-web
    purpose: 检查已登记服务类型、源码依赖、声明、资源和交付结构，不执行业务流程。
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
      - services/buildr-harness/**
      - services/dsh-plugin/**
      - verification.yml
      - preparation.yml
      - services/buildr-harness-web/**
    testRoots:
      - services/buildr/test/**
      - services/buildr-web/test/**
      - services/buildr-harness/test/**
      - services/dsh-plugin/test/**
      - services/buildr-harness-web/test/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:static
      cwd: services/buildr
    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 推送前必须取得已登记服务全部静态检查（Static Check）与单元测试（Unit Test）的有效完整证明；不能仅用相关检查冒充全量。
      - DSH 插件的 plugin-typecheck 与 plugin-test-typecheck 依赖外部准备的 DSH
        SDK，登记为仅显式选择，由插件服务 test:static 与发布/候选验证执行，不属于日常 check 全量范围。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
  - id: buildr-unit
    title: Buildr 单元测试（Unit Test）
    scope:
      project: product
      services:
        - buildr
        - buildr-web
        - buildr-harness
        - dsh-plugin
        - buildr-harness-web
    purpose: 验证已登记服务隔离条件下的内部逻辑与完整内部功能；替换外部协作者，整套保持低成本。
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
      - services/buildr-harness/**
      - services/dsh-plugin/**
      - verification.yml
      - preparation.yml
      - services/buildr-harness-web/**
    testRoots:
      - services/buildr/test/**
      - services/buildr-web/test/**
      - services/buildr-harness/test/**
      - services/dsh-plugin/test/**
      - services/buildr-harness-web/test/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - test
      cwd: services/buildr
    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 推送前必须取得已登记服务全部静态检查（Static Check）与单元测试（Unit Test）的有效完整证明；不能仅用相关检查冒充全量。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
  - id: buildr-integration
    title: Buildr 集成测试（Integration Test）
    scope:
      project: product
      services:
        - buildr
        - buildr-web
        - buildr-harness
        - dsh-plugin
        - buildr-harness-web
    purpose: 验证真实数据库、HTTP、文件系统、Git、消息和子进程等技术边界；按真实平台和依赖执行。
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
      - services/buildr-harness/**
      - services/dsh-plugin/**
      - verification.yml
      - preparation.yml
      - services/buildr-harness-web/**
    testRoots:
      - services/buildr/test/**
      - services/buildr-web/test/**
      - services/buildr-harness/test/**
      - services/dsh-plugin/test/**
      - services/buildr-harness-web/test/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:integration
      cwd: services/buildr
    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 智能体服务（Agent Service）的完整入口由自身检查登记发现全部组；可用 --check 精确选择
        agent-integration、agent-integration-storage-runtime、agent-integration-models-accounts、
        agent-integration-conversations、agent-integration-native、agent-integration-native-runtime、
        agent-integration-startup、agent-integration-handoff 或
        agent-integration-recovery。
      - 重型独立进程组使用统一资源预算，每组申请一个工作位，由 agent-process-tests 限制同机最多两组；直接诊断入口也受
        BUILDR_VERIFICATION_WORKER_BUDGET
        约束，最多两个文件并行。数据库、可写包、运行目录与进程身份各自隔离；同次完整运行仅共用只读 Node.js 程序输入，仍逐次执行完整摘要校验。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 发布或明确要求时按所需范围执行；任务已涉及的必要真实边界在开发完成前验证，不因发布阶段命名而推迟。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
      - 对应检查声明的真实平台与独立环境；浏览器、软件开发工具包（SDK）及准确原包按需准备
      - 不自动借用真实账号、调用付费模型或派发公开发布，超出现有授权时反馈用户决定
  - id: buildr-e2e
    title: Buildr 端到端测试（End-to-End Test，E2E）
    scope:
      project: product
      services:
        - buildr
        - buildr-web
        - buildr-harness
        - dsh-plugin
        - buildr-harness-web
    purpose: 从命令行或浏览器实际入口完成应用流程，核对最终结果，明确替换的外部系统。
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
      - services/buildr-harness/**
      - services/dsh-plugin/**
      - verification.yml
      - preparation.yml
      - services/buildr-harness-web/**
    testRoots:
      - services/buildr/test/**
      - services/buildr-web/test/**
      - services/buildr-harness/test/**
      - services/dsh-plugin/test/**
      - services/buildr-harness-web/test/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:e2e
      cwd: services/buildr
    selection:
      - 完整入口以实际登记和发现集合运行本类全部检查，不按旧目录名推定分类，不在地图复制成员。
      - 所有公开入口支持 --plan 查看选择，使用 --check <id> 显式指定检查；计划和选择成功不等于实际验证通过。
      - 任务开发按用户请求、目标、真实改动及调用边界选齐相关四类，使用 test:related 或明确指定的现有检查，不要求正式任务或比较基线。
      - 打包、安装及 Web 启停相关变更通过 test:related 选择本机真实安装预检；临时包的冒烟结果不是正式候选验收。
      - 发布或明确要求时按所需范围执行；任务已涉及的必要真实边界在开发完成前验证，不因发布阶段命名而推迟。
      - 仅在内容、配方、依赖、工具与必要环境仍适用时复用有效结果，保留实际来源；缺失、失败和未覆盖如实报告。
    requirements:
      - 稳定版 Node >=24.15.0 与相邻 npm，通过项目包装入口运行
      - 对应检查声明的真实平台与独立环境；浏览器、软件开发工具包（SDK）及准确原包按需准备
      - 不自动借用真实账号、调用付费模型或派发公开发布，超出现有授权时反馈用户决定
  - id: harness-standalone-acceptance
    title: Harness 独立包及正式网页端到端验收
    scope:
      project: product
      services:
        - buildr-harness
        - buildr-harness-web
    purpose: 验证复制后的真实离线包、独立正式网页、受保护换代及共享数据保全；不代替原生模型与异平台证据。
    sourcePaths:
      - services/buildr-harness/**
      - services/buildr-harness-web/**
    testRoots:
      - services/buildr-harness/test/**
      - services/buildr-harness/test/integration/process/startup/**
      - services/buildr-harness-web/test/browser/**
    full:
      kind: agent
      instructions:
        - 使用 services/buildr/tools/development/run-development-node
          services/buildr-harness/tools/pack-local.ts <隔离产物目录>
          制作本机验收包，复制为不可变摘要路径后，在独立 consumer 离线 npm install
          --ignore-scripts；显式隔离数据域，以安装的 buildr-harness web --no-open
          启动。通过公共客户端取得准确运行身份与短时票据，浏览器实际验证目录登记、无发送草稿、模型/智能体/程序设置、刷新及换代保留；审看截图。启动器按当前平台安装到测试专用目录，实际打开和重复/并发打开，核对核心复用。清理只处理本轮准确绑定的页面、入口和服务；未做的真实账号、另一产品消费或其他平台保留缺口，不以替身或静态通过冒充。
    selection:
      - 源码组通过不等于安装后或浏览器通过；复用证据必须对应相同字节、环境与目标。
    requirements:
      - 本机稳定版 Node >=24.15.0 与 npm；可用受控浏览器；不调用付费模型或修改日常配置域。
  - id: harness-dsh-plugin-unit
    title: Harness DSH 开发插件接入检查
    scope:
      project: product
      services:
        - buildr-harness-dsh-plugin
    purpose: 验证入口授权、端点复用、会话目录约束、文件跳转输入和链接目的地选择，不打开桌面或使用账号。
    sourcePaths:
      - services/buildr-harness-dsh-plugin/**
    testRoots:
      - services/buildr-harness-dsh-plugin/test/**
    full:
      kind: command
      argv:
        - npm
        - test
      cwd: services/buildr-harness-dsh-plugin
    requirements:
      - 项目开发 Node（>=24.15.0）。
  - id: harness-dsh-desktop-acceptance
    title: Harness DSH 已安装开发插件桌面验收
    scope:
      project: product
      services:
        - buildr-harness-dsh-plugin
        - buildr-harness
        - buildr-harness-web
    purpose: 验证安装后同窗进入生产 Harness Web、工作空间与原生右栏切换、文件和 Git 标签及链接偏好。
    sourcePaths:
      - services/buildr-harness-dsh-plugin/**
      - services/buildr-harness/**
      - services/buildr-harness-web/**
    testRoots:
      - services/buildr-harness-dsh-plugin/test/desktop-acceptance.md
    full:
      kind: agent
      instructions:
        - 使用插件 README 的开发包入口与本机 DSH 0.2.2-rc.5 官方安装工具，在独立桌面配置绑定准确 Harness
          安装包和隔离数据域。
        - 按桌面验收文档核对无绑定、两个真实目录与 DSH 承载切换、工具标签、网页偏好及返回后视图保留。若截获外部打开，单独标明只核验到宿主边界。
        - 记录准确安装包、真实观察和验证缺口；只停止本次隔离实例和后台，不写日用配置。
    requirements:
      - 本机 DSH 桌面 0.2.2-rc.5、Buildr 开发 Node、Harness 本机验收包和有界桌面验证现场。
