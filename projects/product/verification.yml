schemaVersion: buildr.project-verification/v2
resources:
  - id: browser
    title: Local browser capacity
    strategy: coordinated
    capacity: 1
    authorization: implicit
capabilities:
  - id: product.fast
    title: Buildr Product Fast 验证
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "test"]
      cwd: services/buildr
    applicability:
      paths: ["**"]
      conditions:
        - 需要快速确认 Product/Buildr 受影响实现与契约
    proves:
      - 低成本 Unit、Component 与 Static Conformance 通过
    requiredForDelivery: false
    environment:
      requires: [node, npm]
    effects:
      writes: ["系统临时目录中的验证 fixture 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.delivery
    title: Buildr Product 任务交付验证
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:changed", "--", "--base", "origin/dev"]
      cwd: services/buildr
    applicability:
      paths: ["**"]
      conditions:
        - Product 或 Buildr Service 形成冻结的待交付目标
    proves:
      - 冻结目标相对 Product 集成分支的 changed paths 均有 owner，且同一 plan 选择的 affected 或 full 证据通过
    requiredForDelivery: true
    environment:
      requires: [node, npm, git]
    effects:
      writes: ["系统临时目录中的验证 fixture、候选 tarball、timing evidence 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.full-regression
    title: Buildr Product 显式完整回归
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:candidate"]
      cwd: services/buildr
    applicability:
      paths: ["**"]
      conditions:
        - 用户明确要求完整 Product 回归、准备 Release 或独立核验完整回归入口
        - 显式 Full 交付时只选择本 capability，不同时选择 product.delivery；verification policy 通过 required override 将本能力设为交付必需
    proves:
      - Product Project 与 Buildr Service 登记为完整回归主证据的全部步骤通过
      - Candidate profile 登记的全部 required gate identities 通过一次完整执行计划
    requiredForDelivery: false
    environment:
      requires: [node, npm, git]
      preparation:
        - project: product
          service: buildr
          recipe: buildr.npm-ci
        - project: product
          service: buildr-web
          recipe: buildr-web.npm-ci
    effects:
      writes: ["系统临时目录中的候选 workspace、tarball、timing evidence 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.browser-smoke
    title: Buildr Web affected 浏览器冒烟验证
    scope:
      project: product
      services: [buildr, buildr-web]
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:browser:changed"]
      cwd: services/buildr
    applicability:
      paths: ["services/buildr-web/**", "services/buildr/web-dist/**", "services/buildr/src/web/**", "services/buildr/test/browser-smoke/**", "services/buildr/test/verification/browser-selector-dispatcher.mjs", "services/buildr/test/verification/web-dist.mjs"]
      conditions:
        - Buildr Web 路由、DOM 交互、Agent Action、package、lockfile、Vite 或 TypeScript 配置发生变化
        - 未显式提供 BUILDR_CHANGED_PATHS_JSON 时，dispatcher 从 execution root 的 Git verification base 推导 changed paths
        - 适用输入至少选择一个 Browser selector；非适用输入明确返回 not-applicable，Browser-owned 0 selector 阻塞
        - selected Browser 在启动 Chrome 前，将 Buildr Web 构建到系统临时 staging 并与 tracked web-dist 精确比较
    proves:
      - 适用的 changed paths 已执行至少一个稳定 Browser selector，或被明确判定为 not-applicable
      - 临时 staging build 与 tracked web-dist 精确一致，冻结目标未被改写
      - Project、Service、Change 与 Task 页面关键浏览器交互和错误反馈可用
    requiredForDelivery: true
    environment:
      requires: [node, npm, chrome]
      preparation:
        - project: product
          service: buildr-web
          recipe: buildr-web.npm-ci
    effects:
      writes: ["系统临时目录中的隔离 Workspace、Service source 与浏览器 profile"]
      externalSystems: []
      authorization: implicit
    resourceClaims: [browser]
  - id: product.archive-lifecycle
    title: Buildr Change active/archive 生命周期契约
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-node", "--test", "test/contract/current-knowledge-governance.test.mjs", "test/contract/task-finish-sequencing.test.mjs"]
      cwd: services/buildr
    applicability:
      paths: ["openspec/changes/**", "openspec/knowledge/**", "services/buildr/resources/workspace/skills/buildr/task-finish/**", "services/buildr/test/contract/**"]
      conditions:
        - Change lifecycle、Change path resolution 或 OpenSpec sync/archive workflow 发生变化
    proves:
      - active/archived Change 定位、OpenSpec convergence 与 Task Finish 生命周期顺序保持一致
    requiredForDelivery: false
    environment:
      requires: [node]
    effects:
      writes: ["系统临时目录中的隔离 OpenSpec fixture"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.openspec-convergence-journey
    title: Buildr OpenSpec 确定性收敛完整 Journey
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:openspec:convergence"]
      cwd: services/buildr
    applicability:
      paths: ["openspec/changes/**", "openspec/knowledge/**", "services/buildr/src/task/openspec/**", "services/buildr/src/bootstrap/cli/**", "services/buildr/src/task/application/finish/**", "services/buildr/test/verification/openspec/**"]
      conditions:
        - OpenSpec canonical 写入、恢复、并发 Change、archive 或 checkpoint bootstrap 发生变化
    proves:
      - 单一 receipt、隔离 strict validation、条件应用、写后确认、文件事实恢复、归档重试与并发 Change Journey 通过
    requiredForDelivery: false
    environment:
      requires: [node, npm]
    effects:
      writes: ["系统临时目录中的完整 OpenSpec Project、Change、finish run 与 receipts"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.release-artifact-set
    title: Buildr npm 正式发布候选与本机 Launcher 验证
    scope:
      project: product
      services: [buildr]
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:focus", "--", "group:release"]
      cwd: services/buildr
    applicability:
      paths: ["services/buildr/tools/release/**", "services/buildr/src/**", "services/buildr/package/**", "services/buildr/package.json", "services/buildr/package-lock.json", "services/buildr/test/**", ".github/workflows/publish.yml"]
      conditions:
        - Application Payload、npm candidate、Host Node、Launcher binding、Registry readback 或发布 workflow 发生变化
    proves:
      - 同一冻结 Application Payload 只生成一次 npm tarball，并由所有 smoke、publish 与 Registry readback 复用
      - npm 安装使用兼容 Host Node，完整支持 CLI 与按需 Buildr Web
      - 显式安装的 macOS/Windows Launcher 不复制 Node 或 Buildr，精确绑定同一 npm 安装，并在 Node、entry、prefix 或 package identity 漂移时 fail closed
    requiredForDelivery: false
    environment:
      requires: [node, npm, git]
    effects:
      writes: ["系统临时目录中的冻结 payload、npm tarball、Launcher fixture、timing evidence 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
