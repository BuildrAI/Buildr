schemaVersion: buildr.project-verification/v2
resources:
  - id: browser
    title: Local browser capacity
    strategy: coordinated
    capacity: 1
    authorization: implicit
capabilities:
  - id: product.fast
    title: Buildr Product Quick 开发反馈
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "test"]
      cwd: services/buildr
    applicability:
      paths: ["**"]
      conditions:
        - 开发阶段需要低成本确认 Product/Buildr 受影响实现与契约；该结果不作为正式 Task Verification Result
    proves:
      - 低成本 Unit、Component 与 Static Conformance 开发反馈通过；不证明完整 Task Delivery、Product Artifact Candidate 或 Published Release
    requiredForDelivery: false
    environment:
      requires: [node, npm]
    effects:
      writes: ["系统临时目录中的验证 fixture 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.delivery
    title: Buildr Product 任务交付验证
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:changed", "--", "--base", "origin/dev"]
      cwd: services/buildr
    applicability:
      paths: ["**"]
      conditions:
        - Product 或 Buildr Service 形成 frozen Task Content，准备作出 Task Delivery 决定
        - 默认选择可信 affected；只有 planner、registry、ownership 或其他关键验证 authority 无法安全局部判断时才以稳定 reason code fail closed 升级 daily-full 或阻断
    proves:
      - frozen Task Content 相对 Product 集成分支的 changed paths 均有 owner，且同一 plan 选择的 affected 或必要 daily-full 证据通过
      - 结果只支持当前 Task Delivery 决定，不表示已经形成 Product Artifact Candidate 或 Published Release
    requiredForDelivery: true
    environment:
      requires: [node, npm, git]
    effects:
      writes: ["系统临时目录中的验证 fixture、timing evidence 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.full-regression
    title: Buildr Product 完整日常证据
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:daily-full"]
      cwd: services/buildr
    applicability:
      paths: ["**"]
      conditions:
        - 用户明确要求完整 daily-full evidence 或独立核验完整日常回归入口
        - 高风险 Task Delivery 显式选择 full 时只选择本 capability，不同时选择 product.delivery；verification policy 通过 required override 将本能力设为交付必需
    proves:
      - Product Project 与 Buildr Service 在唯一 registry 登记的完整日常主证据全部通过
      - 内部 core compatibility profile 登记的全部 required step identities 通过同一次 daily-full执行计划；不包含Candidate-only或Release-only证据
    requiredForDelivery: false
    environment:
      requires: [node, npm, git]
      preparation:
        - project: product
          service: buildr
          recipe: buildr.npm-ci
        - project: product
          service: buildr-web
          recipe: buildr-web.npm-ci
    effects:
      writes: ["系统临时目录中的隔离 workspace、timing evidence 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.candidate
    title: Buildr Product Artifact Candidate 验证
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:candidate"]
      cwd: services/buildr
    applicability:
      paths: ["**"]
      conditions:
        - Parent 最终集成、Product Artifact Candidate 准备或维护者明确要求验证exact source与唯一候选制品
        - 本 capability 不与 product.full-regression 重复选择；daily-full结果不得重标记为Candidate artifact evidence
    proves:
      - exact source上的完整daily-full evidence与Candidate profile登记的全部required gate identities通过一次完整执行计划
      - 唯一Product Artifact Candidate tarball、package、Launcher、fresh-install/onboarding与artifact smoke primary evidence完整；不表示Published Release已经成功
    requiredForDelivery: false
    environment:
      requires: [node, npm, git]
      preparation:
        - project: product
          service: buildr
          recipe: buildr.npm-ci
        - project: product
          service: buildr-web
          recipe: buildr-web.npm-ci
    effects:
      writes: ["系统临时目录中的候选 workspace、唯一 tarball、timing evidence 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.browser-smoke
    title: Buildr Web affected 浏览器冒烟验证
    scope:
      project: product
      services: [buildr, buildr-web]
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:browser:changed"]
      cwd: services/buildr
    applicability:
      paths: ["services/buildr-web/**", "services/buildr/web-dist/**", "services/buildr/src/web/**", "services/buildr/test/browser-smoke/**", "services/buildr/test/verification/browser-selector-dispatcher.mjs", "services/buildr/test/verification/web-dist.mjs"]
      conditions:
        - Buildr Web 路由、DOM 交互、Agent Action、package、lockfile、Vite 或 TypeScript 配置发生变化
        - 未显式提供 BUILDR_CHANGED_PATHS_JSON 时，dispatcher 从 execution root 的 Git verification base 推导 changed paths
        - 适用输入至少选择一个 Browser selector；非适用输入明确返回 not-applicable，Browser-owned 0 selector 阻塞
        - selected Browser 在启动 Chrome 前，将 Buildr Web 构建到系统临时 staging 并与 tracked web-dist 精确比较
    proves:
      - 适用的 changed paths 已执行至少一个稳定 Browser selector，或被明确判定为 not-applicable
      - 临时 staging build 与 tracked web-dist 精确一致，冻结目标未被改写
      - Project、Service、Change 与 Task 页面关键浏览器交互和错误反馈可用
    requiredForDelivery: true
    environment:
      requires: [node, npm, chrome]
      preparation:
        - project: product
          service: buildr-web
          recipe: buildr-web.npm-ci
    effects:
      writes: ["系统临时目录中的隔离 Workspace、Service source 与浏览器 profile"]
      externalSystems: []
      authorization: implicit
    resourceClaims: [browser]
  - id: product.archive-lifecycle
    title: Buildr Change active/archive 生命周期契约
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-node", "--test", "test/contract/current-knowledge-governance.test.mjs", "test/contract/task-finish-sequencing.test.mjs"]
      cwd: services/buildr
    applicability:
      paths: ["openspec/changes/**", "openspec/knowledge/**", "services/buildr/resources/workspace/skills/buildr/task-finish/**", "services/buildr/test/contract/**"]
      conditions:
        - Change lifecycle、Change path resolution 或 OpenSpec sync/archive workflow 发生变化
    proves:
      - active/archived Change 定位、OpenSpec convergence 与 Task Finish 生命周期顺序保持一致
    requiredForDelivery: false
    environment:
      requires: [node]
    effects:
      writes: ["系统临时目录中的隔离 OpenSpec fixture"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.openspec-convergence-journey
    title: Buildr OpenSpec 确定性收敛完整 Journey
    scope:
      project: product
      services: []
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:openspec:convergence"]
      cwd: services/buildr
    applicability:
      paths: ["openspec/changes/**", "openspec/knowledge/**", "services/buildr/src/task/openspec/**", "services/buildr/src/bootstrap/cli/**", "services/buildr/src/task/application/finish/**", "services/buildr/test/verification/openspec/**"]
      conditions:
        - OpenSpec canonical 写入、恢复、并发 Change、archive 或 checkpoint bootstrap 发生变化
    proves:
      - 单一 receipt、隔离 strict validation、条件应用、写后确认、文件事实恢复、归档重试与并发 Change Journey 通过
    requiredForDelivery: false
    environment:
      requires: [node, npm]
    effects:
      writes: ["系统临时目录中的完整 OpenSpec Project、Change、finish run 与 receipts"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.release-artifact-set
    title: Buildr Release contract 与本机 smoke 验证
    scope:
      project: product
      services: [buildr]
    invocation:
      kind: command
      argv: ["tools/development/run-development-npm", "run", "test:focus", "--", "group:release"]
      cwd: services/buildr
    applicability:
      paths: ["services/buildr/tools/release/**", "services/buildr/src/**", "services/buildr/package/**", "services/buildr/package.json", "services/buildr/package-lock.json", "services/buildr/test/**", ".github/workflows/publish.yml"]
      conditions:
        - Application Payload、Product Artifact Candidate、Host Node、Launcher binding、Registry readback contract 或发布 workflow 发生变化
        - 本 capability 不执行真实外部发布，不构成正式 Published Release authority
    proves:
      - 同一冻结 Application Payload 只生成一次 npm tarball，并由所有 smoke、publish 与 Registry readback 复用
      - npm 安装使用兼容 Host Node，完整支持 CLI 与按需 Buildr Web
      - 显式安装的 macOS/Windows Launcher 不复制 Node 或 Buildr，精确绑定同一 npm 安装，并在 Node、entry、prefix 或 package identity 漂移时 fail closed
      - focus结果只证明Release contract/smoke，不冒充matching Candidate后的publish transaction、published install或Registry readback结果
    requiredForDelivery: false
    environment:
      requires: [node, npm, git]
    effects:
      writes: ["系统临时目录中的冻结 payload、npm tarball、Launcher fixture、timing evidence 与 diagnostics"]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
