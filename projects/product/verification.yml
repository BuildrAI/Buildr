schemaVersion: buildr.project-verification/v4
testing:
  - id: buildr-fast
    title: Buildr 后端低成本完整回归
    scope:
      project: product
      services:
        - buildr
    purpose: 验证类型、单元、组件、契约和低成本静态边界
    sourcePaths:
      - services/buildr/src/**
      - services/buildr/resources/**
      - services/buildr/tools/**/*.ts
      - services/buildr/package.json
      - services/buildr/tsconfig*.json
    testRoots:
      - services/buildr/test/unit/**
      - services/buildr/test/component/**
      - services/buildr/test/contract/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:fast
      cwd: services/buildr
    selection:
      - 开发中按修改区域选择相关 unit、component 或 contract 文件
      - 开发完成后运行完整低成本回归
    requirements:
      - node
      - npm
  - id: buildr-functional
    title: Buildr 本地集成测试
    scope:
      project: product
      services:
        - buildr
    purpose: 验证真实 CLI、SQLite、Git、HTTP 和文件系统集成边界
    sourcePaths:
      - services/buildr/src/**
      - services/buildr/resources/**
    testRoots:
      - services/buildr/test/integration/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:integration
      cwd: services/buildr
    selection:
      - 根据任务修改的应用（Application）、接口、数据和副作用选择相关集成测试文件
    requirements:
      - node
      - npm
      - git
  - id: buildr-system
    title: Buildr 系统测试
    scope:
      project: product
      services:
        - buildr
    purpose: 验证完整公共入口、工作空间（Workspace）与任务生命周期，以及跨组件运行和恢复行为
    sourcePaths:
      - services/buildr/src/**
      - services/buildr/resources/**
    testRoots:
      - services/buildr/test/system/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:system
      cwd: services/buildr
    selection:
      - 按 test/verification/system-suites.ts 的归属选择受影响系统测试，可使用 test:system --
        --owner <suite-id>
      - 需要完整系统回归时使用 full 入口，运行全部已登记系统测试
    requirements:
      - node
      - npm
      - git
  - id: buildr-web-unit
    title: Buildr Web 前端逻辑测试
    scope:
      project: product
      services:
        - buildr-web
    purpose: 验证前端状态转换、分页导航、请求处理和输入转换等可独立判断的逻辑
    sourcePaths:
      - services/buildr-web/src/**
      - services/buildr-web/package.json
      - services/buildr-web/package-lock.json
      - services/buildr-web/tsconfig*.json
      - services/buildr-web/tools/run-logic-tests.mjs
    testRoots:
      - services/buildr-web/test/*.test.mjs
    full:
      kind: command
      argv:
        - ../buildr/tools/development/run-development-npm
        - test
      cwd: services/buildr-web
    selection:
      - 从真实测试文件选择与当前逻辑变化相关的检查，使用服务已有 Node.js 测试入口
      - 需要完整前端逻辑回归时运行 full；类型构建和浏览器交互由 buildr-web 独立验证
      - 自动受影响选择通过 frontend-logic 调用本族完整入口；完整主包候选（Candidate）包含该独立源码证据，日常后端 Core
        不代表前端通过
      - npm test 与 frontend-logic 使用同一完整测试驱动；获授工作进程预算（Worker Budget）通过 Node.js
        前置 --test-concurrency 显式生效，独立调用默认 1
    requirements:
      - node
      - npm
  - id: buildr-web
    title: Buildr Web 构建与浏览器交互测试
    scope:
      project: product
      services:
        - buildr
        - buildr-web
    purpose: 验证 TypeScript 构建、页面交互和关键任务流程
    sourcePaths:
      - services/buildr-web/src/**
      - services/buildr-web/package.json
      - services/buildr-web/package-lock.json
      - services/buildr-web/tsconfig*.json
      - services/buildr-web/vite.config.ts
      - services/buildr-web/tools/**
      - services/buildr/src/web/**
      - services/buildr/tools/build/**
      - services/buildr/tools/codegen/contracts/**
      - services/buildr/tools/testing/**
      - services/buildr/test/verification/web-dist.ts
      - services/buildr/test/verification/browser-selector-dispatcher.ts
    testRoots:
      - services/buildr/test/browser-smoke/**
      - services/buildr-web/test/browser/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:browser:smoke
      cwd: services/buildr
    selection:
      - 根据受影响页面选择 test:browser:changed 或对应页面入口；需要完整浏览器检查时使用 full
      - 通过 preparation.yml 中的 buildr.browser-chromium 准备配套
        Chromium；安装、缓存复用与显式路径说明见 services/buildr/test/browser-smoke/README.md
      - 自动化测试采用无头模式（Headless），不依赖智能体（Agent）的临时浏览器工具
      - 布局与共享样式变化执行 services/buildr-web 的
        test:browser:layout；宽屏、窄屏、分屏及阅读状态由前端服务（Service）维护，生产托管与清理由 buildr
        服务（Service）提供
      - 前端逻辑测试由 buildr-web-unit 单独执行；浏览器检查通过不能替代逻辑测试
      - 临时交互与视觉审查按当前绑定和现场工具执行，分别记录 source=agent 与实际覆盖；它们不替代 Playwright
        自动化入口或其运行依赖
      - 原型候选构建使用前端现有依赖；单独执行 node tools/build-prototype.mjs <output.html>
        并在隔离生产托管中验证，不由完整浏览器入口自动生成或证明原型效果
      - 完整主包候选（Candidate）由 artifact-browser-core 消费唯一压缩包内 web-dist
        并执行核心代表旅程（Browser Journey）；该证据不代表全部选择器（Selector）通过，受影响源码验收仍按页面选择
    requirements:
      - node
      - npm
      - playwright-core（由 buildr 的锁定依赖提供）
      - playwright-chromium（通过 buildr.browser-chromium 显式准备）；或
        BUILDR_BROWSER_EXECUTABLE 指定的兼容浏览器，测试运行不下载
  - id: buildr-environment-smoke
    title: Buildr 已安装环境冒烟
    scope:
      project: product
      services:
        - buildr
        - buildr-web
    purpose: 在明确需要验证真实安装或发布环境时检查 CLI、Web 和关键入口
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
    testRoots:
      - services/buildr/test/verification/host-node/**
      - services/buildr/test/verification/release/**
    full:
      kind: agent
      instructions:
        - 只在当前任务目标包含安装、发布或真实环境采用时执行
        - 使用对应环境的 CLI、Browser 或 HTTP 工具检查关键入口并保存实际观察
    requirements:
      - explicit-target-environment
  - id: dsh-plugin
    title: DSH 桌面插件构建与装载
    scope:
      project: product
      services:
        - dsh-plugin
    location:
      kind: service
      service: dsh-plugin
    purpose: 验证正式版和开发版的构建、逻辑、同场装载与 DSH 真实加载器边界
    sourcePaths:
      - plugin/**
      - tools/**
      - sdk-patches/**
      - package.json
    testRoots:
      - test/unit/**
      - test/integration/**
    full:
      kind: command
      argv:
        - node
        - tools/verify-all.ts
      cwd: .
    selection:
      - 开发中按改动选择对应单元、进程或装载测试；完成时运行完整入口
      - 增强源码完整入口必须显式提供 --source-sdk 或 BUILDR_DSH_SOURCE_SDK_ROOT，指向经
        prepare-source-sdk 重建并核对基线、补丁清单、生成声明与产物摘要的独占软件开发工具包（SDK）；普通未补丁 rc.2 或旧
        rc.1 不代表新接口支持，不自动修改共享检出或真实配置档（Profile）
      - 桌面应用的真实按钮与跨重启交互另行验收，不能由装载测试替代
      - 自动受影响选择通过 dsh-plugin 调用完整入口并准备固定 SDK 与 pnpm@11.7.0；本族不进入独立 Buildr
        主包候选（Candidate）集合
    requirements:
      - node 24.15.0
      - pnpm
      - 已核验的来源增强软件开发工具包（SDK）、持久源码补丁清单及完整 SHA256；构建依赖通过冻结锁文件与 --ignore-scripts
        预先准备，准备器直接调用构建工具，不执行安装脚本或启用运行时（Runtime）
