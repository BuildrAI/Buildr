schemaVersion: buildr.project-verification/v4
testing:
  - id: buildr-fast
    title: Buildr 后端低成本完整回归
    scope:
      project: product
      services:
        - buildr
    purpose: 验证类型、单元、组件、契约和低成本静态边界
    sourcePaths:
      - services/buildr/src/**
      - services/buildr/resources/**
      - services/buildr/tools/**/*.ts
      - services/buildr/package.json
      - services/buildr/tsconfig*.json
    testRoots:
      - services/buildr/test/unit/**
      - services/buildr/test/component/**
      - services/buildr/test/contract/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:fast
      cwd: services/buildr
    selection:
      - 开发中按修改区域选择相关 unit、component 或 contract 文件
      - 开发完成后运行完整低成本回归
    requirements:
      - node
      - npm
  - id: buildr-functional
    title: Buildr 本地集成测试
    scope:
      project: product
      services:
        - buildr
    purpose: 验证真实 CLI、SQLite、Git、HTTP 和文件系统集成边界
    sourcePaths:
      - services/buildr/src/**
      - services/buildr/resources/**
    testRoots:
      - services/buildr/test/integration/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:integration
      cwd: services/buildr
    selection:
      - 根据任务修改的应用（Application）、接口、数据和副作用选择相关集成测试文件
    requirements:
      - node
      - npm
      - git
  - id: buildr-system
    title: Buildr 系统测试
    scope:
      project: product
      services:
        - buildr
    purpose: 验证完整公共入口、工作空间（Workspace）与任务生命周期，以及跨组件运行和恢复行为
    sourcePaths:
      - services/buildr/src/**
      - services/buildr/resources/**
    testRoots:
      - services/buildr/test/system/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:system
      cwd: services/buildr
    selection:
      - 按 test/verification/system-suites.ts 的归属选择受影响系统测试，可使用 test:system --
        --owner <suite-id>
      - 需要完整系统回归时使用 full 入口，运行全部已登记系统测试
    requirements:
      - node
      - npm
      - git
  - id: buildr-web-unit
    title: Buildr Web 前端逻辑测试
    scope:
      project: product
      services:
        - buildr-web
    purpose: 验证前端状态转换、分页导航、请求处理和输入转换等可独立判断的逻辑
    sourcePaths:
      - services/buildr-web/src/**
      - services/buildr-web/package.json
      - services/buildr-web/package-lock.json
      - services/buildr-web/tsconfig*.json
    testRoots:
      - services/buildr-web/test/*.test.mjs
    full:
      kind: command
      argv:
        - ../buildr/tools/development/run-development-npm
        - test
      cwd: services/buildr-web
    selection:
      - 从真实测试文件选择与当前逻辑变化相关的检查，使用服务已有 Node.js 测试入口
      - 需要完整前端逻辑回归时运行 full；类型构建和浏览器交互由 buildr-web 独立验证
    requirements:
      - node
      - npm
  - id: buildr-web
    title: Buildr Web 构建与浏览器交互测试
    scope:
      project: product
      services:
        - buildr
        - buildr-web
    purpose: 验证 TypeScript 构建、页面交互和关键任务流程
    sourcePaths:
      - services/buildr-web/src/**
      - services/buildr-web/package.json
      - services/buildr-web/package-lock.json
      - services/buildr-web/tsconfig*.json
      - services/buildr-web/vite.config.ts
      - services/buildr/src/web/**
      - services/buildr/tools/build/**
      - services/buildr/tools/codegen/contracts/**
      - services/buildr/tools/testing/**
      - services/buildr/test/verification/web-dist.ts
      - services/buildr/test/verification/browser-selector-dispatcher.ts
    testRoots:
      - services/buildr/test/browser-smoke/**
    full:
      kind: command
      argv:
        - tools/development/run-development-npm
        - run
        - test:browser:smoke
      cwd: services/buildr
    selection:
      - 根据受影响页面选择 test:browser:changed 或对应页面入口；需要完整浏览器检查时使用 full
      - 前端逻辑测试由 buildr-web-unit 单独执行；浏览器检查通过不能替代逻辑测试
    requirements:
      - node
      - npm
      - browser
  - id: buildr-environment-smoke
    title: Buildr 已安装环境冒烟
    scope:
      project: product
      services:
        - buildr
        - buildr-web
    purpose: 在明确需要验证真实安装或发布环境时检查 CLI、Web 和关键入口
    sourcePaths:
      - services/buildr/**
      - services/buildr-web/**
    testRoots:
      - services/buildr/test/verification/host-node/**
      - services/buildr/test/verification/release/**
    full:
      kind: agent
      instructions:
        - 只在当前任务目标包含安装、发布或真实环境采用时执行
        - 使用对应环境的 CLI、Browser 或 HTTP 工具检查关键入口并保存实际观察
    requirements:
      - explicit-target-environment
