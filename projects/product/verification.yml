schemaVersion: buildr.project-verification/v3
resources:
  - id: browser
    title: Local browser capacity
    strategy: coordinated
    capacity: 1
    authorization: implicit
capabilities:
  - id: product.verification
    title: Buildr Product verification provider
    scope:
      project: product
      services: []
    proves:
      - Frozen Task Content has the affected or full Buildr Product evidence selected by the authoritative registry
      - Product Artifact Candidate has complete daily and candidate artifact evidence for the exact source
      - Published Release requests only select registered release contract and smoke evidence without claiming publish authority
    evidence: [static, unit, component, integration, system]
    usableFor: [task-delivery, product-candidate, published-release]
    discovery:
      sources: ["**"]
    invocation:
      affected:
        kind: provider
        provider: buildr.product-verification/v1
      full:
        kind: provider
        provider: buildr.product-verification/v1
    environment:
      requires: [node, npm, git]
      preparation:
        - project: product
          service: buildr
          recipe: buildr.npm-ci
        - project: product
          service: buildr-web
          recipe: buildr-web.npm-ci
    effects:
      writes: [system temporary verification workspaces, timing evidence, diagnostics, and candidate artifacts]
      externalSystems: []
      authorization: implicit
    resourceClaims: []
  - id: product.browser-smoke
    title: Buildr Web affected browser smoke verification
    scope:
      project: product
      services: [buildr, buildr-web]
    proves:
      - Applicable Buildr Web changes execute at least one stable Browser selector or return an explicit not-applicable result
      - The staged Buildr Web build matches tracked web-dist without rewriting frozen content
      - Critical Project, Service, Change and Task browser interactions remain usable
    evidence: [system]
    usableFor: [task-delivery]
    discovery:
      sources:
        - services/buildr-web/**
        - services/buildr/web-dist/**
        - services/buildr/src/web/**
        - services/buildr/test/browser-smoke/**
        - services/buildr/test/verification/browser-selector-dispatcher.mjs
        - services/buildr/test/verification/web-dist.mjs
    invocation:
      affected:
        kind: command
        argv: [tools/development/run-development-npm, run, "test:browser:changed"]
        cwd: services/buildr
      full:
        kind: command
        argv: [tools/development/run-development-npm, run, "test:browser:smoke"]
        cwd: services/buildr
    environment:
      requires: [node, npm, chrome]
      preparation:
        - project: product
          service: buildr-web
          recipe: buildr-web.npm-ci
    effects:
      writes: [system temporary isolated Workspaces, Service sources, staged web-dist builds, and browser profiles]
      externalSystems: []
      authorization: implicit
    resourceClaims: [browser]
