builtins:
  rules: []
  skills:
    - id: task-triage
      path: resources/workspace/skills/buildr/task-triage
      target: skills/buildr/task-triage
      description: 用户提出修复、实现、重构、优化、文档/测试或契约语义调整，或询问任务应走代码修改、当前事实维护还是 OpenSpec Change 时使用。
      required: false
      requires:
        - capability: buildr.task-record
          version: 2
          mode: optional
        - capability: buildr.git-operations
          version: 1
          mode: optional
        - capability: buildr.current-knowledge-maintenance
          version: 2
          mode: optional
        - capability: buildr.task-environment
          version: 1
          mode: optional
        - capability: buildr.task-development
          version: 4
          mode: optional
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: declaration-intake
      path: resources/workspace/skills/buildr/declaration-intake
      target: skills/buildr/declaration-intake
      description: 用户要求初始化、刷新或审查 Project 的环境准备与任务验证声明，或 Project/Service 注册、首次 Task scope、Environment 缺口、Verification coverage gap、构建/依赖/测试入口变化触发声明检查时使用；只读发现 preparation.yml 与 verification.yml 候选，长期写入必须经用户确认并交给各声明 owner Skill。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: project-testing
      path: resources/workspace/skills/buildr/project-testing
      target: skills/buildr/project-testing
      description: 用户要求为Project或Service设计、梳理或优化测试框架，划分Static、Unit、Component、Integration、System边界，区分测试成本、affected/full范围与Candidate/Release验证目标，或实现功能后开发适量测试时使用；不用于执行正式Task Verification、维护verification.yml或记录任务验证报告。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-manager
      path: resources/workspace/skills/buildr/task-manager
      target: skills/buildr/task-manager
      description: 用户要求创建、查看或修订任务记录、纠正任务状态、调整已完成任务的父子关系、完成或放弃任务时使用；维护最小业务事实和结果更正历史，不执行研发、环境、验证或交付。
      required: false
      provides:
        - capability: buildr.task-record
          version: 2
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-review
      path: resources/workspace/skills/buildr/task-review
      target: skills/buildr/task-review
      description: 用户要求审查正式 Task 的方案或完成结果、查看已有 Task Review Result，或 Agent 判断需要留下轻量审查证据时使用；不用于资产复盘、Task Verification、Task Development 门禁或通用代码 Review。
      required: false
      provides:
        - capability: buildr.task-review
          version: 2
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: capability-adaptation
      path: resources/workspace/skills/buildr/capability-adaptation
      target: skills/buildr/capability-adaptation
      description: 用户要求采用内部流程、调整工作方式、修改默认 Skill 行为、创建或替换专业 Skill、卸载可能被编排的 Skill，或 Agent 准备改变 capability contract 及跨 Skill 协作边界时使用。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: ui-prototype
      path: resources/workspace/skills/buildr/ui-prototype
      target: skills/buildr/ui-prototype
      description: 用户明确需要界面原型时使用；调查现有真实界面，生成并逐页验证一个或多个使用模拟数据与交互的自包含 HTML。已有原型且用户未明确忽略时，后续 Agent 默认按原型开发页面与交互。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: project-daily-progress
      path: resources/workspace/skills/buildr/project-daily-progress
      target: skills/buildr/project-daily-progress
      description: 用户要求展示、生成或重跑某 Project 的每日演进，或询问能否每天自动执行时使用；先同步最新代码，再收集当日 Git 提交与更改文件，由 Agent 总结四问后通过 CLI 写入本机文件。读取路径不扫描 Git、不写 Task Record、不提供产品 cron。
      required: false
      requires:
        - capability: buildr.git-operations
          version: 1
          mode: optional
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-retrospective
      path: resources/workspace/skills/buildr/task-retrospective
      target: skills/buildr/task-retrospective
      description: 用户明确要求复盘已完成或已放弃的正式 Task，或要查看、处理、标记无需处理、重新打开已有复盘时使用；复盘重点检查 Agent 执行时间、token 消耗、重复尝试、人机协作或 Buildr workflow/harness 效率。不用于过程 observation、任务审查、门禁或资产自动写回。
      required: false
      provides:
        - capability: buildr.task-retrospective
          version: 2
      requires:
        - capability: buildr.task-record
          version: 2
          mode: required
      replaces:
        id: task-asset-review
        target: skills/buildr/task-asset-review
        runtimePath: task-asset-review
      legacyIntegrities:
        - sha256-e7224325aa5b2d183d9a152f336e4f24699e3fd10ea5505e08d90bd77f09f642
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-environment
      path: resources/workspace/skills/buildr/task-environment
      target: skills/buildr/task-environment
      description: 正式 Task 需要准备、检查、恢复或清理实际执行环境，或按 Task ID 取得 Environment Receipt 的当前机器事实时使用；不用于任务分流、Task Record、验证结论或 Git 集成。
      required: false
      provides:
        - capability: buildr.task-environment
          version: 1
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-worktree
      path: resources/workspace/skills/buildr/task-worktree
      target: skills/buildr/task-worktree
      description: 用户明确要求创建、检查或清理 Task 的 Git worktree 与本地任务分支，或 Task Environment 需要 Git checkout provider 时使用；不负责环境 ready、恢复、Runtime、资源或总 cleanup。
      required: false
      provides:
        - capability: buildr.git-worktree-provider
          version: 1
      legacyIntegrities:
        - sha256-23e68c3174887ebbf6990526f93e7f1c047199e1bef1f2e8e293b0cba2a3cfad
        - sha256-7c792606db5d07e9364feb4be20755e184fb83291e4ae83a9cbb4884cf731b6d
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-verification
      path: resources/workspace/skills/buildr/task-verification
      target: skills/buildr/task-verification
      description: 用户要探查或维护 Project 测试地图，开发中选择已有前后端测试，或开发完成后记录和查看 Task 验证报告时使用。
      required: false
      provides:
        - capability: buildr.task-verification
          version: 4
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-development
      path: resources/workspace/skills/buildr/task-development
      target: skills/buildr/task-development
      description: 正式Task从首个proposal、方案或直接实现开始，到稳定Content Target、Task Candidate、Current Knowledge、推进决定与研发交接的全过程使用；不用于Task Record、Task Review、Task Verification、测试执行或交付执行。
      required: false
      provides:
        - capability: buildr.task-development
          version: 4
      requires:
        - capability: buildr.task-record
          version: 2
          mode: required
        - capability: buildr.task-environment
          version: 1
          mode: required
        - capability: buildr.current-knowledge-maintenance
          version: 2
          mode: required
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: agent-first-design
      path: resources/workspace/skills/buildr/agent-first-design
      target: skills/buildr/agent-first-design
      description: 设计或改造引入智能体交付产品结果的软件，或审视智能体工作系统的职责、工作流与门禁时使用；围绕产物和真实现场划分职责。仅使用智能体开发普通软件时不自动适用。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-finish
      path: resources/workspace/skills/buildr/task-finish
      target: skills/buildr/task-finish
      description: 用户要求收尾、交付或完成本轮工作后的结束动作时使用；由智能体完成实际成果交付、已有任务结果登记及安全善后，支持有无 Buildr 任务、有无 Git 管理。
      required: false
      provides:
        - capability: buildr.task-finish
          version: 1
      requires:
        - capability: buildr.task-record
          version: 2
          mode: optional
        - capability: buildr.task-environment
          version: 1
          mode: optional
        - capability: buildr.git-operations
          version: 1
          mode: optional
      legacyIntegrities:
        - sha256-0607663344932ed85cdff84fe5c8dc817e4fc12a159a047eac054fa307fc1fd1
        - sha256-86cd3f177367700f31c232fd090e00c8ee194d2baa66ef69970511987e3ec6dd
        - sha256-1e0e321129f98abb33c4b82d6eddecd960ca0888e58a8ab47bc0776847f05fcf
        - sha256-47d716eff00cc7b20a0ff42d81b6140c7c1bb30ea9591204303bc192c48d3e4d
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: terminology-governance
      path: resources/workspace/skills/buildr/terminology-governance
      target: skills/buildr/terminology-governance
      description: Agent 在探索、提案、设计、实现或文档整理中遇到新术语、同义词、一词多义、中英不一致、Context/Context Window 等概念边界，或 consumer 需要正式术语对齐 evidence 时使用。
      required: false
      provides:
        - capability: buildr.terminology-governance
          version: 1
