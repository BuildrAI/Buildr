      required: false
      provides:
        - capability: buildr.current-knowledge-maintenance
          version: 1
        - capability: buildr.current-knowledge-maintenance
          version: 2
      requires:
        - capability: buildr.terminology-governance
          version: 1
          mode: required
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: git-operations
      path: resources/workspace/skills/buildr/git-operations
      target: skills/buildr/git-operations
      description: 用户或上游智能体（Agent）已明确选择仓库（repository）、Git 操作（Git Operation）与相关引用（ref）时使用，包括无活跃任务（active Task）的直接 Git 收尾和正式任务（formal Task）的直接交付；执行 fetch、commit、push、commit+push、rebase，或检查授权、安全边界和结果证据（result evidence）；不替 Agent 选择策略，也不扩展完整 Git 命令集。
      required: false
      provides:
        - capability: buildr.git-operations
          version: 1
      replaces:
        id: git-ops
        target: skills/buildr/git-ops
        runtimePath: git-ops
      legacyIntegrities:
        - sha256-50b5fb04eb75acb1218fc5c34caf4e0e7b66500f0df28e6f296f8b9f89e559b8
        - sha256-badf69cfc2f7983fdbd2c681f7418a542d5538bfab283dfe8da927bfdfdd96c8
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
