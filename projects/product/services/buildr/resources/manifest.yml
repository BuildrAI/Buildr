agentSkills:
  - id: buildr
    path: resources/runtime/skills/buildr
    runtimes:
      - claude-code
      - codex
      - cursor
      - qoder
      - trae
      - trae-work
      - workbuddy

capabilityContracts:
  - id: buildr.git-operations
    version: 1
    description: 为已选定的单次 Git Operation 提供授权、安全边界、前后 identity 与最小结果。
    path: resources/workspace/skills/contracts/buildr/git-operations/v1.md
    target: skills/contracts/buildr/git-operations/v1.md
    replaces:
      - id: buildr.git-single-operation
        version: 1
        target: skills/contracts/buildr/git-single-operation/v1.md
        integrity: sha256-7a3c956590b7cbb74c0676c6c3999dd078fc298da6c8f83c8c8be7963ad58379
        provider: git-ops
        description: 安全执行一个明确的 Git 操作并返回可审计结果。
      - id: buildr.git-task-integration
        version: 1
        target: skills/contracts/buildr/git-task-integration/v1.md
        integrity: sha256-e751f55c1adab0a5ca30300fec116770232796158681f7b4337ea0cac7aff88d
        provider: git-ops
        description: 提交并把已验证任务安全集成到目标分支。
      - id: buildr.git-workspace-update
        version: 1
        target: skills/contracts/buildr/git-workspace-update/v1.md
        integrity: sha256-026125f83f82e2a0a650b38b2e2ae0291c3f1ef5fd37565066d2fc36b7f0a981
        provider: git-ops
        description: 在 workspace sync 前安全更新 Git checkout。
  - id: buildr.git-worktree-provider
    version: 1
    description: 管理 Task 的 Git worktree 并返回窄 Git provider evidence。
    path: resources/workspace/skills/contracts/buildr/git-worktree-provider/v1.md
    target: skills/contracts/buildr/git-worktree-provider/v1.md
  - id: buildr.task-record
    version: 3
    description: 管理canonical Workspace中Task最小顶层事实及本机复盘文档摘要与决定状态。
    path: resources/workspace/skills/contracts/buildr/task-record/v3.md
    target: skills/contracts/buildr/task-record/v3.md
    replaces:
      - id: buildr.task-record
        version: 2
        target: skills/contracts/buildr/task-record/v2.md
        integrity: sha256-3c6f2f8e61f6381e1d09831dbe7c203229749ffcd32ec910cfa3d15d97dd494e
        provider: task-manager
        description: 管理 canonical Workspace 中待办与正式 Task 的最小顶层记录及复盘来源。
      - id: buildr.task-retrospective
        version: 2
        target: skills/contracts/buildr/task-retrospective/v2.md
        integrity: sha256-4e6b43ea1a7c4e60067f6e0de86cab6c6c8ef5ac7292316dbe18986135dd3710
        provider: task-retrospective
        description: 按需复盘terminal Task，并把有效改进通过Task来源关系落地。
      - id: buildr.task-retrospective
        version: 1
        target: skills/contracts/buildr/task-retrospective/v1.md
        integrity: sha256-db41f691851dfe8e7d1f9fb2f858d605eea27e3991e8d95faef298a504f88499
        provider: task-retrospective
        description: 对terminal Task的Agent执行效率进行按需复盘，并维护Workspace SQLite中的唯一current Markdown Result。
      - id: buildr.task-asset-review
        version: 1
        target: skills/contracts/buildr/task-asset-review/v1.md
        integrity: sha256-eb7d2d92f1cea492763a107d5c35ee0fe38406cb8480ade679b5595e6855f856
        legacyIntegrities:
          - sha256-8812af33714611af6b92c888a8204a26376e27116dc7cc63baa979141d6b2d89
        provider: task-asset-review
        description: 审查任务过程并提出可沉淀工作资产候选。
      - id: buildr.task-asset-review
        version: 2
        target: skills/contracts/buildr/task-asset-review/v2.md
        integrity: sha256-5b7dc8921816574f8981b10d01ff7dd472330cd5d6e33a70407f51ff8ec65b81
        provider: task-asset-review
        description: 持续维护任务资产 observation，并完成审查、人工决定和独立任务交接。
      - id: buildr.task-asset-review
        version: 3
        target: skills/contracts/buildr/task-asset-review/v3.md
        integrity: sha256-428ea04129a4701035617c3d35fa944cd1b20e863c4d7f9cafb76ae2a7485804
        provider: task-asset-review
        description: 持续维护任务资产 observation，并完成审查、人工决定和独立任务交接。
      - id: buildr.task-record
        version: 1
        target: skills/contracts/buildr/task-record/v1.md
        integrity: sha256-a6c1c645f9ad03345a1e7c3ec104d215e0281a6ac6452afa90cdbc2b0923c30d
        provider: task-manager
        description: 管理 canonical Workspace 中正式 Task 的最小顶层记录。
  - id: buildr.task-review
    version: 2
    description: 对正式 Task 的实际方案或完成结果执行可选语义审查并维护两个独立 current Result。
    path: resources/workspace/skills/contracts/buildr/task-review/v2.md
    target: skills/contracts/buildr/task-review/v2.md
    replaces:
      - id: buildr.task-review
        version: 1
        target: skills/contracts/buildr/task-review/v1.md
        integrity: sha256-302f709e0a0aa7f15da1f92de0de6be2be4cf009b4d4f0e49719e699a3bdf18f
        provider: task-review
        description: 对正式 Task 的计划或完成候选执行语义审查并维护两个可选 current Result。
  - id: buildr.task-verification
    version: 4
    description: 维护 Project 测试地图，并保存开发完成后的 Task 验证报告。
    path: resources/workspace/skills/contracts/buildr/task-verification/v4.md
    target: skills/contracts/buildr/task-verification/v4.md
    replaces:
      - id: buildr.task-verification
        version: 3
        target: skills/contracts/buildr/task-verification/v3.md
        integrity: sha256-c16d118fb874347c128c478206abeecaf2ba2ea9597af58bda071e43a1e926d8
        provider: task-verification
        description: 执行 Project 已声明的验证能力，并维护 Task-scoped Workspace-local current Verification Result。
      - id: buildr.task-verification
        version: 2
        target: skills/contracts/buildr/task-verification/v2.md
        integrity: sha256-030f4599e84bc24823fe95d93d3a8847335bcb6fa518fd229d8d15b364c9158e
        provider: task-verification
        description: 编排项目声明或既有政策定义的分层验证，并返回能力选择、候选身份、结果与真实耗时证据。
  - id: buildr.task-finish
    version: 1
    description: 由智能体依据真实现场组合已有工具完成成果交付、已有任务结果登记与安全善后。
    path: resources/workspace/skills/contracts/buildr/task-finish/v1.md
    target: skills/contracts/buildr/task-finish/v1.md
  - id: buildr.terminology-governance
    version: 1
    description: 调查、对齐并维护 Project 与 Service 的 canonical terminology。
    path: resources/workspace/skills/contracts/buildr/terminology-governance/v1.md
    target: skills/contracts/buildr/terminology-governance/v1.md
  - id: buildr.current-knowledge-maintenance
    version: 3
    description: 按明确范围建设、检查与维护代码地图、技术图和解释文档。
    path: resources/workspace/skills/contracts/buildr/current-knowledge-maintenance/v3.md
    target: skills/contracts/buildr/current-knowledge-maintenance/v3.md
    replaces:
      - id: buildr.current-knowledge-maintenance
        version: 1
        target: skills/contracts/buildr/current-knowledge-maintenance/v1.md
        integrity: sha256-ae0b58f004f394170420cf5a3a811b5f0716cb021b5aca6ae3e54e2a46fc3779
        provider: current-knowledge-maintenance
        description: 按 Change 真实影响评估、收敛和检查 Brief 与 Project 当前认知。
      - id: buildr.current-knowledge-maintenance
        version: 2
        target: skills/contracts/buildr/current-knowledge-maintenance/v2.md
        integrity: sha256-c15781d5fbc18516908f3f285057a9316364508607a4fbd00c791e1b9226f995
        provider: current-knowledge-maintenance
        description: 按 Change 或已确认当前事实的真实影响评估、收敛、检查或独立维护 Project 当前认知。
initialSkillBindings:
  - capability: buildr.git-operations
    version: 1
    provider: git-operations
  - capability: buildr.git-worktree-provider
    version: 1
    provider: task-worktree
  - capability: buildr.task-record
    version: 3
    provider: task-manager
  - capability: buildr.task-review
    version: 2
    provider: task-review
  - capability: buildr.task-verification
    version: 4
    provider: task-verification
  - capability: buildr.task-finish
    version: 1
    provider: task-finish
  - capability: buildr.terminology-governance
    version: 1
    provider: terminology-governance
  - capability: buildr.current-knowledge-maintenance
    version: 3
    provider: current-knowledge-maintenance
builtins:
  rules: []
  skills:
    - id: task-triage
      path: resources/workspace/skills/buildr/task-triage
      target: skills/buildr/task-triage
      description: 开始修改代码、文档、配置或技能等持久文件前使用；确定隔离位置，判断直接实施、事实维护或 OpenSpec 变更，并交接专业动作。
      required: false
      requires:
        - capability: buildr.task-record
          version: 3
          mode: optional
        - capability: buildr.git-operations
          version: 1
          mode: optional
        - capability: buildr.current-knowledge-maintenance
          version: 3
          mode: optional
        - capability: buildr.git-worktree-provider
          version: 1
          mode: optional
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: declaration-intake
      path: resources/workspace/skills/buildr/declaration-intake
      target: skills/buildr/declaration-intake
      description: 初始化、维护准备与验证声明，或项目注册、构建和测试入口变化产生声明缺口时使用；先核对差异，再交给对应维护者。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: code-map
      path: resources/workspace/skills/buildr/code-map
      target: skills/buildr/code-map
      description: 建设、更新或检查代码地图时使用；依据真实职责、目录与文件解释实现组织，并核对受影响的来源与关联。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: code-architecture
      path: resources/workspace/skills/buildr/code-architecture
      target: skills/buildr/code-architecture
      description: 设计代码结构、调整模块职责或审查文件拆分与合并时使用；局部实现沿用既有结构。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: project-testing
      path: resources/workspace/skills/buildr/project-testing
      target: skills/buildr/project-testing
      description: 设计或调整测试体系、为实现开发必要测试时使用；已有检查的选择和报告交给 task-verification。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-manager
      path: resources/workspace/skills/buildr/task-manager
      target: skills/buildr/task-manager
      description: 用户要求创建、查看或修订任务记录、纠正任务状态、调整已完成任务的父子关系、完成或放弃任务时使用；维护最小业务事实和结果更正历史，不执行研发、环境、验证或交付。
      required: false
      provides:
        - capability: buildr.task-record
          version: 3
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-review
      path: resources/workspace/skills/buildr/task-review
      target: skills/buildr/task-review
      description: 审查正式任务的方案或完成结果、查看或保存对应审查结果时使用；不用于通用代码审查。
      required: false
      provides:
        - capability: buildr.task-review
          version: 2
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: capability-adaptation
      path: resources/workspace/skills/buildr/capability-adaptation
      target: skills/buildr/capability-adaptation
      description: 修改技能行为、采用组织工作方式或调整能力声明与绑定时使用；先判断跨技能协作影响。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: ui-prototype
      path: resources/workspace/skills/buildr/ui-prototype
      target: skills/buildr/ui-prototype
      description: 用户明确需要界面原型时使用；调查现有真实界面，生成并逐页验证一个或多个使用模拟数据与交互的自包含 HTML。已有原型且用户未明确忽略时，后续 Agent 默认按原型开发页面与交互。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: ux-design-laws
      path: resources/workspace/skills/buildr/ux-design-laws
      target: skills/buildr/ux-design-laws
      description: 设计或审查界面、交互与信息层级时使用，按真实问题选择体验法则；不用于单纯实现既定设计。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: project-daily-progress
      path: resources/workspace/skills/buildr/project-daily-progress
      target: skills/buildr/project-daily-progress
      description: 查看、生成或重跑项目每日演进，或询问定时执行时使用；按明确提交范围生成四问摘要，说明观察时间与未覆盖范围。
      required: false
      requires:
        - capability: buildr.git-operations
          version: 1
          mode: optional
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-retrospective
      path: resources/workspace/skills/buildr/task-retrospective
      target: skills/buildr/task-retrospective
      description: 用户明确要求复盘已完成或已放弃的正式Task，查看本机复盘文档，或在阅读后决定是否继续行动时使用；只基于当前可见事实生成本机Markdown并维护Task上的待决策/已决策状态。
      required: false
      requires:
        - capability: buildr.task-record
          version: 3
          mode: required
      replaces:
        id: task-asset-review
        target: skills/buildr/task-asset-review
        runtimePath: task-asset-review
      legacyIntegrities:
        - sha256-e7224325aa5b2d183d9a152f336e4f24699e3fd10ea5505e08d90bd77f09f642
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-worktree
      path: resources/workspace/skills/buildr/task-worktree
      target: skills/buildr/task-worktree
      description: 按任务分流的默认隔离策略或用户要求，为任务创建、复用检查或安全清理 Git worktree 与本地任务分支时使用；只管理 Git 位置和删除安全。
      required: false
      provides:
        - capability: buildr.git-worktree-provider
          version: 1
      legacyIntegrities:
        - sha256-23e68c3174887ebbf6990526f93e7f1c047199e1bef1f2e8e293b0cba2a3cfad
        - sha256-7c792606db5d07e9364feb4be20755e184fb83291e4ae83a9cbb4884cf731b6d
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-verification
      path: resources/workspace/skills/buildr/task-verification
      target: skills/buildr/task-verification
      description: 选择项目已有检查、维护测试地图，或记录和查看任务验证报告时使用；测试由智能体直接调用项目工具。
      required: false
      provides:
        - capability: buildr.task-verification
          version: 4
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: agent-first-design
      path: resources/workspace/skills/buildr/agent-first-design
      target: skills/buildr/agent-first-design
      description: 设计或改造引入智能体交付产品结果的软件，或审视智能体工作系统的职责、工作流与门禁时使用；围绕产物和真实现场划分职责。仅使用智能体开发普通软件时不自动适用。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-finish
      path: resources/workspace/skills/buildr/task-finish
      target: skills/buildr/task-finish
      description: 用户要求收尾、交付或完成本轮工作后的结束动作时使用；由智能体完成实际成果交付、已有任务结果登记及安全善后，支持有无 Buildr 任务、有无 Git 管理。
      required: false
      provides:
        - capability: buildr.task-finish
          version: 1
      requires:
        - capability: buildr.task-record
          version: 3
          mode: optional
        - capability: buildr.git-worktree-provider
          version: 1
          mode: optional
        - capability: buildr.git-operations
          version: 1
          mode: optional
      legacyIntegrities:
        - sha256-0607663344932ed85cdff84fe5c8dc817e4fc12a159a047eac054fa307fc1fd1
        - sha256-86cd3f177367700f31c232fd090e00c8ee194d2baa66ef69970511987e3ec6dd
        - sha256-1e0e321129f98abb33c4b82d6eddecd960ca0888e58a8ab47bc0776847f05fcf
        - sha256-47d716eff00cc7b20a0ff42d81b6140c7c1bb30ea9591204303bc192c48d3e4d
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: terminology-governance
      path: resources/workspace/skills/buildr/terminology-governance
      target: skills/buildr/terminology-governance
      description: 确立或维护长期术语定义、解决影响结论的术语歧义，或需要正式术语对齐结果时使用。
      required: false
      provides:
        - capability: buildr.terminology-governance
          version: 1
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: current-knowledge-maintenance
      path: resources/workspace/skills/buildr/current-knowledge-maintenance
      target: skills/buildr/current-knowledge-maintenance
      description: 围绕用户主题构建项目或服务的架构知识，检查或维护相关文章、技术图和代码地图，或处理开发中的知识影响时使用。
      required: false
      provides:
        - capability: buildr.current-knowledge-maintenance
          version: 3
      requires:
        - capability: buildr.terminology-governance
          version: 1
          mode: optional
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: git-operations
      path: resources/workspace/skills/buildr/git-operations
      target: skills/buildr/git-operations
      description: 执行已明确仓库、操作和目标的 Git 操作，核对授权、改动归属及结果；不代选策略。
      required: false
      provides:
        - capability: buildr.git-operations
          version: 1
      replaces:
        id: git-ops
        target: skills/buildr/git-ops
        runtimePath: git-ops
      legacyIntegrities:
        - sha256-50b5fb04eb75acb1218fc5c34caf4e0e7b66500f0df28e6f296f8b9f89e559b8
        - sha256-badf69cfc2f7983fdbd2c681f7418a542d5538bfab283dfe8da927bfdfdd96c8
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-explore
      path: resources/workspace/skills/openspec/openspec-explore
      target: skills/openspec/openspec-explore
      description: 探索想法、调查问题或澄清需求时使用；只思考和梳理，不实现代码。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-propose
      path: resources/workspace/skills/openspec/openspec-propose
      target: skills/openspec/openspec-propose
      description: 用户要快速创建完整 OpenSpec change 提案、设计、规格和任务时使用。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-update-change
      path: resources/workspace/skills/openspec/openspec-update-change
      target: skills/openspec/openspec-update-change
      description: 用户要修订既有 OpenSpec change 的 proposal、design、specs 或 tasks，且不进入代码实现时使用。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-apply-change
      path: resources/workspace/skills/openspec/openspec-apply-change
      target: skills/openspec/openspec-apply-change
      description: 用户要开始或继续实现某个 OpenSpec change 的任务时使用。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-sync-specs
      path: resources/workspace/skills/openspec/openspec-sync-specs
      target: skills/openspec/openspec-sync-specs
      description: 用户要把 change 中的 delta specs 同步到主 specs，但不归档 change 时使用。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-archive-change
      path: resources/workspace/skills/openspec/openspec-archive-change
      target: skills/openspec/openspec-archive-change
      description: 用户明确要归档已完成 OpenSpec change 时使用。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-contract-guard
      path: resources/workspace/skills/buildr/openspec-contract-guard
      target: skills/buildr/openspec-contract-guard
      description: 使用 OpenSpec 时核对相关变更冲突、明确归档范围或检查中断恢复现场；只补充上游未覆盖的 Buildr 边界。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: archify
      path: resources/workspace/skills/buildr/archify
      target: skills/buildr/archify
      description: 使用 Archify 生成和验证架构、流程、时序、数据流与状态图，并交付可独立查看的 HTML。
      required: false
      component: archify
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
  commands: []

