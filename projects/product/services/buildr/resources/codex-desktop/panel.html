<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buildr 原聊天协作</title>
<style>
:root{color-scheme:light dark;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#253a33,#e1ece7);background:light-dark(#fff,#17231d)}
body{margin:0;padding:20px;box-sizing:border-box}h1{font-size:19px;margin:0 0 6px}h2{font-size:15px;margin:22px 0 8px}p{margin:8px 0}.muted{color:light-dark(#62736a,#a9baaf);font-size:12px}.notice{padding:10px 12px;background:light-dark(#eff7f2,#233a2c);border-radius:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}label{display:block;margin-top:14px}select,textarea,button{font:inherit;border:1px solid light-dark(#ccd9d0,#506357);border-radius:7px;background:light-dark(#fff,#1c2d23);color:inherit;padding:8px 10px}select,textarea{box-sizing:border-box;width:100%}textarea{resize:vertical;min-height:68px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #3c9565;outline-offset:3px}ul{list-style:none;padding:0;margin:0}li{padding:10px 0;border-bottom:1px solid light-dark(#e4ece6,#34463a)}code{font-size:12px;overflow-wrap:anywhere}.task-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.task-row span{overflow-wrap:anywhere}#status{min-height:22px}.hidden{display:none!important}
</style></head>
<body>
<h1>Buildr 原聊天协作</h1>
<p class="muted">任务事实由 Buildr 保存，持续工作接续 Codex 原聊天。</p>
<p id="connection" class="muted"></p>
<p id="connection-status" class="notice hidden" role="status"></p>
<p id="global-notice" class="notice hidden">这里是全局入口，只查看连接与导航。请在需要接续的原聊天中打开 Buildr 面板，再选择待绑定请求确认身份；这里不会发送消息或创建聊天。</p>
<p id="status" role="status" aria-live="polite">正在连接桌面宿主。</p>
<label for="workspace">工作空间（Workspace）</label><select id="workspace" disabled></select>
<div class="row"><button id="refresh" disabled>刷新当前事实</button><button id="overview" disabled>打开 Buildr 工作台</button></div>
<h2>待绑定请求</h2>
<select id="binding" disabled><option value="">尚无待绑定请求</option></select>
<p class="muted">从 Buildr 任务发起的关联请求会显示在这里。确认身份会向承载此面板的聊天发送一次请求；长期关联只在指定任务时建立。</p>
<div class="row" id="binding-actions"><button id="confirm" disabled>确认承载聊天</button><button id="receipt" disabled>核对绑定回执</button></div>
<div id="session" class="notice hidden"></div>
<h2>关联任务</h2><ul id="tasks"><li class="muted">确认原聊天身份后显示关联任务。</li></ul>
<section id="handoff-section" class="hidden"><label for="handoff-task">接续任务</label><select id="handoff-task"></select><label for="goal">本次目标（可选）</label><textarea id="goal" maxlength="2000" placeholder="补充这次希望推进的内容"></textarea><div class="row"><button id="handoff">发送到承载聊天</button><button id="handoff-receipt" disabled>核对交接回执</button></div><p class="muted">打开聊天、消息送达和任务完成分别核对；结果不明时查询原回执，不自动重发。</p></section>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id), pending = new Map();
  let sequence = 0, capabilities = {}, context = null, selectedBinding = null, handoffId = null, handoffMessageAttempted = false, busy = false, deepLink = null, navigationPending = false;
  function rpc(method, params) {
    if (window.parent === window) return Promise.reject(new Error('此页面需要 Codex 原生面板，普通网页不能代替桌面连接。'));
    const id = ++sequence;
    return new Promise((resolve,reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error('宿主响应未确认，请查询原请求回执。')); },15000);
      pending.set(id,{resolve,reject,timer}); window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
    });
  }
  function notify(method,params) { window.parent.postMessage({jsonrpc:'2.0',method,params},'*'); }
  function status(text) { byId('status').textContent = text; }
  function resize() { notify('ui/notifications/size-changed',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)}); }
  function canMessage() { return context?.surface === 'thread' && context?.connection?.status !== 'disconnected' && Object.prototype.hasOwnProperty.call(capabilities,'message'); }
  function updateConnection(connection) {
    if(!context||!connection)return;
    context.connection=connection;
    const disconnected=connection.status==='disconnected';byId('connection-status').classList.toggle('hidden',!disconnected);
    byId('tasks').inert=disconnected;
    if(disconnected){byId('connection-status').textContent=connection.safeReason||'Codex 接入已移除。组件保留安装，但桌面业务已停用；聊天、配置与任务关系保留。';byId('handoff-section').classList.add('hidden');}
    refreshButtons();
  }
  function workspaceId() { return byId('workspace').value; }
  function refreshButtons() {
    const disconnected=context?.connection?.status==='disconnected';
    byId('workspace').disabled = !context || busy || disconnected;
    byId('refresh').disabled = !context || busy || !workspaceId() || disconnected;
    byId('overview').disabled = busy || disconnected || !context?.origin || !workspaceId() || !Object.prototype.hasOwnProperty.call(capabilities,'openLinks');
    byId('binding').disabled = busy || disconnected || !workspaceId();
    byId('confirm').disabled = busy || !canMessage() || !workspaceId() || Boolean(selectedBinding);
    byId('receipt').disabled = busy || disconnected || !selectedBinding;
    byId('handoff').disabled = busy || !canMessage() || selectedBinding?.status !== 'bound' || !byId('handoff-task').value || Boolean(handoffId);
    byId('handoff-receipt').disabled = busy || disconnected || !handoffId;
  }
  async function tool(name,args) {
    const result = await rpc('tools/call',{name,arguments:args});
    if(result?.structuredContent?.connection)updateConnection(result.structuredContent.connection);
    if (result?.isError) throw new Error(result.content?.find(value => value.type === 'text')?.text || '本次请求未完成。');
    if (!result?.structuredContent) throw new Error('工具没有返回可核对的当前事实。');
    return result.structuredContent;
  }
  async function perform(action) { if(busy)return;busy=true;refreshButtons();try{await action();}catch(error){status(error.message);}finally{busy=false;refreshButtons();resize();if(navigationPending){navigationPending=false;if(deepLink&&context?.workspaces.some(item=>item.id===deepLink.workspaceId)){byId('workspace').value=deepLink.workspaceId;void perform(refreshWorkspace);}}} }
  function option(value,text) { const element=document.createElement('option');element.value=value;element.textContent=text;return element; }
  function applyHostContext(value) {
    const url=value?.['openai/deepLink']?.url;
    if(typeof url!=='string')return;
    const match=/^\/bind\/([a-f0-9-]{36})\/([a-f0-9-]{36})$/i.exec(url);
    if(!match){status('此入口未指向有效关联请求；可手动选择工作空间查看。');return;}
    deepLink={workspaceId:match[1],bindingRequestId:match[2]};
    if(busy){navigationPending=true;return;}
    if(context?.workspaces.some(item=>item.id===deepLink.workspaceId)){
      byId('workspace').value=deepLink.workspaceId;
      if(!busy)void perform(refreshWorkspace);
    }
  }
  async function open(url) { if(!Object.prototype.hasOwnProperty.call(capabilities,'openLinks'))throw new Error('宿主没有声明打开链接能力。');if(url.startsWith('/')){const current=await tool('buildr_codex_current_origin',{});context.origin=current.origin;if(!current.origin)throw new Error('Buildr 当前页面服务未运行，请先打开工作台后重试。');url=current.origin+url;}const result=await rpc('ui/open-link',{url});if(result?.isError)throw new Error('宿主没有完成打开请求。');status('已请求打开；请核对实际页面和目标。'); }
  function bindingLabel(binding) { return (binding.taskId || '仅确认原聊天') + ' · ' + binding.id; }
  function applyContext(value) {
    if (!value || !Array.isArray(value.workspaces) || !['thread','global'].includes(value.surface)) return;
    context=value;
    updateConnection(value.connection);
    byId('connection').textContent=value.connection?[value.connection.label,value.connection.installationLabel,value.connection.configurationLabel].filter(Boolean).join(' · '):'本机 Codex 连接：'+value.connectionId;
    byId('global-notice').classList.toggle('hidden',value.surface!=='global');
    byId('binding-actions').classList.toggle('hidden',value.surface!=='thread');
    const previous=workspaceId();byId('workspace').replaceChildren(...value.workspaces.map(item=>option(item.id,item.name)));
    if(value.workspaces.some(item=>item.id===previous))byId('workspace').value=previous;
    if(deepLink&&value.workspaces.some(item=>item.id===deepLink.workspaceId))byId('workspace').value=deepLink.workspaceId;
    status(value.connection?.status==='disconnected'?'Codex 接入已移除，面板业务已停用。':value.surface==='thread'?'桌面面板已加载。请选择工作空间并核对当前事实。':'全局入口已加载，不会发送聊天消息。');refreshButtons();
    if(workspaceId())void perform(refreshWorkspace);
  }
  function renderRelations(relations) {
    byId('tasks').replaceChildren();byId('handoff-task').replaceChildren();
    if(!relations.length){const item=document.createElement('li');item.className='muted';item.textContent='这个原聊天尚未关联任务。';byId('tasks').append(item);}
    for(const relation of relations){
      const item=document.createElement('li'),row=document.createElement('div'),label=document.createElement('span'),button=document.createElement('button');
      row.className='task-row';label.textContent=relation.taskId;button.textContent='打开任务';button.addEventListener('click',()=>void perform(()=>open(relation.taskUrl)));row.append(label,button);item.append(row);byId('tasks').append(item);byId('handoff-task').append(option(relation.taskId,relation.taskId));
    }
    byId('handoff-section').classList.toggle('hidden',!canMessage()||selectedBinding?.status!=='bound'||!relations.length);
  }
  async function refreshWorkspace() {
    selectedBinding=null;handoffId=null;byId('session').classList.add('hidden');byId('handoff-section').classList.add('hidden');
    const result=await tool('buildr_codex_pending_bindings',{workspaceId:workspaceId()});
    if(Object.prototype.hasOwnProperty.call(result,'origin'))context.origin=result.origin;
    byId('binding').replaceChildren(option('','确认原聊天（不关联任务）'),...result.bindings.map(binding=>option(binding.id,bindingLabel(binding))));
    if(deepLink?.workspaceId===workspaceId()&&result.bindings.some(binding=>binding.id===deepLink.bindingRequestId))byId('binding').value=deepLink.bindingRequestId;
    byId('tasks').replaceChildren();const item=document.createElement('li');item.className='muted';item.textContent='确认原聊天身份后显示关联任务。';byId('tasks').append(item);status('已读取当前请求；尚未发送消息。');
  }
  async function readBinding() {
    if(!selectedBinding)throw new Error('请先明确发送一次身份请求。');
    selectedBinding=await tool('buildr_codex_binding_receipt',{workspaceId:workspaceId(),bindingRequestId:selectedBinding.id});
    if(selectedBinding.status==='bound'){
      byId('session').textContent='已核对原聊天：'+selectedBinding.nativeSessionId;byId('session').classList.remove('hidden');
      const result=await tool('buildr_codex_relations',{workspaceId:workspaceId(),bindingRequestId:selectedBinding.id});renderRelations(result.relations);status('原聊天绑定已确认；关联任务已恢复。');
    }else status(selectedBinding.status==='expired'?'身份请求已过期；长期关联保留，请重新确认身份。':'身份请求送达待确认；不会自动重复发送。');
  }
  byId('workspace').addEventListener('change',()=>void perform(refreshWorkspace));byId('refresh').addEventListener('click',()=>void perform(refreshWorkspace));
  byId('binding').addEventListener('change',()=>{selectedBinding=null;handoffId=null;byId('session').classList.add('hidden');byId('handoff-section').classList.add('hidden');refreshButtons();});
  byId('overview').addEventListener('click',()=>void perform(()=>open('/workspaces/'+encodeURIComponent(workspaceId())+'/codex#/overview')));
  byId('confirm').addEventListener('click',()=>void perform(async()=>{
    if(!canMessage())throw new Error('只能在原聊天的面板明确发送身份请求。');
    const id=byId('binding').value;
    if(id){selectedBinding={id,status:'pending',workspaceId:workspaceId(),connectionId:context.connectionId};selectedBinding=await tool('buildr_codex_binding_receipt',{workspaceId:workspaceId(),bindingRequestId:id});}
    else{
      if(typeof window.crypto?.randomUUID!=='function')throw new Error('宿主无法准备可恢复的请求编号，本次尚未发送。');
      const bindingRequestId=window.crypto.randomUUID();
      selectedBinding={id:bindingRequestId,status:'pending',workspaceId:workspaceId(),connectionId:context.connectionId};
      selectedBinding=await tool('buildr_codex_create_binding',{workspaceId:workspaceId(),bindingRequestId});
    }
    if(selectedBinding.status!=='pending')throw new Error('请求已处理或过期，请刷新核对，未重复发送。');
    await tool('buildr_codex_connection_status',{});if(!canMessage())throw new Error('Codex 接入已移除，本次未发送聊天消息。');
    const result=await rpc('ui/message',{role:'user',content:[{type:'text',text:selectedBinding.message}]});
    if(result?.isError)throw new Error('消息送达未确认；可查询原请求回执，不会自动重发。');status('身份请求已提交；请等待原聊天处理后点击“核对绑定回执”。');
  }));
  byId('receipt').addEventListener('click',()=>void perform(readBinding));
  byId('handoff').addEventListener('click',()=>void perform(async()=>{
    if(!canMessage()||selectedBinding?.status!=='bound')throw new Error('请先核对承载聊天身份。');
    if(typeof window.crypto?.randomUUID!=='function')throw new Error('宿主无法准备可恢复的交接编号，本次尚未发送。');
    handoffId=window.crypto.randomUUID();handoffMessageAttempted=false;
    const handoff=await tool('buildr_codex_create_handoff',{workspaceId:workspaceId(),bindingRequestId:selectedBinding.id,taskId:byId('handoff-task').value,goal:byId('goal').value.trim(),handoffRequestId:handoffId});
    await tool('buildr_codex_connection_status',{});if(!canMessage())throw new Error('Codex 接入已移除，本次未发送工作交接。');
    handoffMessageAttempted=true;const result=await rpc('ui/message',{role:'user',content:[{type:'text',text:handoff.message}]});if(result?.isError)throw new Error('交接送达未确认，请查询原回执。');status('工作交接已提交；实际接收及任务完成仍须分别核对。');
  }));
  byId('handoff-receipt').addEventListener('click',()=>void perform(async()=>{const result=await tool('buildr_codex_handoff_receipt',{workspaceId:workspaceId(),handoffRequestId:handoffId});status(result.status==='received'?'准确原聊天已接收；这不表示任务完成。':result.status==='expired'?'交接请求已过期，未自动重发。':handoffMessageAttempted?'交接送达待确认，未自动重发。':'交接已准备，但消息尚未提交。不会自动发送；可刷新后重新准备。');}));
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||!event.data||event.data.jsonrpc!=='2.0')return;const value=event.data;
    if(pending.has(value.id)){const request=pending.get(value.id);pending.delete(value.id);clearTimeout(request.timer);value.error?request.reject(new Error(value.error.message||'宿主请求失败。')):request.resolve(value.result);}
    else if(value.method==='ui/notifications/tool-result')applyContext(value.params?.structuredContent);
    else if(value.method==='ui/notifications/host-context-changed')applyHostContext(value.params?.hostContext||value.params);
    else if(value.method==='ui/resource-teardown'&&value.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:value.id,result:{}},'*');
  });
  (async()=>{try{const result=await rpc('ui/initialize',{appInfo:{name:'buildr-desktop',version:'1.0.1'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});capabilities=result.hostCapabilities||{};applyHostContext(result.hostContext);notify('ui/notifications/initialized');if(window.openai?.toolOutput)applyContext(window.openai.toolOutput);if(!context)status('宿主已连接，等待入口工具结果。');resize();}catch(error){status(error.message);}refreshButtons();})();
})();
</script></body></html>
