schemaVersion: buildr.connection-definition/v1
definitionId: example
name: 组织示例
description: 制作后替换为真实能力说明
category: configuration
systemId: example
configVersion: 1
config:
  fields:
    - { key: website, label: 网站地址, type: url, required: true }
authentication:
  fields:
    - { key: username, label: 用户名, type: string, required: true, minLength: 1 }
    - { key: password, label: 密码, type: secret, required: true }
  targetFields: [website]
programs:
  cli:
    kind: bundled
    runtime: node
    entry: scripts/client.mjs
    contextProtocol: buildr.connection-context/v1
presentation:
  categoryLabel: 配置系统
  methodLabel: 组织标准接入
  groups:
    - id: access
      title: 访问方式
      fields: [config.website, authentication.username, authentication.password]
  summaryFields: [website]
  websiteField: website
