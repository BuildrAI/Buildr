schemaVersion: buildr.project-environment-preparation/v1
recipes:
  - id: example.prepare
    title: Prepare the example Project
    scope:
      kind: project
    required: true
    steps:
      - id: prepare
        cwd: .
        executable:
          kind: project
          path: scripts/prepare
        args: []
        inputs: [scripts/prepare]
        outputs:
          - path: .cache/prepared
            kind: directory
        required: true
        timeoutMs: 180000
