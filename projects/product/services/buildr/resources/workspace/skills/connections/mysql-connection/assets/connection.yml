schemaVersion: buildr.connection-definition/v1
definitionId: mysql
name: MySQL
description: MySQL 地址、完整认证组、只读连接测试与发现，以及非生产环境的受控变更；查询工具保持独立只读。
category: data-source
systemId: mysql
configVersion: 1
config:
  fields:
    - key: host
      label: 主机地址
      type: string
      required: true
      minLength: 1
      maxLength: 253
    - key: port
      label: 端口
      type: integer
      required: true
      default: 3306
      minimum: 1
      maximum: 65535
    - key: defaultDatabase
      label: 默认数据库
      description: 连接的可选数据库范围；查询工具中的展示选择与当前数据库另行保存在本机。
      type: select
      optionsFrom: databases
      maxLength: 64
    - key: targetEnvironment
      label: 目标环境
      description: 只影响受控变更；未声明时拒绝执行变更，只读测试、发现与查询不受影响。
      type: enum
      values: [dev, test, qa, reg, prod]
    - key: allowDestructive
      label: 允许破坏性语句
      description: 默认拒绝 DROP TABLE 与 TRUNCATE；开启后仍需写前核对结构摘要并回读结果。生产环境始终拒绝变更。
      type: boolean
      default: false
authentication:
  fields:
    - key: username
      label: 用户名
      type: string
      required: true
      minLength: 1
      maxLength: 128
    - key: password
      label: 密码
      type: secret
      required: true
  targetFields: [host, port]
programs:
  cli:
    kind: installed
    executable: buildr-mysql
    contextProtocol: buildr.connection-context/v1
    version:
      args: [--version]
      constraint: '=1.1.0'
    dependencies:
      - executable: node
        version:
          args: [--version]
          constraint: '>=24.15.0'
    installHint: buildr-mysql 由 Buildr 主包一同安装；请安装或更新 Buildr，并核对当前命令入口。
hooks:
  test:
    program: cli
    args: [test, --json]
    effect: read
  databases:
    program: cli
    args: [databases, --json]
    effect: read
    inputs: [config.host, config.port, authentication.username, authentication.password]
presentation:
  categoryLabel: 数据源
  methodLabel: Buildr 标准接入
  summaryFields: [host, port, defaultDatabase]
  groups:
    - id: connection
      title: 连接信息
      fields: [config.host, config.port, authentication.username, authentication.password]
    - id: scope
      title: 使用范围
      fields: [config.defaultDatabase]
    - id: write
      title: 写入范围
      fields: [config.targetEnvironment, config.allowDestructive]
