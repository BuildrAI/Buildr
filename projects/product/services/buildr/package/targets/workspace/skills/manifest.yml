schemaVersion: buildr.skills/v3
workspaceId: buildr-product-baseline
contracts:
  - id: buildr.git-operations
    version: 1
    path: contracts/buildr/git-operations/v1.md
    description: 为已选定的单次 Git Operation 提供授权、安全边界、前后 identity 与最小结果。
  - id: buildr.task-metadata-publication
    version: 1
    path: contracts/buildr/task-metadata-publication/v1.md
    description: 发布一个明确 Task 的 portable exact owned metadata，并保持 record、lifecycle 与 Git authority 分离。
  - id: buildr.task-environment
    version: 1
    path: contracts/buildr/task-environment/v1.md
    description: 管理正式 Task 的实际执行环境和唯一 Environment Receipt。
  - id: buildr.git-worktree-provider
    version: 1
    path: contracts/buildr/git-worktree-provider/v1.md
    description: 管理 Task 的 Git worktree 并返回窄 Git provider evidence。
  - id: buildr.task-record
    version: 1
    path: contracts/buildr/task-record/v1.md
    description: 管理 canonical Workspace 中正式 Task 的最小顶层记录。
  - id: buildr.task-review
    version: 1
    path: contracts/buildr/task-review/v1.md
    description: 对正式 Task 的计划或完成候选执行语义审查并维护两个可选 current Result。
  - id: buildr.task-verification
    version: 3
    path: contracts/buildr/task-verification/v3.md
    description: 执行 Project 已声明的验证能力，并维护 Task-scoped portable current Verification Result。
  - id: buildr.task-development
    version: 1
    path: contracts/buildr/task-development/v1.md
    description: 形成稳定 Content Target、verification policy、Task Candidate generation、推进决定与 immutable Finish handoff。
  - id: buildr.task-finish
    version: 1
    path: contracts/buildr/task-finish/v1.md
    description: 消费 current Development handoff，在隔离 Delivery Carrier 上机械复用或进行 Delivery Adaptation、推进目标并清理 Environment。
  - id: buildr.task-asset-review
    version: 3
    path: contracts/buildr/task-asset-review/v3.md
    description: 持续维护任务资产 observation，并完成审查、人工决定和独立任务交接。
  - id: buildr.terminology-governance
    version: 1
    path: contracts/buildr/terminology-governance/v1.md
    description: 调查、对齐并维护 Project 与 Service 的 canonical terminology。
  - id: buildr.current-knowledge-maintenance
    version: 1
    path: contracts/buildr/current-knowledge-maintenance/v1.md
    description: 按 Change 真实影响评估、收敛和检查 Brief 与 Project 当前认知。
  - id: buildr.current-knowledge-maintenance
    version: 2
    path: contracts/buildr/current-knowledge-maintenance/v2.md
    description: 按 Change 或已确认当前事实的真实影响评估、收敛、检查或独立维护 Project 当前认知。
  - id: buildr.task-board-maintenance
    version: 1
    path: contracts/buildr/task-board-maintenance/v1.md
    description: 创建或更新以稳定 Project task identity 为主的只读任务看板。
bindings:
  - capability: buildr.git-operations
    version: 1
    provider: git-operations
  - capability: buildr.task-metadata-publication
    version: 1
    provider: task-metadata-publication
  - capability: buildr.task-environment
    version: 1
    provider: task-environment
  - capability: buildr.git-worktree-provider
    version: 1
    provider: task-worktree
  - capability: buildr.task-record
    version: 1
    provider: task-manager
  - capability: buildr.task-review
    version: 1
    provider: task-review
  - capability: buildr.task-verification
    version: 3
    provider: task-verification
  - capability: buildr.task-development
    version: 1
    provider: task-development
  - capability: buildr.task-finish
    version: 1
    provider: task-finish
  - capability: buildr.task-asset-review
    version: 3
    provider: task-asset-review
  - capability: buildr.terminology-governance
    version: 1
    provider: terminology-governance
  - capability: buildr.current-knowledge-maintenance
    version: 1
    provider: current-knowledge-maintenance
  - capability: buildr.current-knowledge-maintenance
    version: 2
    provider: current-knowledge-maintenance
  - capability: buildr.task-board-maintenance
    version: 1
    provider: task-board
skills:
  - id: task-triage
    assetIdentity: buildr:skill:task-triage
    sourceIdentity: package:workspace:buildr/task-triage
    source: buildr
    path: buildr/task-triage
    description: 用户提出修复、实现、重构、优化、文档/测试或契约语义调整，或询问任务应走代码修改、当前事实维护还是 OpenSpec Change 时使用。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-triage
    requires:
      - capability: buildr.task-record
        version: 1
        mode: optional
      - capability: buildr.current-knowledge-maintenance
        version: 2
        mode: optional
      - capability: buildr.task-environment
        version: 1
        mode: optional
      - capability: buildr.task-board-maintenance
        version: 1
        mode: optional
  - id: project-testing
    assetIdentity: buildr:skill:project-testing
    sourceIdentity: package:workspace:buildr/project-testing
    source: buildr
    path: buildr/project-testing
    description: 用户要求为 Project 或 Service 设计、梳理或优化测试框架，划分 Static、Unit、Component、Integration、System 边界，区分测试成本、affected/full 范围与 Candidate/Release 验证目标，或实现功能后开发适量测试时使用；不用于执行正式 Task Verification、维护 verification.yml 或记录 Verification Result。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: project-testing
  - id: task-manager
    assetIdentity: buildr:skill:task-manager
    sourceIdentity: package:workspace:buildr/task-manager
    source: buildr
    path: buildr/task-manager
    description: 用户明确要求创建、查看、更新、完成或放弃正式 Task Record，或按 Task ID 恢复正式任务顶层事实时使用；不用于普通任务分流、只读探索、Task Environment 或任何专业阶段动作。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-manager
    provides:
      - capability: buildr.task-record
        version: 1
  - id: task-review
    assetIdentity: buildr:skill:task-review
    sourceIdentity: package:workspace:buildr/task-review
    source: buildr
    path: buildr/task-review
    description: 用户要求审查正式 Task 的计划或完成候选、查看已有 Task Review Result，或实现任务在计划/完成节点需要形成轻量审查 evidence 时使用；不用于资产沉淀复盘、Task Verification 或通用代码 Review。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-review
    provides:
      - capability: buildr.task-review
        version: 1
  - id: task-board
    assetIdentity: buildr:skill:task-board
    sourceIdentity: package:workspace:buildr/task-board
    source: buildr
    path: buildr/task-board
    description: 为跨批次、跨 change、跨团队或跨会话的复杂任务创建或更新只读任务看板；用户明确要求任务看板、整体进度、长期跟踪或使用旧称“任务驾驶舱”时也使用。简单任务不使用。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-board
    provides:
      - capability: buildr.task-board-maintenance
        version: 1
  - id: capability-adaptation
    assetIdentity: buildr:skill:capability-adaptation
    sourceIdentity: package:workspace:buildr/capability-adaptation
    source: buildr
    path: buildr/capability-adaptation
    description: 用户要求采用内部流程、调整工作方式、修改默认 Skill 行为、创建或替换专业 Skill、卸载可能被编排的 Skill，或 Agent 准备改变 capability contract 及跨 Skill 协作边界时使用。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: capability-adaptation
  - id: task-asset-review
    assetIdentity: buildr:skill:task-asset-review
    sourceIdentity: package:workspace:buildr/task-asset-review
    source: buildr
    path: buildr/task-asset-review
    description: 非简单 Workspace 任务开始探索、设计、诊断、实现或验证时持续收集轻量资产信号，用户要求复盘或沉淀，或 Task Development 在正式 handoff 前触发 finalize 时使用。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-asset-review
    provides:
      - capability: buildr.task-asset-review
        version: 3
  - id: task-environment
    assetIdentity: buildr:skill:task-environment
    sourceIdentity: package:workspace:buildr/task-environment
    source: buildr
    path: buildr/task-environment
    description: 正式 Task 需要准备、检查、恢复或清理实际执行环境，或按 Task ID 取得 Environment Receipt 的当前机器事实时使用；不用于任务分流、Task Record、验证结论或 Git 集成。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-environment
    provides:
      - capability: buildr.task-environment
        version: 1
  - id: task-worktree
    assetIdentity: buildr:skill:task-worktree
    sourceIdentity: package:workspace:buildr/task-worktree
    source: buildr
    path: buildr/task-worktree
    description: 用户明确要求创建、检查或清理 Task 的 Git worktree 与本地任务分支，或 Task Environment 需要 Git checkout provider 时使用；不负责环境 ready、恢复、Runtime、资源或总 cleanup。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-worktree
    provides:
      - capability: buildr.git-worktree-provider
        version: 1
  - id: task-verification
    assetIdentity: buildr:skill:task-verification
    sourceIdentity: package:workspace:buildr/task-verification
    source: buildr
    path: buildr/task-verification
    description: 用户要求运行已有测试、验证改动、查看 current 验证结果、报告验证耗时、初始化或更新 Project 验证能力声明，或者 Task Development 对稳定 Content Target 到达正式验证节点时使用；不用于设计测试框架、开发测试、生成 Candidate 或 Finish。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-verification
    provides:
      - capability: buildr.task-verification
        version: 3
  - id: task-development
    assetIdentity: buildr:skill:task-development
    sourceIdentity: package:workspace:buildr/task-development
    source: buildr
    path: buildr/task-development
    description: 正式实现任务在 Planning Review 后推进开发、稳定 Content Target、形成 verification policy、编排正式 Verification、冻结 Task Candidate、完成 Completion Review、记录风险决定或生成 Finish handoff 时使用；不用于 Task Record、Environment、测试开发或交付执行。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-development
    provides:
      - capability: buildr.task-development
        version: 1
    requires:
      - capability: buildr.task-record
        version: 1
        mode: required
      - capability: buildr.task-environment
        version: 1
        mode: required
      - capability: buildr.task-review
        version: 1
        mode: required
      - capability: buildr.task-verification
        version: 3
        mode: required
      - capability: buildr.current-knowledge-maintenance
        version: 2
        mode: required
      - capability: buildr.task-asset-review
        version: 3
        mode: optional
  - id: task-finish
    assetIdentity: buildr:skill:task-finish
    sourceIdentity: package:workspace:buildr/task-finish
    source: buildr
    path: buildr/task-finish
    description: 用户要求“收尾”或交付已有 current formal Development handoff 时使用；在隔离交付载体（Delivery Carrier）上机械复用或进行交付适配（Delivery Adaptation）、推进 retained target 并清理 Environment，只有 Development applicability stale 才返回 Task Development。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-finish
    provides:
      - capability: buildr.task-finish
        version: 1
    requires:
      - capability: buildr.task-development
        version: 1
        mode: required
      - capability: buildr.task-environment
        version: 1
        mode: required
      - capability: buildr.git-operations
        version: 1
        mode: optional
  - id: terminology-governance
    assetIdentity: buildr:skill:terminology-governance
    sourceIdentity: package:workspace:buildr/terminology-governance
    source: buildr
    path: buildr/terminology-governance
    description: Agent 在探索、提案、设计、实现或文档整理中遇到新术语、同义词、一词多义、中英不一致、Context/Context Window 等概念边界，或 consumer 需要正式术语对齐 evidence 时使用。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: terminology-governance
    provides:
      - capability: buildr.terminology-governance
        version: 1
  - id: current-knowledge-maintenance
    assetIdentity: buildr:skill:current-knowledge-maintenance
    sourceIdentity: package:workspace:buildr/current-knowledge-maintenance
    source: buildr
    path: buildr/current-knowledge-maintenance
    description: OpenSpec Change lifecycle 中评估、收敛或检查当前认知，或者没有 Change 但需要让 Project 当前认知追上已确认事实时使用。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: current-knowledge-maintenance
    provides:
      - capability: buildr.current-knowledge-maintenance
        version: 1
      - capability: buildr.current-knowledge-maintenance
        version: 2
    requires:
      - capability: buildr.terminology-governance
        version: 1
        mode: required
  - id: git-operations
    assetIdentity: buildr:skill:git-operations
    sourceIdentity: package:workspace:buildr/git-operations
    source: buildr
    path: buildr/git-operations
    description: 用户或上游 consumer 已明确选择 repository、Git Operation 与相关 ref，需要执行 commit、push、commit+push 或检查该动作的授权、安全边界和结果 evidence 时使用；不用于选择操作、编排 Task Finish 或扩展完整 Git 命令集。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: git-operations
    provides:
      - capability: buildr.git-operations
        version: 1
  - id: task-metadata-publication
    assetIdentity: buildr:skill:task-metadata-publication
    sourceIdentity: package:workspace:buildr/task-metadata-publication
    source: buildr
    path: buildr/task-metadata-publication
    description: 用户或lifecycle consumer要求把canonical Workspace中一个明确Task的portable exact owned records独立commit或push到Git时使用；不用于发布Candidate/源码、Task Finish、批量metadata或选择通用Git策略。
    enabled: true
    required: false
    state: installed
    runtimes: [claude-code, codex, cursor, qoder, trae, trae-work, workbuddy]
    runtimePath: task-metadata-publication
    provides:
      - capability: buildr.task-metadata-publication
        version: 1
    requires:
      - capability: buildr.git-operations
        version: 1
        mode: required
