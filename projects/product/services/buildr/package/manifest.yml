include:
  - LICENSE
  - README.md
  - docs/agent-runtime-adapters.md
  - docs/cli-reference.md
  - docs/skill-capability-contracts.md
  - docs/cli-architecture.md
  - docs/known-limitations.md
  - package/

agentSkills:
  - id: buildr
    path: package/targets/runtime/skills/buildr
    runtimes:
      - claude-code
      - codex
      - cursor
      - qoder
      - trae
      - trae-work
      - workbuddy

capabilityContracts:
  - id: buildr.git-single-operation
    version: 1
    description: 安全执行一个明确的 Git 操作并返回可审计结果。
    path: package/targets/workspace/skills/contracts/buildr/git-single-operation/v1.md
    target: skills/contracts/buildr/git-single-operation/v1.md
  - id: buildr.git-task-integration
    version: 1
    description: 提交并把已验证任务安全集成到目标分支。
    path: package/targets/workspace/skills/contracts/buildr/git-task-integration/v1.md
    target: skills/contracts/buildr/git-task-integration/v1.md
  - id: buildr.git-workspace-update
    version: 1
    description: 在 workspace sync 前安全更新 Git checkout。
    path: package/targets/workspace/skills/contracts/buildr/git-workspace-update/v1.md
    target: skills/contracts/buildr/git-workspace-update/v1.md
  - id: buildr.task-worktree-lifecycle
    version: 2
    description: 管理单仓或多仓 task environment 的放置、执行边界、保留和安全清理。
    path: package/targets/workspace/skills/contracts/buildr/task-worktree-lifecycle/v2.md
    target: skills/contracts/buildr/task-worktree-lifecycle/v2.md
  - id: buildr.task-verification
    version: 2
    description: 编排项目声明或既有政策定义的分层验证，并返回能力选择、候选身份、结果与真实耗时证据。
    path: package/targets/workspace/skills/contracts/buildr/task-verification/v2.md
    target: skills/contracts/buildr/task-verification/v2.md
  - id: buildr.task-finish
    version: 1
    description: 编排已验证任务的归档、集成、推送与本地收尾。
    path: package/targets/workspace/skills/contracts/buildr/task-finish/v1.md
    target: skills/contracts/buildr/task-finish/v1.md
  - id: buildr.task-asset-review
    version: 3
    description: 持续维护任务资产 observation，并完成审查、人工决定和独立任务交接。
    path: package/targets/workspace/skills/contracts/buildr/task-asset-review/v3.md
    target: skills/contracts/buildr/task-asset-review/v3.md
  - id: buildr.terminology-governance
    version: 1
    description: 调查、对齐并维护 Project 与 Service 的 canonical terminology。
    path: package/targets/workspace/skills/contracts/buildr/terminology-governance/v1.md
    target: skills/contracts/buildr/terminology-governance/v1.md
  - id: buildr.current-knowledge-maintenance
    version: 1
    description: 按 Change 真实影响评估、收敛和检查 Brief 与 Project 当前认知。
    path: package/targets/workspace/skills/contracts/buildr/current-knowledge-maintenance/v1.md
    target: skills/contracts/buildr/current-knowledge-maintenance/v1.md

initialSkillBindings:
  - capability: buildr.git-single-operation
    version: 1
    provider: git-ops
  - capability: buildr.git-task-integration
    version: 1
    provider: git-ops
  - capability: buildr.git-workspace-update
    version: 1
    provider: git-ops
  - capability: buildr.task-worktree-lifecycle
    version: 2
    provider: task-worktree
  - capability: buildr.task-verification
    version: 2
    provider: task-verification
  - capability: buildr.task-finish
    version: 1
    provider: task-finish
  - capability: buildr.task-asset-review
    version: 3
    provider: task-asset-review
  - capability: buildr.terminology-governance
    version: 1
    provider: terminology-governance
  - capability: buildr.current-knowledge-maintenance
    version: 1
    provider: current-knowledge-maintenance

builtins:
  rules:
    - id: buildr-core
      path: package/targets/workspace/rules/buildr/core.md
      target: rules/buildr/core.md
      description: Buildr workspace 基础契约；每次进入 workspace 都必须读取。
      required: true
  skills:
    - id: task-triage
      path: package/targets/workspace/skills/buildr/task-triage
      target: skills/buildr/task-triage
      description: 用户要求修 bug、实现或调整功能、改需求、重构、优化、补文档、补测试、调整 API/契约/权限/状态流/数据语义，或询问某项改动是否需要更新 spec、创建 change、只改代码时使用。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-board
      path: package/targets/workspace/skills/buildr/task-board
      target: skills/buildr/task-board
      description: 为复杂、长期、跨批次、跨 change、跨服务或团队的任务维护只读 HTML 任务看板、change 关联、交付批次和依赖池；用户明确要求任务看板、整体进度、长期跟踪，或使用旧称“任务驾驶舱”时也使用。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
      replaces:
        id: task-cockpit
        target: skills/buildr/task-cockpit
        runtimePath: task-cockpit
      legacyIntegrities:
        - sha256-0ac07cea3870e19c75e097a6f1df556242c8e11488419bd5f9a3bfa52f36c061
    - id: capability-adaptation
      path: package/targets/workspace/skills/buildr/capability-adaptation
      target: skills/buildr/capability-adaptation
      description: 用户要求采用内部流程、调整工作方式、修改默认 Skill 行为、创建或替换专业 Skill、卸载可能被编排的 Skill，或 Agent 准备改变 capability contract 及跨 Skill 协作边界时使用。
      required: false
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-asset-review
      path: package/targets/workspace/skills/buildr/task-asset-review
      target: skills/buildr/task-asset-review
      description: 非简单 Workspace 任务开始探索、设计、诊断、实现或验证时持续收集轻量资产信号，用户要求复盘或沉淀，或 Task Finish 触发 finalize 时使用。
      required: false
      provides:
        - capability: buildr.task-asset-review
          version: 3
      legacyIntegrities:
        - sha256-e7224325aa5b2d183d9a152f336e4f24699e3fd10ea5505e08d90bd77f09f642
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-worktree
      path: package/targets/workspace/skills/buildr/task-worktree
      target: skills/buildr/task-worktree
      description: 用户要求创建、定位、复用、保留或清理 task worktree/change-id/任务分支，或处理 task checkout、创建后环境准备与本机入口迁移时使用。
      required: false
      provides:
        - capability: buildr.task-worktree-lifecycle
          version: 2
      legacyIntegrities:
        - sha256-23e68c3174887ebbf6990526f93e7f1c047199e1bef1f2e8e293b0cba2a3cfad
        - sha256-7c792606db5d07e9364feb4be20755e184fb83291e4ae83a9cbb4884cf731b6d
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-verification
      path: package/targets/workspace/skills/buildr/task-verification
      target: skills/buildr/task-verification
      description: 用户要求测试、验证、耗时报告、初始化或更新测试声明、推进测试能力成熟度，或者实现型任务到达验证节点、Agent 准备判断或声称开发完成、Task Finish 需要核对或补齐正式验证 evidence 时使用；用户无需主动点名本 Skill。
      required: false
      provides:
        - capability: buildr.task-verification
          version: 2
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: task-finish
      path: package/targets/workspace/skills/buildr/task-finish
      target: skills/buildr/task-finish
      description: 用户在 task worktree 中要求“收尾”、完成任务、自动收尾，或要求自动完成已验证 change 的归档、提交、集成、推送和本地清理时使用。
      required: false
      provides:
        - capability: buildr.task-finish
          version: 1
      requires:
        - capability: buildr.current-knowledge-maintenance
          version: 1
          mode: required
        - capability: buildr.task-verification
          version: 2
          mode: required
        - capability: buildr.task-worktree-lifecycle
          version: 2
          mode: required
        - capability: buildr.git-task-integration
          version: 1
          mode: required
        - capability: buildr.task-asset-review
          version: 3
          mode: optional
      legacyIntegrities:
        - sha256-0607663344932ed85cdff84fe5c8dc817e4fc12a159a047eac054fa307fc1fd1
        - sha256-1e0e321129f98abb33c4b82d6eddecd960ca0888e58a8ab47bc0776847f05fcf
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: terminology-governance
      path: package/targets/workspace/skills/buildr/terminology-governance
      target: skills/buildr/terminology-governance
      description: Agent 在探索、提案、设计、实现或文档整理中遇到新术语、同义词、一词多义、中英不一致、Context/Context Window 等概念边界，或 consumer 需要正式术语对齐 evidence 时使用。
      required: false
      provides:
        - capability: buildr.terminology-governance
          version: 1
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: current-knowledge-maintenance
      path: package/targets/workspace/skills/buildr/current-knowledge-maintenance
      target: skills/buildr/current-knowledge-maintenance
      description: OpenSpec Change 创建、修订、实现、同步或 Task Finish 前，需要评估、维护、收敛或检查 Change Brief、Project 概览、产品/技术架构、核心流程、Service 说明和术语时使用。
      required: false
      provides:
        - capability: buildr.current-knowledge-maintenance
          version: 1
      requires:
        - capability: buildr.terminology-governance
          version: 1
          mode: required
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: git-ops
      path: package/targets/workspace/skills/buildr/git-ops
      target: skills/buildr/git-ops
      description: 用户表达提交、推送、拉取、pull、合并、merge、rebase、checkout、switch、reset、cherry-pick、revert、stash、发布、删除分支等单项 Git 意图，或 Git 操作存在授权、范围、amend、远端改写、工作区转换、分支删除等歧义时使用。
      required: false
      provides:
        - capability: buildr.git-single-operation
          version: 1
        - capability: buildr.git-task-integration
          version: 1
        - capability: buildr.git-workspace-update
          version: 1
      legacyIntegrities:
        - sha256-badf69cfc2f7983fdbd2c681f7418a542d5538bfab283dfe8da927bfdfdd96c8
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-explore
      path: package/targets/workspace/skills/openspec/openspec-explore
      target: skills/openspec/openspec-explore
      description: 探索想法、调查问题或澄清需求时使用；只思考和梳理，不实现代码。
      required: false
      component: openspec
      requires:
        - capability: buildr.terminology-governance
          version: 1
          mode: optional
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-propose
      path: package/targets/workspace/skills/openspec/openspec-propose
      target: skills/openspec/openspec-propose
      description: 用户要快速创建完整 OpenSpec change 提案、设计、规格和任务时使用。
      required: false
      component: openspec
      requires:
        - capability: buildr.current-knowledge-maintenance
          version: 1
          mode: required
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-update-change
      path: package/targets/workspace/skills/openspec/openspec-update-change
      target: skills/openspec/openspec-update-change
      description: 用户要修订既有 OpenSpec change 的 proposal、design、specs 或 tasks，且不进入代码实现时使用。
      required: false
      component: openspec
      requires:
        - capability: buildr.current-knowledge-maintenance
          version: 1
          mode: required
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-apply-change
      path: package/targets/workspace/skills/openspec/openspec-apply-change
      target: skills/openspec/openspec-apply-change
      description: 用户要开始或继续实现某个 OpenSpec change 的任务时使用。
      required: false
      component: openspec
      requires:
        - capability: buildr.current-knowledge-maintenance
          version: 1
          mode: required
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-sync-specs
      path: package/targets/workspace/skills/openspec/openspec-sync-specs
      target: skills/openspec/openspec-sync-specs
      description: 用户要把 change 中的 delta specs 同步到主 specs，但不归档 change 时使用。
      required: false
      component: openspec
      requires:
        - capability: buildr.current-knowledge-maintenance
          version: 1
          mode: required
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-archive-change
      path: package/targets/workspace/skills/openspec/openspec-archive-change
      target: skills/openspec/openspec-archive-change
      description: 用户明确要归档已完成 OpenSpec change 时使用。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
    - id: openspec-contract-guard
      path: package/targets/workspace/skills/buildr/openspec-contract-guard
      target: skills/buildr/openspec-contract-guard
      description: 创建、同步或归档 OpenSpec change 时建立契约基线，并检测并行冲突、陈旧 delta 和同步结果漂移。
      required: false
      component: openspec
      runtimes: ["claude-code","codex","cursor","qoder","trae","trae-work","workbuddy"]
  commands: []

components:
  - id: openspec
    path: package/targets/workspace/components/buildr/openspec/component.yml
    defaultEnabled: true
    required: false

workspaceDirectories:
  - commands
  - components
  - projects
  - rules
  - skills

workspaceFiles:
  - package/targets/workspace/AGENTS.md => AGENTS.md render
  - package/targets/workspace/.buildr/workspace.yml => .buildr/workspace.yml render
  - package/targets/workspace/projects/manifest.yml => projects/manifest.yml copy
  - package/targets/workspace/gitignore => .gitignore copy
  - package/targets/workspace/rules/manifest.yml => rules/manifest.yml copy
  - package/targets/workspace/rules/buildr/core.md => rules/buildr/core.md copy
  - package/targets/workspace/commands/manifest.yml => commands/manifest.yml copy
  - package/targets/workspace/components/manifest.yml => components/manifest.yml copy
  - package/targets/workspace/skills/manifest.yml => skills/manifest.yml copy
  - package/targets/workspace/skills/contracts/buildr/git-single-operation/v1.md => skills/contracts/buildr/git-single-operation/v1.md copy
  - package/targets/workspace/skills/contracts/buildr/git-task-integration/v1.md => skills/contracts/buildr/git-task-integration/v1.md copy
  - package/targets/workspace/skills/contracts/buildr/git-workspace-update/v1.md => skills/contracts/buildr/git-workspace-update/v1.md copy
  - package/targets/workspace/skills/contracts/buildr/task-worktree-lifecycle/v2.md => skills/contracts/buildr/task-worktree-lifecycle/v2.md copy
  - package/targets/workspace/skills/contracts/buildr/task-verification/v2.md => skills/contracts/buildr/task-verification/v2.md copy
  - package/targets/workspace/skills/contracts/buildr/task-finish/v1.md => skills/contracts/buildr/task-finish/v1.md copy
  - package/targets/workspace/skills/contracts/buildr/task-asset-review/v1.md => skills/contracts/buildr/task-asset-review/v1.md copy
  - package/targets/workspace/skills/contracts/buildr/task-asset-review/v2.md => skills/contracts/buildr/task-asset-review/v2.md copy
  - package/targets/workspace/skills/contracts/buildr/task-asset-review/v3.md => skills/contracts/buildr/task-asset-review/v3.md copy
  - package/targets/workspace/skills/contracts/buildr/terminology-governance/v1.md => skills/contracts/buildr/terminology-governance/v1.md copy
  - package/targets/workspace/skills/contracts/buildr/current-knowledge-maintenance/v1.md => skills/contracts/buildr/current-knowledge-maintenance/v1.md copy
  - package/targets/workspace/skills/buildr/task-triage/SKILL.md => skills/buildr/task-triage/SKILL.md copy
  - package/targets/workspace/skills/buildr/task-board/SKILL.md => skills/buildr/task-board/SKILL.md copy
  - package/targets/workspace/skills/buildr/task-board/agents/openai.yaml => skills/buildr/task-board/agents/openai.yaml copy
  - package/targets/workspace/skills/buildr/task-board/assets/task-board-template.html => skills/buildr/task-board/assets/task-board-template.html copy
  - package/targets/workspace/skills/buildr/capability-adaptation/SKILL.md => skills/buildr/capability-adaptation/SKILL.md copy
  - package/targets/workspace/skills/buildr/capability-adaptation/agents/openai.yaml => skills/buildr/capability-adaptation/agents/openai.yaml copy
  - package/targets/workspace/skills/buildr/task-asset-review/SKILL.md => skills/buildr/task-asset-review/SKILL.md copy
  - package/targets/workspace/skills/buildr/task-asset-review/agents/openai.yaml => skills/buildr/task-asset-review/agents/openai.yaml copy
  - package/targets/workspace/skills/buildr/task-asset-review/scripts/observation.mjs => skills/buildr/task-asset-review/scripts/observation.mjs copy
  - package/targets/workspace/skills/buildr/task-asset-review/templates/observation.md => skills/buildr/task-asset-review/templates/observation.md copy
  - package/targets/workspace/skills/buildr/task-asset-review/templates/asset-maintenance-record.md => skills/buildr/task-asset-review/templates/asset-maintenance-record.md copy
  - package/targets/workspace/skills/buildr/task-worktree/SKILL.md => skills/buildr/task-worktree/SKILL.md copy
  - package/targets/workspace/skills/buildr/task-verification/SKILL.md => skills/buildr/task-verification/SKILL.md copy
  - package/targets/workspace/skills/buildr/task-verification/references/project-verification-v1.md => skills/buildr/task-verification/references/project-verification-v1.md copy
  - package/targets/workspace/skills/buildr/task-verification/templates/project-verification.yml => skills/buildr/task-verification/templates/project-verification.yml copy
  - package/targets/workspace/skills/buildr/task-finish/SKILL.md => skills/buildr/task-finish/SKILL.md copy
  - package/targets/workspace/skills/buildr/terminology-governance/SKILL.md => skills/buildr/terminology-governance/SKILL.md copy
  - package/targets/workspace/skills/buildr/current-knowledge-maintenance/SKILL.md => skills/buildr/current-knowledge-maintenance/SKILL.md copy
  - package/targets/workspace/skills/buildr/git-ops/SKILL.md => skills/buildr/git-ops/SKILL.md copy

projectDirectories:
  - openspec/specs
  - openspec/knowledge
  - openspec/changes
  - services

projectFiles:
  - package/targets/workspace/projects/AGENTS.project.md => AGENTS.md render
  - package/targets/workspace/projects/capabilities.yml => capabilities.yml copy
  - package/targets/workspace/projects/commands.yml => commands.yml copy
  - package/targets/workspace/projects/services/manifest.yml => services/manifest.yml render

templateVariables:
  - name
  - description
  - profile
  - workspaceId
  - project
  - projectId

forbiddenPatterns:
  - /Users/
  - organizations/
  - rules/AGENTS.private.md
  - integrations/openspec.md
