schemaVersion: buildr.project-preparation/v1
# 顺序即依赖：buildr-harness 必须先安装并构建，buildr 的 postinstall 会物化它的公开包。
entries:
  - id: buildr-harness.npm-ci
    title: 安装 Harness 核心及独立入口锁定依赖
    scope: {kind: service, service: buildr-harness}
    cwd: services/buildr-harness
    executable: ../buildr/tools/development/run-development-npm
    args: [ci, --ignore-scripts]
  - id: buildr-harness-web.npm-ci
    title: 安装独立 Harness 网页锁定依赖
    scope: {kind: service, service: buildr-harness-web}
    cwd: services/buildr-harness-web
    executable: ../buildr/tools/development/run-development-npm
    args: [ci, --ignore-scripts]
  - id: buildr-harness-web.build
    title: 构建完整唯一 Harness 网页
    scope: {kind: service, service: buildr-harness-web}
    cwd: services/buildr-harness-web
    executable: ../buildr/tools/development/run-development-npm
    args: [run, build]
  - id: buildr-harness.build
    title: 编译智能体服务公开包入口
    scope: {kind: service, service: buildr-harness}
    cwd: services/buildr-harness
    executable: ../buildr/tools/development/run-development-npm
    args: [run, build]
  - id: buildr.npm-ci
    title: 安装 Buildr 主体锁定依赖
    scope: {kind: service, service: buildr}
    cwd: services/buildr
    executable: tools/development/run-development-npm
    args: [ci, --install-links]
  - id: buildr-web.npm-ci
    title: 安装 Buildr Web 锁定依赖
    scope: {kind: service, service: buildr-web}
    cwd: services/buildr-web
    executable: ../buildr/tools/development/run-development-npm
    args: [ci]
  - id: dsh-plugin.npm-ci
    title: 安装 DSH 插件源码锁定依赖
    scope: {kind: service, service: dsh-plugin}
    cwd: services/dsh-plugin
    executable: ../buildr/tools/development/run-development-npm
    args: [ci, --ignore-scripts]
  - id: buildr.browser-chromium
    title: 准备 Playwright 配套 Chromium
    scope: {kind: service, service: buildr}
    cwd: services/buildr
    executable: tools/development/run-development-npm
    args: [run, browser:prepare]
