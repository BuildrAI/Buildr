schemaVersion: buildr.project-environment-preparation/v1
recipes:
  - id: buildr.npm-ci
    title: Prepare Buildr CLI and Buildr Web Runtime dependencies
    scope:
      kind: service
      service: buildr
    required: true
    steps:
      - id: npm-ci
        cwd: .
        executable:
          kind: project
          path: services/buildr/tools/development/run-development-npm
        args: [ci]
        inputs: [package.json, package-lock.json]
        outputs:
          - path: node_modules
            kind: directory
        required: true
        timeoutMs: 300000
  - id: buildr-web.npm-ci
    title: Prepare Buildr Web Frontend Service dependencies
    scope:
      kind: service
      service: buildr-web
    required: true
    steps:
      - id: npm-ci
        cwd: .
        executable:
          kind: project
          path: services/buildr/tools/development/run-development-npm
        args: [ci]
        inputs: [package.json, package-lock.json]
        outputs:
          - path: node_modules
            kind: directory
        required: true
        timeoutMs: 300000
