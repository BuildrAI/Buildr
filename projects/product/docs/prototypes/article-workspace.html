{id:'more-and-better',title:'Buildr：让 Agent 越做越多，越做越好',summary:'让每一次工作留下可接续的成果，让经验成为下一次工作的起点。',project:'product',status:'published',updated:'2026-09-20',kind:'产品文章',saved:true,body:`过去几年，我们一直在学习怎么把大模型用进工作。模型越来越会理解意图、调用工具、写代码、分析资料，甚至能把一个任务推进很远。

但真正开始用 Agent 做事后，我越来越强烈地感到：问题已经不只是“Agent 能不能完成一次任务”，而是它完成之后，下一步能不能接着做。

## 一项工作，不是一次对话

一项真实的工作，往往从一个模糊的想法开始，经过产品判断、方案设计、前后端开发、测试验证，最后才到发布。中间会涉及多个代码仓、历史决策、业务规则、外部工具和不同角色。

如果需求、规则、实现和验证结果只留在聊天记录、个人经验、本机文件和零散文档里，每一次换人、换 Agent、换窗口，工作就会重新开始。需要重新解释背景，重新确认规则，也可能重新踩一遍已经踩过的坑。

## 只靠 Agent 还不够

Buildr 要补上的，是不同智能体和工作环节之间缺少共同基础的问题。人负责目标、业务判断和关键授权；智能体负责理解任务、调用工具、推进工作；Buildr 让它们共同依赖的内容不必每次从零开始。

> 工作成果应当可以被独立查看、修改和接续。

## 真正要积累的是什么

当智能体开始参与真实工作时，值得长期留下来的通常有两类东西。

- 工作事实：我们在做什么，业务如何运转，哪些项目、服务、代码和规范彼此相关。
- 工作方法：我们应该怎么做，哪些边界不能碰，怎样测试、发布、排查和交接。

前者让智能体知道这件事是什么；后者让智能体知道这件事该怎样稳妥地完成。Buildr 帮助它在需要时找到与当前目标有关的需求、约束和已有成果。

## 先把一件事真正做完

更重要的体验是：能不能在一个工作现场里，把一件真实的事从探索持续推进到交付；结束之后，调研、判断、实现和验证能不能成为下一次工作的起点。

> 让组织的工作方式，成为所有智能体的共同能力。

这样，智能体才能从局部任务走向一项完整工作，也能让每一次调研、实现和判断，成为下一次工作的起点。`},
{id:'work-infrastructure',title:'Buildr：Agent 的工作基础设施',summary:'把目标、当前事实与工作方法连接起来，让多种入口接续同一份成果。',project:'product',status:'published',updated:'2026-09-18',kind:'产品文章',saved:false,body:'一项真实的工作需要可以重新观察的事实、清晰的职责与可接续的成果。\n\n## 从当前事实开始\n\n人和智能体每次继续工作，都应先核对成果当前的内容。对话帮助表达目标，页面帮助理解和直接操作。\n\n## 让方法可以复用\n\n把重复实践中的判断方法和边界保留下来，智能体可以根据现场选择使用。\n\n## 围绕成果协作\n\n目标完成应能从真实成果得到验证；读到同一份内容，是继续协作的基础。'},
{id:'workspace-practice',title:'从一个目标开始：我的工作空间实践',summary:'一次从模糊需求到可验收成果的记录，以及如何把经验留下来。',project:'practice',status:'draft',updated:'2026-09-17',kind:'实践记录',saved:false,body:'这篇文章记录一次工作空间的使用实践。\n\n## 一个具体目标\n\n先说清希望看到的结果，再梳理已有资料与当前约束。\n\n## 过程中留下什么\n\n判断的依据、实际改变的成果，以及能让下一位参与者继续工作的说明。\n\n## 还需要补充\n\n补入具体案例、页面和真实验证结果。'},
{id:'reading-design',title:'让阅读回到工作现场',summary:'文章、架构知识与相关材料如何在同一个界面中互相连接。',project:'product',status:'planned',updated:'2026-09-15',kind:'设计思考',saved:true,body:'阅读一篇材料时，常常需要理解它与当前工作的关系。\n\n## 先给出上下文\n\n在正文附近展示所属项目、当前稿件状态，以及与主题有关的资料。\n\n## 连续阅读\n\n相关资料在副屏展开。返回列表后保留搜索与筛选，让阅读不必重新开始。\n\n## 一个清晰的收藏入口\n\n收藏用于保存具体资料。关注项目则用于持续进入一个工作范围。'},

derRows()}}
function renderRows(){const rows=selectedArticles();$('#list-count').textContent=rows.length+' 篇文章';let head=previewState==='error'?'<div class="banner"><span>文章暂时无法更新，仍显示上次读取的内容。</span><button class="btn small" data-action="refresh">重试</button></div>':'';if(previewState==='loading'){$('#list-body').innerHTML='<div class="table-wrap" aria-label="正在读取文章">'+Array.from({length:4},()=>'<div class="skeleton-row"></div>').join('')+'</div>';return}if(previewState==='empty'||!rows.length){$('#list-body').innerHTML=head+'<div class="table-wrap empty">'+icon('doc')+'<h3>'+(previewState==='empty'?'还没有文章':'没有找到匹配的文章')+'</h3><p>'+(previewState==='empty'?'把一个想法写成第一篇草稿。':'试试其他关键词，或清除当前筛选。')+'</p><button class="btn '+(previewState==='empty'?'primary':'')+'" data-action="'+(previewState==='empty'?'new':'clear-filters')+'">'+(previewState==='empty'?'新建文章':'清除筛选')+'</button></div>';return}$('#list-body').innerHTML=head+'<div class="table-wrap"><table class="article-table"><colgroup><col style="width:49%"><col style="width:16%"><col style="width:11%"><col style="width:13%"><col style="width:11%"></colgroup><thead><tr><th>文章 / 摘要</th><th>所属项目</th><th>稿件状态</th><th>最近更新</th><th style="text-align:right">操作</th></tr></thead><tbody>'+rows.map(a=>'<tr class="article-row" data-open="'+a.id+'"><td><a class="article-title" href="#article/'+a.id+'">'+esc(a.title)+'</a><p class="article-desc">'+esc(a.summary)+'</p></td><td><span class="project-dot"></span>'+projectName[a.project]+'</td><td><span class="pill '+a.status+'">'+statusName[a.status]+'</span></td><td class="date">'+a.updated+'</td><td><div class="row-actions"><button class="btn quiet icon '+(a.saved?'starred':'')+'" data-action="save" data-id="'+a.id+'" aria-label="'+(a.saved?'取消收藏':'收藏')+'：'+esc(a.title)+'" title="'+(a.saved?'取消收藏':'收藏文章')+'">'+icon('star')+'</button><button class="btn quiet icon" data-action="more" data-id="'+a.id+'" aria-label="更多操作：'+esc(a.title)+'">'+icon('more')+'</button></div></td></tr>').join('')+'</tbody></tabl function openWorkspaceSettings(id){editingWorkspace=id;const w=workspaceRecords[id],draft=workspaceDrafts[id]||structuredClone(w);workspaceDrafts[id]=draft;closeLayer();$('#layers').innerHTML='<div class="drawer-cover"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="workspace-settings-title"><header class="drawer-head"><div><span class="label">'+esc(w.name)+'</span><h2 id="workspace-settings-title">工作空间设置</h2></div><button class="btn quiet icon" data-action="close" aria-label="关闭工作空间设置">'+icon('close')+'</button></header><form id="workspace-settings-form" class="settings-form"><div class="drawer-body"><div class="workspace-settings-marker"><span>'+icon('folder')+'</span><strong>'+esc(w.name)+'</strong></div><div class="field"><label for="workspace-name-input">名称</label><input id="workspace-name-input" value="'+esc(draft.name)+'" required maxlength="80" autocomplete="off"></div><div class="field"><label for="workspace-description-input">说明</label><textarea id="workspace-description-input" required rows="5" placeholder="这个工作空间用于什么工作？">'+esc(draft.description)+'</textarea></div><div class="workspace-location">'+icon('folder')+'<div><strong>本地目录</strong><code>'+esc(w.path)+'</code><p class="settings-readonly">用于识别工作空间，目录位置保持不变。</p></div></div></div><footer class="drawer-footer"><button type="button" class="btn" data-action="cancel-workspace-settings">取消</button><button type="submit" class="btn primary">保存修改</button></footer></form></aside></div>';document.body.classList.add('modal-open');$('#workspace-name-input').oninput=e=>draft.name=e.target.value;$('#workspace-description-input').oninput=e=>draft.description=e.target.value;$('#workspace-settings-form').onsubmit=e=>{e.preventDefault();if(!draft.name.trim()||!draft.description.trim())return;workspaceRecords[id]={...w,name:draft.name.trim(),description:draft.description.trim()};delete workspaceDrafts[id];closeLayer();if(route==='settings')navigate('catalog');else render(true);toast('工作空间信息已在预览中更新')};$('#workspace-name-input').focus()}

document.addEventListener('click',e=>{const section=e.target.closest('[data-section]');if(section){e.preventDefault();document.getElementById(section.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'});return}const pa=e.target.closest('[data-project-articles]');if(pa){e.preventDefault();projectFilter=pa.dataset.projectArticles;navigate('list');return}const b=e.target.closest('[data-action]');if(!b){const row=e.target.closest('[data-open]');if(row&&!e.target.closest('a'))navigate('article/'+row.dataset.open);if($('.popover')&&!e.target.closest('.popover'))closeLayer();if(e.target.classList.contains('modal-cover')||e.target.classList.contains('drawer-cover'))closeLayer();return}e.preventDefault();const op=b.dataset.action,id=b.dataset.id||activeId,a=find(id);switch(op){case'list':navigate('list');break;case'project':navigate('project/'+(b.dataset.project||defaultProject()));break;case'workbench':navigate('workbench');break;case'article':sourceMode=false;navigate('article/'+id);break;case'workspace':workspaceMenu(b);break;case'catalog':navigate('catalog');break;case'open-workspace':switchWorkspace(b.dataset.workspace);break;case'workspace-settings':openWorkspaceSettings(b.dataset.workspace||currentWorkspace);break;case'cancel-workspace-settings':delete workspaceDrafts[editingWorkspace];route==='settings'?navigate('catalog'):closeLayer();break;case'exit':toast('预览中不会退出真实 Buildr 应用');break;case'unavailable':toast('本预览聚焦文章与关注、收藏流程');break;case'skills':toast('文章写作入口中提供起草、润色、审校与改写方法');break;case'new':openNew();break;case'close':route==='settings'?navigate('catalog'):closeLayer();break;case'scope-all':scope='all';renderList();break;case'scope-saved':scope='saved';renderList();break;case'clear-filters':query='';projectFilter='';statusFilter='';scope='all';renderList();break;case'save':a.saved=!a.saved;toast(a.saved?'已加入工作台收藏的资料':'已取消收藏');if(route==='list')renderList();else if(route==='project')renderProject();else renderArticle();break;case'follow':{const code=b.dataset.project||currentProjectCode();const had=followedProjects.has(code);had?followedProjects.delete(code):followedProjects.add(code);toast(had?'已取消关注项目':'已加入工作台关注的项目');nav();route==='workbench'?renderWorkbench():renderProject();break}case'refresh':previewState='normal';$('#preview-state').value='normal';lastRead=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});render(true);toast('预览内容已刷新，保留当前筛选');break;case'more':more(id,b);break;case'edit':editBuffer=null;navigate('edit/'+id);break;case'cancel-edit':editBuffer=null;navigate('article/'+activeId);break;case'save-edit':if(!editBuffer.title.trim()){toast('请填写文章标题');$('#edit-title').focus();break}Object.assign(a,editBuffer,{updated:'2026-09-20'});editBuffer=null;navigate('article/'+id);toast('修改已保存在当前预览中');break;case'edit-mode':if(b.dataset.mode==='preview'){$('#edit-preview').innerHTML=markdown($('#edit-body').value);$('#edit-preview').hidden=false;$('#edit-body').hidden=true}else{$('#edit-preview').hidden=true;$('#edit-body').hidden=false}document.querySelectorAll('[data-action="edit-mode"]').forEach(x=>x.classList.toggle('selected',x===b));break;case'agent':openAgent(id,b.dataset.method||'');break;case'agent-method':agentMethod=b.dataset.method;document.querySelectorAll('[data-action="agent-method"]').forEach(x=>x.classList.toggle('active',x===b));$('#handoff').innerHTML='';break;case'prepare-writing':prepareWriting();break;case'copy-request':copy($('#writing-prompt').textContent,'写作请求已复制，尚未执行');break;case'source':sourceMode=!sourceMode;navigate('article/'+id);break;case'copy-link':copy(location.href.split('#')[0]+'#article/'+id,'预览文章链接已复制');closeLayer();break;case'export':openExport(id);break;case'copy-export':copy($('#export-content').value,'Markdown 正文已复制');break;case'delete':removeArticle(id);break;case'confirm-delete':articles=articles.filter(x=>x.id!==id);navigate('list');toast('文章已从当前预览移除');break;case'publication':publication(id);break;case'material':material();break;case'collapse':document.body.classList.toggle('collapsed');break;case'menu':$('#sidebar').classList.toggle('open');break;case'search':navigate('list');setTimeout(()=>$('#article-search')?.focus(),50);break;case'reset':articles=structuredClone(currentWorkspace==='buildr'?initialArticles:personalArticles);followedProjects=new Set(currentWorkspace==='buildr'?['product']:[]);query='';scope='all';projectFilter='';statusFilter='';previewState='normal';$('#preview-state').value='normal';navigate('list');toast('已恢复初始示例数据');break}});
$('#preview-state').onchange=e=>{previewState=e.target.value;navigate('list')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});window.addEventListener('hashchange',()=>{render();$('#sidebar').classList.remove('open')});render();
</script>
