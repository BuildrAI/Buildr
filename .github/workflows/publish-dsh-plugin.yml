name: Publish DSH plugin
run-name: DSH ${{ inputs.operation }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a candidate, or publish exactly one previously prepared candidate
        required: true
        default: prepare
        type: choice
        options: [prepare, publish]
      version:
        description: Exact current plugin version without v; this workflow never changes it
        required: true
        type: string
      candidate_run_id:
        description: Successful main adoption or legacy prepare run (publish only)
        required: false
        type: string
      source_candidate_run_id:
        description: Successful original verify run containing the plugin Candidate (prepare only)
        required: false
        type: string
      source_commit:
        description: Exact original tested source commit (prepare only)
        required: false
        type: string
      selection_identity:
        description: Frozen source selection digest (prepare only)
        required: false
        type: string
      recovery_run_id:
        description: Latest prior publish run for this version; required after a possible request
        required: false
        type: string
      buildr_peer_origin:
        description: Frozen Buildr peer origin, registry or candidate (prepare only)
        required: false
        type: string
      buildr_peer_version:
        description: Exact frozen Buildr peer version (prepare only)
        required: false
        type: string
      buildr_peer_integrity:
        description: Exact frozen Buildr peer SHA512 SRI (prepare only)
        required: false
        type: string
      buildr_candidate_run_id:
        description: Successful frozen Buildr candidate run, required for candidate peer (prepare only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dsh-plugin-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLUGIN_SOURCE_CANDIDATE_RUN_ID: ${{ inputs.source_candidate_run_id }}
      PLUGIN_SOURCE_COMMIT: ${{ inputs.source_commit }}
      PLUGIN_SELECTION_IDENTITY: ${{ inputs.selection_identity }}
      PLUGIN_OPERATION: ${{ inputs.operation }}
      PLUGIN_VERSION: ${{ inputs.version }}
      PLUGIN_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      PLUGIN_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      PLUGIN_BUILDR_PEER_ORIGIN: ${{ inputs.buildr_peer_origin }}
      PLUGIN_BUILDR_PEER_VERSION: ${{ inputs.buildr_peer_version }}
      PLUGIN_BUILDR_PEER_INTEGRITY: ${{ inputs.buildr_peer_integrity }}
      PLUGIN_BUILDR_CANDIDATE_RUN_ID: ${{ inputs.buildr_candidate_run_id }}
    defaults:
      run:
        working-directory: projects/product/services/dsh-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Validate manual source inputs
        run: node tools/release-workflow.ts input-check
      - name: Download the original verified plugin Candidate
        uses: actions/download-artifact@v7
        with:
          name: plugin-candidate-v${{ inputs.version }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_candidate_run_id }}
      - name: Download the original source aggregate
        uses: actions/download-artifact@v7
        with:
          name: plugin-candidate-aggregate
          path: ${{ runner.temp }}/verification
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_candidate_run_id }}
      - name: Adopt original Candidate through its protected main inclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node tools/release-workflow.ts adopt-candidate
          --candidate "${RUNNER_TEMP}/candidate/candidate.json"
          --aggregate "${RUNNER_TEMP}/verification/plugin-candidate-ci-aggregate.json"
          --output "${RUNNER_TEMP}/verification/plugin-candidate-adoption.json"
      - name: Upload the original candidate bytes
        uses: actions/upload-artifact@v7
        with:
          name: plugin-candidate-v${{ inputs.version }}
          path: |
            ${{ runner.temp }}/candidate/candidate.json
            ${{ runner.temp }}/candidate/*.tgz
          if-no-files-found: error
          retention-days: 90
      - name: Preserve original verification and main adoption
        uses: actions/upload-artifact@v7
        with:
          name: plugin-candidate-aggregate
          path: |
            ${{ runner.temp }}/verification/plugin-candidate-ci-aggregate.json
            ${{ runner.temp }}/verification/plugin-full-verification.json
            ${{ runner.temp }}/verification/plugin-candidate-adoption.json
          if-no-files-found: error
          retention-days: 90

  publish:
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: projects/product/services/dsh-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Verify candidate run and complete publication history
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_SOURCE_CANDIDATE_RUN_ID: ${{ inputs.source_candidate_run_id }}
          PLUGIN_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PLUGIN_SELECTION_IDENTITY: ${{ inputs.selection_identity }}
          PLUGIN_OPERATION: ${{ inputs.operation }}
          PLUGIN_VERSION: ${{ inputs.version }}
          PLUGIN_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PLUGIN_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          PLUGIN_BUILDR_PEER_ORIGIN: ${{ inputs.buildr_peer_origin }}
          PLUGIN_BUILDR_PEER_VERSION: ${{ inputs.buildr_peer_version }}
          PLUGIN_BUILDR_PEER_INTEGRITY: ${{ inputs.buildr_peer_integrity }}
          PLUGIN_BUILDR_CANDIDATE_RUN_ID: ${{ inputs.buildr_candidate_run_id }}
        run: node tools/release-workflow.ts publish-check
      - name: Download the exact prepared candidate
        uses: actions/download-artifact@v7
        with:
          name: plugin-candidate-v${{ inputs.version }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download the original prepare compatibility evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: plugin-candidate-aggregate
          path: ${{ runner.temp }}/verification
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Recover the prior publication journal
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: plugin-publication-v${{ inputs.version }}
          path: ${{ runner.temp }}/publication
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run_id }}
      - name: Require downloaded recovery evidence
        if: inputs.recovery_run_id != ''
        run: test -f "${RUNNER_TEMP}/publication/publication.json"
      - name: Install isolated fixed publisher
        run: |
          mkdir -p "${RUNNER_TEMP}/tooling"
          touch "${RUNNER_TEMP}/tooling/user.npmrc" "${RUNNER_TEMP}/tooling/global.npmrc"
          cd "${RUNNER_TEMP}/tooling"
          env -i PATH="${PATH}" NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/tooling/user.npmrc" NPM_CONFIG_GLOBALCONFIG="${RUNNER_TEMP}/tooling/global.npmrc" \
            npm install --prefix "${RUNNER_TEMP}/tooling" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org/ npm@11.5.1
      - name: Publish immutable plugin
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: >-
          node tools/trusted-publish.ts
          --manifest "${RUNNER_TEMP}/candidate/candidate.json"
          --version "${PLUGIN_VERSION}"
          --source-commit "${GITHUB_SHA}"
          --verification "${RUNNER_TEMP}/verification/plugin-full-verification.json"
          --adoption "${RUNNER_TEMP}/verification/plugin-candidate-adoption.json"
          --output "${RUNNER_TEMP}/publication/publication.json"
          --npm-cli "${RUNNER_TEMP}/tooling/node_modules/npm/bin/npm-cli.js"
      - name: Preserve publication evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-publication-v${{ inputs.version }}
          path: ${{ runner.temp }}/publication/publication.json
          if-no-files-found: warn
          retention-days: 90
