name: Publish Harness product
run-name: Harness ${{ inputs.mode }} ${{ inputs.release_target }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Independent release target
        required: true
        type: choice
        options:
          - harness
          - dsh-buildr-harness
      version:
        description: Exact approved package version
        required: true
        type: string
      candidate_run_id:
        description: Run ID of the preserved candidate artifact in this repository
        required: true
        type: string
      candidate_artifact:
        description: Exact preserved artifact name containing original tgz, candidate.json and verification.json
        required: true
        type: string
      source_commit:
        description: Exact original source commit
        required: true
        type: string
      original_sha256:
        description: SHA-256 of the exact approved original tarball
        required: true
        type: string
      mode:
        description: Publish only once; otherwise reconcile readback
        required: true
        type: choice
        options:
          - readback
          - publish
        default: readback

permissions: {}
concurrency:
  group: harness-publish-${{ inputs.release_target }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'BuildrAI/Buildr'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check candidate source run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT_NAME: ${{ inputs.candidate_artifact }}
          ORIGINAL_SHA256: ${{ inputs.original_sha256 }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$ORIGINAL_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$ARTIFACT_NAME" = "harness-original-$ORIGINAL_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e '
            .path == ".github/workflows/preserve-harness.yml" and
            .head_branch == "main" and .repository.id == 993537957 and
            .event == "workflow_dispatch" and .conclusion == "success"'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/harness-original
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Publish or read back approved original
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ORIGINAL_SHA256: ${{ inputs.original_sha256 }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: node skills/buildr-release/scripts/harness-publish.ts "$RUNNER_TEMP/harness-original" "$SOURCE_COMMIT" "$ORIGINAL_SHA256" "$RELEASE_MODE"
