name: Verify Buildr

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  dev-feedback:
    name: Development feedback (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Install product dependencies
        run: npm ci
      - name: Prepare managed Workspace Node
        working-directory: .
        env:
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
        shell: bash
        run: projects/product/buildr sync codex --target .
      - name: Resolve changed verification base
        id: base
        working-directory: .
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Verify changed product scope
        env:
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
          BUILDR_TIMING_OUTPUT: ${{ runner.temp }}/development-feedback-timing.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/development-feedback-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        shell: bash
        run: npm run test:changed -- --base "${{ steps.base.outputs.sha }}"
      - name: Upload development timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-feedback-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/development-feedback-timing.json
            ${{ runner.temp }}/development-feedback-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-bootstrap:
    name: Candidate bootstrap
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev')
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - run: npm ci
      - name: Prepare managed Workspace Node
        working-directory: .
        env:
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
        run: projects/product/buildr sync codex --target .
      - name: Run cheap Candidate preflight
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-preflight
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-preflight-macos.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-preflight-diagnostics
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: npm run test:candidate:ci -- preflight-macos
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-preflight-macos
          path: ${{ runner.temp }}/candidate-evidence
          if-no-files-found: warn
          overwrite: true

      - name: Build the single Candidate artifact
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-artifact-run
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-artifact-macos.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-artifact-diagnostics
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: npm run test:candidate:ci -- artifact-macos
      - name: Upload immutable Candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
          if-no-files-found: error
          overwrite: true
      - name: Upload artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-artifact-macos
          path: ${{ runner.temp }}/candidate-evidence
          if-no-files-found: warn
          overwrite: true

  candidate-core-macos:
    name: Candidate core (macOS)
    needs: candidate-bootstrap
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
      - name: Prepare managed Workspace Node
        working-directory: .
        env:
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
        run: projects/product/buildr sync codex --target .
      - name: Run macOS core shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-core
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-core-macos.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-core-diagnostics
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: npm run test:candidate:ci -- core-macos
      - name: Upload core evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-core-macos
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-core-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-runtime-windows:
    name: Candidate Windows (runtime-windows)
    needs: candidate-bootstrap
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
      - name: Prepare managed Workspace Node
        working-directory: .
        env:
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
        shell: bash
        run: projects/product/buildr sync codex --target .
      - name: Run Windows runtime shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-runtime-windows
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-runtime-windows.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-runtime-windows-diagnostics
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        shell: bash
        run: npm run test:candidate:ci -- runtime-windows
      - name: Upload Windows runtime evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-runtime-windows
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-runtime-windows-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-windows:
    name: Candidate Windows (${{ matrix.shard }})
    needs: candidate-bootstrap
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [workspace-lifecycle-windows, task-workflow-windows, fresh-build-windows]
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            projects/product/services/buildr/package-lock.json
            projects/product/services/buildr-web/package-lock.json
      - run: npm ci
      - name: Prepare Buildr Web dependencies for offline fresh build
        if: matrix.shard == 'fresh-build-windows'
        working-directory: projects/product/services/buildr-web
        run: npm ci --ignore-scripts
      - name: Prepare managed Workspace Node
        working-directory: .
        env:
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
        shell: bash
        run: projects/product/buildr sync codex --target .
      - name: Run Windows Candidate shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-${{ matrix.shard }}
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.shard }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-${{ matrix.shard }}-diagnostics
          BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        shell: bash
        run: npm run test:candidate:ci -- ${{ matrix.shard }}
      - name: Upload Windows evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-${{ matrix.shard }}-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-host-node:
    name: Candidate Host Node (${{ matrix.id }})
    needs: candidate-bootstrap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: host-minimum-macos
            os: macos-latest
            node: 24.15.0
          - id: host-minimum-windows
            os: windows-latest
            node: 24.15.0
          - id: host-current-macos
            os: macos-latest
            node: 24.x
          - id: host-current-windows
            os: windows-latest
            node: 24.x
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
      - name: Verify Host Node tuple against the shared artifact
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-host
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.id }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-host-diagnostics
        shell: bash
        run: npm run test:candidate:host -- ${{ matrix.id }}
      - name: Upload Host Node evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-host-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-gate:
    name: Candidate gate
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'))
    needs:
      - candidate-bootstrap
      - candidate-core-macos
      - candidate-runtime-windows
      - candidate-windows
      - candidate-host-node
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Prepare aggregate evidence directory
        working-directory: .
        run: mkdir -p "${{ runner.temp }}/candidate-evidence"
      - name: Download all Candidate evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: candidate-evidence-*
          path: ${{ runner.temp }}/candidate-evidence
          merge-multiple: true
      - name: Aggregate the closed Candidate evidence set
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_EVIDENCE_DIR: ${{ runner.temp }}/candidate-evidence
          BUILDR_CANDIDATE_CI_AGGREGATE_OUTPUT: ${{ runner.temp }}/candidate-ci-aggregate.json
        run: node test/verification/candidate-ci.mjs aggregate
      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-aggregate
          path: ${{ runner.temp }}/candidate-ci-aggregate.json
          if-no-files-found: warn
          overwrite: true
