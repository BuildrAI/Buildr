name: Verify Buildr

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Candidate execution purpose
        required: true
        default: candidate
        type: choice
        options: [candidate, release-rehearsal]
      diagnostic_scope:
        description: Independent source diagnosis; does not produce a complete Candidate
        required: false
        default: none
        type: choice
        options: [none, core-project-task-macos, nested-git-isolation-windows]
      expected_source_tree:
        description: Exact source tree required for release rehearsal or source diagnosis
        required: false
        type: string
      rehearsal_identity:
        description: Closed release rehearsal identity
        required: false
        type: string
      release_packages:
        description: Explicit publication targets (buildr, dsh-plugin, or buildr,dsh-plugin); omitted preserves the Buildr Candidate entry
        required: false
        default: ''
        type: string
      buildr_version:
        description: Exact selected Buildr version (only when Buildr is selected)
        required: false
        type: string
      plugin_version:
        description: Exact selected plugin version (only when the plugin is selected)
        required: false
        type: string
      buildr_peer_version:
        description: Exact published Buildr peer for an independent plugin Candidate
        required: false
        type: string
      buildr_peer_integrity:
        description: Observed published Buildr tarball integrity
        required: false
        type: string
      selection_id:
        description: Frozen source selection identity namespace
        required: false
        type: string
      selection_baseline:
        description: Exact selected development baseline commit
        required: false
        type: string
      selection_main:
        description: Exact observed protected main commit before freezing
        required: false
        type: string
      selection_identity:
        description: Frozen source selection digest
        required: false
        type: string
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILDR_CANDIDATE_PURPOSE: ${{ inputs.purpose || 'candidate' }}
  BUILDR_CANDIDATE_EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree || '' }}
  BUILDR_RELEASE_REHEARSAL_IDENTITY: ${{ inputs.rehearsal_identity || '' }}
  BUILDR_RELEASE_PACKAGES: ${{ inputs.release_packages || '' }}
  BUILDR_SOURCE_BUILDR_VERSION: ${{ inputs.buildr_version || '' }}
  BUILDR_PLUGIN_VERSION: ${{ inputs.plugin_version || '' }}
  BUILDR_SELECTION_ID: ${{ inputs.selection_id || '' }}
  BUILDR_SELECTION_BASELINE: ${{ inputs.selection_baseline || '' }}
  BUILDR_SELECTION_MAIN: ${{ inputs.selection_main || '' }}
  BUILDR_SELECTION_IDENTITY: ${{ inputs.selection_identity || '' }}
  BUILDR_BUILDR_PEER_VERSION: ${{ inputs.buildr_peer_version || '' }}
  BUILDR_BUILDR_PEER_INTEGRITY: ${{ inputs.buildr_peer_integrity || '' }}

jobs:
  dev-feedback-macos:
    name: Development feedback (macOS affected and Browser)
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Resolve changed verification base
        id: base
        working-directory: .
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Plan affected Browser evidence
        id: browser
        env:
          BUILDR_VERIFICATION_BASE: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          node test/verification/browser-selector-dispatcher.ts --output "${RUNNER_TEMP}/development-browser-plan.json"
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "selected=" + (plan.status === "selected") + "\n");' "${RUNNER_TEMP}/development-browser-plan.json"
      - name: Install product dependencies
        run: npm ci
      - name: Plan affected service dependencies
        id: services
        shell: bash
        run: |
          node test/verification/changed.ts --json --base "${{ steps.base.outputs.sha }}" > "${RUNNER_TEMP}/development-service-plan.json"
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const selected = new Set(plan.steps.map(step => step.id)); fs.appendFileSync(process.env.GITHUB_OUTPUT, "frontend=" + selected.has("frontend-logic") + "\n" + "dsh=" + selected.has("dsh-plugin") + "\n");' "${RUNNER_TEMP}/development-service-plan.json"
      - name: Install Buildr Web dependencies
        if: steps.browser.outputs.selected == 'true' || steps.services.outputs.frontend == 'true'
        working-directory: projects/product/services/buildr-web
        run: npm ci
      - name: Install pinned DSH package manager
        if: steps.services.outputs.dsh == 'true'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/dsh-tooling"
          : > "${RUNNER_TEMP}/dsh-tooling/user.npmrc"
          : > "${RUNNER_TEMP}/dsh-tooling/global.npmrc"
          cd "${RUNNER_TEMP}/dsh-tooling"
          env -i PATH="${PATH}" NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/dsh-tooling/user.npmrc" NPM_CONFIG_GLOBALCONFIG="${RUNNER_TEMP}/dsh-tooling/global.npmrc" \
            npm install --prefix "${RUNNER_TEMP}/dsh-tooling" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org/ pnpm@11.7.0
      - name: Prepare pinned DSH SDK
        if: steps.services.outputs.dsh == 'true'
        working-directory: projects/product/services/dsh-plugin
        shell: bash
        run: |
          node tools/prepare-release-sdk.ts --node "$(command -v node)" --pnpm "${RUNNER_TEMP}/dsh-tooling/node_modules/pnpm/bin/pnpm.cjs" > "${RUNNER_TEMP}/development-dsh-sdk.json"
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (result.schemaVersion !== "buildr.dsh-release-sdk/v1" || result.status !== "prepared" || typeof result.sdk !== "string" || !path.isAbsolute(result.sdk) || /[\u0000-\u001f\u007f]/.test(result.sdk)) throw new Error("SDK output missing"); fs.appendFileSync(process.env.GITHUB_ENV, `BUILDR_DSH_SOURCE_SDK_ROOT=${result.sdk}\n`);' "${RUNNER_TEMP}/development-dsh-sdk.json"
      - name: Observe the exact published Buildr peer for affected plugin checks
        if: steps.services.outputs.dsh == 'true'
        shell: bash
        run: |
          node tools/release/package-artifact-observation.ts --package buildr --discover current --tarball "${RUNNER_TEMP}/development-buildr-peer.tgz" --output "${RUNNER_TEMP}/development-buildr-peer.json"
          node --input-type=module -e 'import fs from "node:fs"; fs.appendFileSync(process.env.GITHUB_ENV, `BUILDR_DSH_BUILDR_PEER_INPUT=${process.argv[1]}\n`);' "${RUNNER_TEMP}/development-buildr-peer.json"
      - name: Verify changed product scope
        env:
          BUILDR_TIMING_OUTPUT: ${{ runner.temp }}/development-feedback-timing.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/development-feedback-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci
        shell: bash
        run: npm run test:changed -- --base "${{ steps.base.outputs.sha }}"
      - name: Prepare affected Browser environment
        if: steps.browser.outputs.selected == 'true'
        run: npm run test:browser:install
      - name: Verify affected Browser evidence
        if: steps.browser.outputs.selected == 'true'
        env:
          BUILDR_VERIFICATION_BASE: ${{ steps.base.outputs.sha }}
          BUILDR_BROWSER_PLAN_OUTPUT: ${{ runner.temp }}/development-browser-plan.json
        run: npm run test:browser:changed
      - name: Upload macOS development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-feedback-macos
          path: |
            ${{ runner.temp }}/development-browser-plan.json
            ${{ runner.temp }}/development-service-plan.json
            ${{ runner.temp }}/development-feedback-timing.json
            ${{ runner.temp }}/development-feedback-diagnostics
          if-no-files-found: warn
          overwrite: true

  dev-feedback-windows:
    name: Development feedback (Windows platform-sensitive)
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Resolve changed verification base
        id: base
        working-directory: .
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Plan Windows platform-sensitive evidence
        id: windows-plan
        shell: bash
        run: |
          node test/verification/changed.ts --json --development-runner windows --base "${{ steps.base.outputs.sha }}" > "${RUNNER_TEMP}/development-windows-plan.json"
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "selected=" + (plan.steps.length > 0) + "\n");' "${RUNNER_TEMP}/development-windows-plan.json"
      - name: Install product dependencies
        if: steps.windows-plan.outputs.selected == 'true'
        run: npm ci
      - name: Verify Windows platform-sensitive product scope
        if: steps.windows-plan.outputs.selected == 'true'
        env:
          BUILDR_TIMING_OUTPUT: ${{ runner.temp }}/development-windows-timing.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/development-windows-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        shell: bash
        run: npm run test:changed -- --development-runner windows --base "${{ steps.base.outputs.sha }}"
      - name: Upload Windows development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-feedback-windows
          path: |
            ${{ runner.temp }}/development-windows-plan.json
            ${{ runner.temp }}/development-windows-timing.json
            ${{ runner.temp }}/development-windows-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-plan:
    name: Candidate plan
    if: (!inputs.diagnostic_scope || inputs.diagnostic_scope == 'none') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.plan.outputs.source }}
      artifact: ${{ steps.plan.outputs.artifact }}
      host: ${{ steps.plan.outputs.host }}
      buildr: ${{ steps.scope.outputs.buildr }}
      plugin: ${{ steps.scope.outputs.plugin }}
      joint: ${{ steps.scope.outputs.joint }}
      candidate_peer: ${{ steps.scope.outputs.candidate_peer }}
      plugin_version: ${{ steps.scope.outputs.plugin_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          package-manager-cache: false
      - name: Resolve checks from the complete frozen source difference
        id: scope
        working-directory: projects/product/services/buildr
        run: node tools/release/verify-pr-candidate.ts plan
      - id: plan
        if: steps.scope.outputs.buildr == 'true'
        working-directory: projects/product/services/buildr
        run: node test/verification/candidate-ci.ts plan

  diagnostic-core-project-task-macos:
    name: Independent diagnosis (core-project-task-macos)
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_scope == 'core-project-task-macos'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - name: Verify the closed diagnosis inputs
        working-directory: .
        shell: bash
        env:
          DIAGNOSTIC_SCOPE: ${{ inputs.diagnostic_scope }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_PURPOSE: ${{ inputs.purpose }}
          EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree }}
          RELEASE_INPUTS_PRESENT: ${{ inputs.release_packages != '' || inputs.buildr_version != '' || inputs.plugin_version != '' || inputs.buildr_peer_version != '' || inputs.buildr_peer_integrity != '' || inputs.selection_id != '' || inputs.selection_baseline != '' || inputs.selection_main != '' || inputs.selection_identity != '' || inputs.rehearsal_identity != '' }}
        run: |
          fail() { printf '%s\n' "$1" >&2; exit 1; }
          [[ "$DIAGNOSTIC_SCOPE" == 'core-project-task-macos' ]] || fail 'Unsupported source diagnosis scope.'
          [[ "$DISPATCH_REF" == 'refs/heads/dev' && "$DISPATCH_PURPOSE" == 'candidate' ]] || fail 'Source diagnosis requires the dev Candidate entry.'
          [[ "$RELEASE_INPUTS_PRESENT" == 'false' ]] || fail 'Source diagnosis does not accept release selection or rehearsal inputs.'
          [[ "$EXPECTED_SOURCE_TREE" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]] || fail 'Source diagnosis requires an exact source tree.'
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Verify the closed diagnosis source
        env:
          EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const expectedTree = process.env.EXPECTED_SOURCE_TREE ?? '';
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const sourceTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          if (sourceCommit !== process.env.CANDIDATE_SOURCE_SHA || sourceTree !== expectedTree) throw new Error('Source diagnosis checkout differs from the dispatched source.');
          process.stdout.write(`[source-diagnosis] commit=${sourceCommit} tree=${sourceTree}\n`);
          NODE
      - name: Prepare the original Candidate source environment
        run: node tools/verification/candidate-environment.ts prepare --profile source-runtime
      - name: Diagnose the original independent source shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/diagnostic-core-project-task-macos/run
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/diagnostic-core-project-task-macos/evidence/candidate-ci-evidence-core-project-task-macos.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/diagnostic-core-project-task-macos/diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
          BUILDR_ARCHIFY_COST_DIAGNOSTICS: '1'
        run: node test/verification/candidate-ci.ts run core-project-task-macos
      - name: Upload independent source diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-core-project-task-macos
          path: ${{ runner.temp }}/diagnostic-core-project-task-macos
          if-no-files-found: warn
          overwrite: true

  diagnostic-nested-git-isolation-windows:
    name: Independent diagnosis (nested-git-isolation-windows)
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_scope == 'nested-git-isolation-windows'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/product/services/buildr
        shell: bash
    steps:
      - name: Verify the closed diagnosis inputs
        working-directory: .
        env:
          DIAGNOSTIC_SCOPE: ${{ inputs.diagnostic_scope }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_PURPOSE: ${{ inputs.purpose }}
          EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree }}
          RELEASE_INPUTS_PRESENT: ${{ inputs.release_packages != '' || inputs.buildr_version != '' || inputs.plugin_version != '' || inputs.buildr_peer_version != '' || inputs.buildr_peer_integrity != '' || inputs.selection_id != '' || inputs.selection_baseline != '' || inputs.selection_main != '' || inputs.selection_identity != '' || inputs.rehearsal_identity != '' }}
        run: |
          fail() { printf '%s\n' "$1" >&2; exit 1; }
          [[ "$DIAGNOSTIC_SCOPE" == 'nested-git-isolation-windows' ]] || fail 'Unsupported source diagnosis scope.'
          [[ "$DISPATCH_REF" == 'refs/heads/dev' && "$DISPATCH_PURPOSE" == 'candidate' ]] || fail 'Source diagnosis requires the dev Candidate entry.'
          [[ "$RELEASE_INPUTS_PRESENT" == 'false' ]] || fail 'Source diagnosis does not accept release selection or rehearsal inputs.'
          [[ "$EXPECTED_SOURCE_TREE" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]] || fail 'Source diagnosis requires an exact source tree.'
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Verify the closed diagnosis source
        env:
          EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const sourceTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          if (sourceCommit !== process.env.CANDIDATE_SOURCE_SHA || sourceTree !== process.env.EXPECTED_SOURCE_TREE) throw new Error('Source diagnosis checkout differs from the dispatched source.');
          if (process.versions.node !== '24.15.0') throw new Error('Source diagnosis requires the original Candidate Node runtime.');
          process.stdout.write(`[source-diagnosis] commit=${sourceCommit} tree=${sourceTree}\n`);
          NODE
      - name: Prepare the original Candidate source environment
        run: node tools/verification/candidate-environment.ts prepare --profile base
      - name: Measure the original isolated nested Git scenario
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/diagnostic-nested-git-isolation-windows
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync, spawnSync } from 'node:child_process';
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const sourceTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          const output = process.env.DIAGNOSTIC_OUTPUT;
          fs.mkdirSync(output, { recursive: true });
          const startedAt = new Date().toISOString();
          const started = performance.now();
          const result = spawnSync(process.execPath, [
            'tools/development/run-isolated-workspace-smoke.ts',
            '--script', 'test/integration/non-git-workspace-continuity.test.ts',
            '--', '--nested-git-isolation-scenario',
          ], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024, env: process.env });
          const durationMs = Math.round(performance.now() - started);
          const stdout = result.stdout ?? '';
          const stderr = result.stderr ?? '';
          fs.writeFileSync(path.join(output, 'stdout.log'), stdout);
          fs.writeFileSync(path.join(output, 'stderr.log'), stderr);
          let receipt = null;
          try { receipt = JSON.parse(stdout.trim().split('\n').at(-1)); } catch {}
          const expectedPhases = ['preconditions', 'workspace-init', 'source-registration', 'worktree-selection', 'materials-provenance', 'anchor-conflict', 'association-ambiguity', 'delivery', 'group-cleanup', 'observed-recovery', 'unrelated-source', 'escape-guard'];
          const phases = [];
          for (const line of stderr.split('\n')) {
            let record;
            try { record = JSON.parse(line); } catch { continue; }
            if (record?.schemaVersion !== 'buildr.nested-git-phase/v1' || record.operation !== 'nested-git-isolation') continue;
            if (!expectedPhases.includes(record.phase) || !['started', 'completed'].includes(record.event)) continue;
            if (!Number.isSafeInteger(record.elapsedMs) || record.elapsedMs < 0) continue;
            if (record.event === 'completed' && (!Number.isSafeInteger(record.durationMs) || record.durationMs < 0)) continue;
            phases.push({ phase: record.phase, event: record.event, elapsedMs: record.elapsedMs, ...(record.event === 'completed' ? { durationMs: record.durationMs } : {}) });
          }
          const phasesComplete = phases.length === 24 && expectedPhases.every(phase => ['started', 'completed'].every(event => phases.filter(record => record.phase === phase && record.event === event).length === 1));
          const rootAbsent = typeof receipt?.temporaryRoot === 'string' && path.isAbsolute(receipt.temporaryRoot) && !fs.existsSync(receipt.temporaryRoot);
          const receiptPassed = receipt?.schemaVersion === 'buildr.workspace-smoke-run/v1' && receipt.status === 'passed' && receipt.exitCode === 0 && receipt.cleanup === 'cleaned' && rootAbsent;
          const passed = result.status === 0 && !result.error && receiptPassed && phasesComplete && stdout.includes('Nested Git public Worktree lifecycle passed.');
          const summary = {
            schemaVersion: 'buildr.nested-git-source-diagnosis/v1',
            scope: 'nested-git-isolation-windows', proofScope: 'standalone-nested-git-isolation-scenario',
            originalSystemCaseVerified: false, status: passed ? 'passed' : 'failed',
            sourceCommit, sourceTree, purpose: 'candidate',
            workflow: { runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT },
            runner: { platform: process.platform, arch: process.arch, nodeVersion: process.versions.node },
            startedAt, finishedAt: new Date().toISOString(), durationMs,
            exitCode: result.status, signal: result.signal, errorCode: result.error?.code ?? null,
            receipt: { status: receipt?.status ?? null, exitCode: receipt?.exitCode ?? null, cleanup: receipt?.cleanup ?? null, rootAbsent },
            phasesComplete, phases,
          };
          fs.writeFileSync(path.join(output, 'safe-summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          process.stdout.write(`${JSON.stringify(summary)}\n`);
          if (!passed) process.exitCode = 1;
          NODE
      - name: Upload independent nested Git diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-nested-git-isolation-windows
          path: ${{ runner.temp }}/diagnostic-nested-git-isolation-windows
          if-no-files-found: warn
          overwrite: true

  candidate-bootstrap:
    name: Candidate bootstrap
    needs: candidate-plan
    if: needs.candidate-plan.outputs.buildr == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate artifact environment
        run: node tools/verification/candidate-environment.ts prepare --profile artifact
      - name: Build the single Candidate artifact
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-artifact-run
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-artifact-macos.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-artifact-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: node test/verification/candidate-ci.ts run artifact-macos
      - name: Upload immutable Candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-package
          path: |
            ${{ runner.temp }}/candidate-package/*.tgz
            ${{ runner.temp }}/candidate-package/release-artifact.json
            ${{ runner.temp }}/candidate-package/npm-pack.json
          if-no-files-found: error
          overwrite: true
      - name: Upload artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-artifact-macos
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-artifact-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-source:
    name: Candidate source (${{ matrix.shard }})
    needs: candidate-plan
    if: needs.candidate-plan.outputs.buildr == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.source) }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate source environment
        run: node tools/verification/candidate-environment.ts prepare --profile ${{ matrix.preparation }}
      - name: Run independent source shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-source
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.shard }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-source-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: node test/verification/candidate-ci.ts run ${{ matrix.shard }}
      - name: Upload source evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-source-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-artifact-consumers:
    name: Candidate artifact (${{ matrix.shard }})
    needs: [candidate-plan, candidate-bootstrap]
    if: needs.candidate-plan.outputs.buildr == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.artifact) }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate artifact consumer environment
        run: node tools/verification/candidate-environment.ts prepare --profile ${{ matrix.preparation }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
      - name: Run artifact consumer shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-consumer
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.shard }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-consumer-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: node test/verification/candidate-ci.ts run ${{ matrix.shard }}
      - name: Upload consumer evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-consumer-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-host-node:
    name: Candidate Host Node (${{ matrix.id }})
    needs: [candidate-plan, candidate-bootstrap]
    if: needs.candidate-plan.outputs.buildr == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.host) }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate Host Node environment
        run: node tools/verification/candidate-environment.ts prepare --profile ${{ matrix.preparation }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
      - name: Verify Host Node tuple against the shared artifact
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-host
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.id }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-host-diagnostics
        run: node test/verification/candidate-ci.ts host ${{ matrix.id }}
      - name: Upload Host Node evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-host-diagnostics
          if-no-files-found: warn
          overwrite: true

  plugin-source-candidate:
    name: Plugin source Candidate
    needs: [candidate-plan, candidate-bootstrap]
    if: always() && needs.candidate-plan.result == 'success' && needs.candidate-plan.outputs.plugin == 'true' && (needs.candidate-plan.outputs.candidate_peer != 'true' || needs.candidate-bootstrap.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/product/services/dsh-plugin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          package-manager-cache: false
      - name: Validate the frozen source and complete difference
        working-directory: projects/product/services/buildr
        run: node tools/release/verify-pr-candidate.ts plan
      - name: Install isolated fixed preparation tooling
        run: |
          mkdir -p "${RUNNER_TEMP}/plugin-tooling"
          : > "${RUNNER_TEMP}/plugin-tooling/user.npmrc"
          : > "${RUNNER_TEMP}/plugin-tooling/global.npmrc"
          cd "${RUNNER_TEMP}/plugin-tooling"
          env -i PATH="${PATH}" NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/plugin-tooling/user.npmrc" NPM_CONFIG_GLOBALCONFIG="${RUNNER_TEMP}/plugin-tooling/global.npmrc" \
            npm install --prefix "${RUNNER_TEMP}/plugin-tooling" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org/ npm@11.5.1 pnpm@11.7.0
      - name: Install locked Buildr CLI development dependencies
        working-directory: projects/product/services/buildr
        run: |
          mkdir -p "${RUNNER_TEMP}/buildr-cli-dependencies"
          : > "${RUNNER_TEMP}/buildr-cli-dependencies/user.npmrc"
          : > "${RUNNER_TEMP}/buildr-cli-dependencies/global.npmrc"
          env -i PATH="${PATH}" NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/buildr-cli-dependencies/user.npmrc" NPM_CONFIG_GLOBALCONFIG="${RUNNER_TEMP}/buildr-cli-dependencies/global.npmrc" \
            node "${RUNNER_TEMP}/plugin-tooling/node_modules/npm/bin/npm-cli.js" ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --cache "${RUNNER_TEMP}/buildr-cli-dependencies/npm-cache"
      - name: Prepare shared release-tool generated test inputs
        working-directory: projects/product/services/buildr
        run: node "${RUNNER_TEMP}/plugin-tooling/node_modules/npm/bin/npm-cli.js" run artifacts:prepare
      - name: Verify shared source-admission release tools
        working-directory: projects/product/services/buildr
        run: |
          node "${RUNNER_TEMP}/plugin-tooling/node_modules/npm/bin/npm-cli.js" run test:integration:candidate:release
          node test/verification/run-node-tests.ts 'test/unit/release-*.test.ts' 'test/unit/package-compatibility.test.ts' 'test/contract/release-*.test.ts' 'test/contract/open-source-release.test.ts' 'test/contract/package-compatibility.test.ts'
      - name: Prepare pinned source SDK
        id: sdk
        run: |
          node tools/prepare-release-sdk.ts --node "$(command -v node)" --pnpm "${RUNNER_TEMP}/plugin-tooling/node_modules/pnpm/bin/pnpm.cjs" > "${RUNNER_TEMP}/plugin-sdk.json"
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.status !== "prepared" || !path.isAbsolute(value.sdk ?? "") || /[\u0000-\u001f\u007f]/.test(value.sdk)) throw new Error("Prepared SDK output missing"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `root=${value.sdk}\n`);' "${RUNNER_TEMP}/plugin-sdk.json"
      - name: Download the joint Buildr Candidate original bytes
        if: needs.candidate-plan.outputs.candidate_peer == 'true'
        uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/joint-buildr-candidate
      - name: Read the joint Candidate integrity
        if: needs.candidate-plan.outputs.candidate_peer == 'true'
        id: joint-peer
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!/^sha512-[A-Za-z0-9+/]{86}==$/.test(value.integrity ?? "")) throw new Error("Candidate integrity missing"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `integrity=${value.integrity}\n`);' "${RUNNER_TEMP}/joint-buildr-candidate/release-artifact.json"
      - name: Observe the joint Candidate Buildr peer
        if: needs.candidate-plan.outputs.candidate_peer == 'true'
        working-directory: projects/product/services/buildr
        env:
          PEER_VERSION: ${{ inputs.buildr_version }}
          PEER_INTEGRITY: ${{ steps.joint-peer.outputs.integrity }}
        run: >-
          node tools/release/package-artifact-observation.ts --package buildr
          --candidate-manifest "${RUNNER_TEMP}/joint-buildr-candidate/release-artifact.json"
          --version "${PEER_VERSION}" --integrity "${PEER_INTEGRITY}"
          --output "${RUNNER_TEMP}/plugin-buildr-peer.json"
      - name: Observe the exact published Buildr peer
        if: needs.candidate-plan.outputs.candidate_peer != 'true'
        working-directory: projects/product/services/buildr
        env:
          PEER_VERSION: ${{ inputs.buildr_peer_version }}
          PEER_INTEGRITY: ${{ inputs.buildr_peer_integrity }}
        run: >-
          node tools/release/package-artifact-observation.ts --package buildr
          --version "${PEER_VERSION}" --integrity "${PEER_INTEGRITY}"
          --tarball "${RUNNER_TEMP}/published-buildr-peer.tgz"
          --output "${RUNNER_TEMP}/plugin-buildr-peer.json"
      - name: Verify complete plugin against the exact peer
        env:
          PLUGIN_SOURCE_SDK: ${{ steps.sdk.outputs.root }}
        run: >-
          node tools/verify-all.ts --source-sdk "${PLUGIN_SOURCE_SDK}"
          --buildr-peer "${RUNNER_TEMP}/plugin-buildr-peer.json"
          --output "${RUNNER_TEMP}/plugin-full-verification.json"
          --npm "${RUNNER_TEMP}/plugin-tooling/node_modules/npm/bin/npm-cli.js"
      - name: Prepare plugin source Candidate bytes
        env:
          PLUGIN_SOURCE_SDK: ${{ steps.sdk.outputs.root }}
        run: node tools/release.ts prepare --source-sdk "${PLUGIN_SOURCE_SDK}"
      - name: Bind full verification to the final source Candidate bytes
        env:
          PLUGIN_VERSION: ${{ needs.candidate-plan.outputs.plugin_version }}
        run: >-
          node tools/bind-buildr-peer.ts
          --candidate "build/release-candidates/${PLUGIN_VERSION}/candidate.json"
          --buildr-peer "${RUNNER_TEMP}/plugin-buildr-peer.json"
          --verification "${RUNNER_TEMP}/plugin-full-verification.json"
          --npm "${RUNNER_TEMP}/plugin-tooling/node_modules/npm/bin/npm-cli.js"
      - name: Bind plugin source-admission aggregate
        working-directory: projects/product/services/buildr
        run: node tools/release/verify-pr-candidate.ts plugin-aggregate
      - name: Upload plugin source Candidate bytes
        uses: actions/upload-artifact@v7
        with:
          name: plugin-candidate-v${{ needs.candidate-plan.outputs.plugin_version }}
          path: |
            projects/product/services/dsh-plugin/build/release-candidates/${{ needs.candidate-plan.outputs.plugin_version }}/candidate.json
            projects/product/services/dsh-plugin/build/release-candidates/${{ needs.candidate-plan.outputs.plugin_version }}/*.tgz
          if-no-files-found: error
      - name: Upload plugin source-admission aggregate
        uses: actions/upload-artifact@v7
        with:
          name: plugin-candidate-aggregate
          path: ${{ runner.temp }}/plugin-candidate-ci-aggregate.json
          if-no-files-found: error

  candidate-gate:
    name: Candidate gate
    if: always() && (!inputs.diagnostic_scope || inputs.diagnostic_scope == 'none') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    needs: [candidate-plan, candidate-bootstrap, candidate-source, candidate-artifact-consumers, candidate-host-node, plugin-source-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          package-manager-cache: false
      - name: Verify existing Candidate for release pull request
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/verify-pr-candidate.ts
      - name: Prepare aggregate evidence directory
        if: (github.event_name == 'workflow_dispatch' || github.head_ref == 'dev') && needs.candidate-plan.outputs.buildr == 'true'
        run: mkdir -p "${{ runner.temp }}/candidate-evidence"
      - name: Download all Candidate evidence
        if: (github.event_name == 'workflow_dispatch' || github.head_ref == 'dev') && needs.candidate-plan.outputs.buildr == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: candidate-evidence-*
          path: ${{ runner.temp }}/candidate-evidence
      - name: Aggregate the closed Candidate evidence set
        if: (github.event_name == 'workflow_dispatch' || github.head_ref == 'dev') && needs.candidate-plan.outputs.buildr == 'true'
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_EVIDENCE_DIR: ${{ runner.temp }}/candidate-evidence
          BUILDR_CANDIDATE_CI_AGGREGATE_OUTPUT: ${{ runner.temp }}/candidate-aggregate/candidate-ci-aggregate.json
        run: node test/verification/candidate-ci.ts aggregate
      - name: Upload aggregate result
        if: always() && (github.event_name == 'workflow_dispatch' || github.head_ref == 'dev') && needs.candidate-plan.outputs.buildr == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-aggregate
          path: ${{ runner.temp }}/candidate-aggregate
          if-no-files-found: warn
          overwrite: true
      - name: Require every selected source Candidate job
        if: github.event_name == 'workflow_dispatch' || github.head_ref == 'dev'
        env:
          PLAN_RESULT: ${{ needs.candidate-plan.result }}
          PLUGIN_REQUIRED: ${{ needs.candidate-plan.outputs.plugin }}
          PLUGIN_RESULT: ${{ needs.plugin-source-candidate.result }}
        run: |
          test "${PLAN_RESULT}" = success
          if [ "${PLUGIN_REQUIRED}" = true ]; then test "${PLUGIN_RESULT}" = success; fi
