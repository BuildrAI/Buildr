name: Verify Buildr

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Candidate execution purpose
        required: true
        default: candidate
        type: choice
        options: [candidate, release-rehearsal]
      expected_source_tree:
        description: Exact source tree required for release rehearsal
        required: false
        type: string
      rehearsal_identity:
        description: Closed release rehearsal identity
        required: false
        type: string
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILDR_CANDIDATE_PURPOSE: ${{ inputs.purpose || 'candidate' }}
  BUILDR_CANDIDATE_EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree || '' }}
  BUILDR_RELEASE_REHEARSAL_IDENTITY: ${{ inputs.rehearsal_identity || '' }}

jobs:
  dev-feedback-macos:
    name: Development feedback (macOS affected and Browser)
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Resolve changed verification base
        id: base
        working-directory: .
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Plan affected Browser evidence
        id: browser
        env:
          BUILDR_VERIFICATION_BASE: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          node test/verification/browser-selector-dispatcher.ts --output "${RUNNER_TEMP}/development-browser-plan.json"
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "selected=" + (plan.status === "selected") + "\n");' "${RUNNER_TEMP}/development-browser-plan.json"
      - name: Install product dependencies
        run: npm ci
      - name: Verify changed product scope
        env:
          BUILDR_TIMING_OUTPUT: ${{ runner.temp }}/development-feedback-timing.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/development-feedback-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci
        shell: bash
        run: npm run test:changed -- --base "${{ steps.base.outputs.sha }}"
      - name: Install Buildr Web dependencies
        if: steps.browser.outputs.selected == 'true'
        working-directory: projects/product/services/buildr-web
        run: npm ci
      - name: Verify affected Browser evidence
        if: steps.browser.outputs.selected == 'true'
        env:
          BUILDR_VERIFICATION_BASE: ${{ steps.base.outputs.sha }}
          BUILDR_BROWSER_PLAN_OUTPUT: ${{ runner.temp }}/development-browser-plan.json
        run: npm run test:browser:changed
      - name: Upload macOS development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-feedback-macos
          path: |
            ${{ runner.temp }}/development-browser-plan.json
            ${{ runner.temp }}/development-feedback-timing.json
            ${{ runner.temp }}/development-feedback-diagnostics
          if-no-files-found: warn
          overwrite: true

  dev-feedback-windows:
    name: Development feedback (Windows platform-sensitive)
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Resolve changed verification base
        id: base
        working-directory: .
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Plan Windows platform-sensitive evidence
        id: windows-plan
        shell: bash
        run: |
          node test/verification/changed.ts --json --development-runner windows --base "${{ steps.base.outputs.sha }}" > "${RUNNER_TEMP}/development-windows-plan.json"
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "selected=" + (plan.steps.length > 0) + "\n");' "${RUNNER_TEMP}/development-windows-plan.json"
      - name: Install product dependencies
        if: steps.windows-plan.outputs.selected == 'true'
        run: npm ci
      - name: Verify Windows platform-sensitive product scope
        if: steps.windows-plan.outputs.selected == 'true'
        env:
          BUILDR_TIMING_OUTPUT: ${{ runner.temp }}/development-windows-timing.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/development-windows-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        shell: bash
        run: npm run test:changed -- --development-runner windows --base "${{ steps.base.outputs.sha }}"
      - name: Upload Windows development evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-feedback-windows
          path: |
            ${{ runner.temp }}/development-windows-plan.json
            ${{ runner.temp }}/development-windows-timing.json
            ${{ runner.temp }}/development-windows-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-plan:
    name: Candidate plan
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.plan.outputs.source }}
      artifact: ${{ steps.plan.outputs.artifact }}
      host: ${{ steps.plan.outputs.host }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          package-manager-cache: false
      - id: plan
        working-directory: projects/product/services/buildr
        run: node test/verification/candidate-ci.ts plan

  candidate-bootstrap:
    name: Candidate bootstrap
    needs: candidate-plan
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate artifact environment
        run: node tools/verification/candidate-environment.ts prepare --profile artifact
      - name: Build the single Candidate artifact
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-artifact-run
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-artifact-macos.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-artifact-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: node test/verification/candidate-ci.ts run artifact-macos
      - name: Upload immutable Candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-package
          path: |
            ${{ runner.temp }}/candidate-package/*.tgz
            ${{ runner.temp }}/candidate-package/release-artifact.json
            ${{ runner.temp }}/candidate-package/npm-pack.json
          if-no-files-found: error
          overwrite: true
      - name: Upload artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-artifact-macos
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-artifact-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-source:
    name: Candidate source (${{ matrix.shard }})
    needs: candidate-plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.source) }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate source environment
        run: node tools/verification/candidate-environment.ts prepare --profile ${{ matrix.preparation }}
      - name: Run independent source shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-source
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.shard }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-source-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: node test/verification/candidate-ci.ts run ${{ matrix.shard }}
      - name: Upload source evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-source-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-artifact-consumers:
    name: Candidate artifact (${{ matrix.shard }})
    needs: [candidate-plan, candidate-bootstrap]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.artifact) }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate artifact consumer environment
        run: node tools/verification/candidate-environment.ts prepare --profile ${{ matrix.preparation }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
      - name: Run artifact consumer shard
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-consumer
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.shard }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-consumer-diagnostics
          BUILDR_VERIFICATION_PROFILE: ci-workspace-limited
        run: node test/verification/candidate-ci.ts run ${{ matrix.shard }}
      - name: Upload consumer evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-consumer-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-host-node:
    name: Candidate Host Node (${{ matrix.id }})
    needs: [candidate-plan, candidate-bootstrap]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate-plan.outputs.host) }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Prepare Candidate Host Node environment
        run: node tools/verification/candidate-environment.ts prepare --profile ${{ matrix.preparation }}
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-package
      - name: Verify Host Node tuple against the shared artifact
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_ARTIFACT_DIR: ${{ runner.temp }}/candidate-package
          BUILDR_CANDIDATE_CI_OUTPUT_DIR: ${{ runner.temp }}/candidate-host
          BUILDR_CANDIDATE_CI_EVIDENCE_OUTPUT: ${{ runner.temp }}/candidate-evidence/candidate-ci-evidence-${{ matrix.id }}.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/candidate-host-diagnostics
        run: node test/verification/candidate-ci.ts host ${{ matrix.id }}
      - name: Upload Host Node evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-evidence-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/candidate-evidence
            ${{ runner.temp }}/candidate-host-diagnostics
          if-no-files-found: warn
          overwrite: true

  candidate-gate:
    name: Candidate gate
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'))
    needs: [candidate-plan, candidate-bootstrap, candidate-source, candidate-artifact-consumers, candidate-host-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: projects/product/.node-version
          package-manager-cache: false
      - name: Prepare aggregate evidence directory
        run: mkdir -p "${{ runner.temp }}/candidate-evidence"
      - name: Download all Candidate evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: candidate-evidence-*
          path: ${{ runner.temp }}/candidate-evidence
      - name: Aggregate the closed Candidate evidence set
        env:
          BUILDR_CANDIDATE_SOURCE_SHA: ${{ env.CANDIDATE_SOURCE_SHA }}
          BUILDR_CANDIDATE_CI_EVIDENCE_DIR: ${{ runner.temp }}/candidate-evidence
          BUILDR_CANDIDATE_CI_AGGREGATE_OUTPUT: ${{ runner.temp }}/candidate-aggregate/candidate-ci-aggregate.json
        run: node test/verification/candidate-ci.ts aggregate
      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-aggregate
          path: ${{ runner.temp }}/candidate-aggregate
          if-no-files-found: warn
          overwrite: true
