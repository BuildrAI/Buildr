# Product verification runs only on the supported desktop runners.
name: Verify Buildr

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BUILDR_NODE_RUNTIME_DATA_DIR: ${{ runner.temp }}/buildr-node-runtime
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [24.15.0, 24.x]
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Install product dependencies
        run: npm ci
      - name: Prepare Codex runtime
        working-directory: .
        shell: bash
        run: projects/product/buildr sync codex --target .
      - name: Resolve verification base
        id: verification-base
        working-directory: .
        shell: bash
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [[ "${GITHUB_REF_NAME:-}" == "main" || "${GITHUB_REF_NAME:-}" == "dev" || ("${GITHUB_HEAD_REF:-}" == "dev" && "${GITHUB_BASE_REF:-}" == "main") ]]; then
            git fetch origin dev --quiet
            release_commit="$(git log origin/dev --format=%H --grep='^chore(release): 准备 ' -1)"
            if [[ -n "$release_commit" ]]; then base="$(git rev-parse "$release_commit^")"; fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Verify final product candidate
        env:
          BUILDR_TIMING_OUTPUT: ${{ runner.temp }}/buildr-verification-timing.json
          BUILDR_DIAGNOSTICS_OUTPUT: ${{ runner.temp }}/buildr-verification-diagnostics
          BUILDR_VERIFICATION_BASE: ${{ steps.verification-base.outputs.base }}
        shell: bash
        run: npm run test:candidate
      - name: Upload verification timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-timing-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/buildr-verification-timing.json
          if-no-files-found: warn
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-diagnostics-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/buildr-verification-diagnostics
          if-no-files-found: ignore

  release-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: projects/product/services/buildr/package-lock.json
      - name: Install product dependencies
        run: npm ci
      - name: Verify packed release lifecycle
        run: npm run test:release
