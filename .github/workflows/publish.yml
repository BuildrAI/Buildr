name: Publish Buildr

run-name: Release ${{ inputs.version }} (${{ inputs.release_id }})

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Unique caller identity for this release transaction
        required: true
        type: string
      version:
        description: Package version without the v prefix
        required: true
        type: string
      source_commit:
        description: Full current origin/main commit to release
        required: true
        type: string
      candidate_base:
        description: Immutable release candidate base commit
        required: true
        type: string
      candidate_tree:
        description: Verified release candidate tree identity
        required: true
        type: string
      workflow_sha256:
        description: SHA-256 of publish.yml at source_commit
        required: true
        type: string
      release_context:
        description: Closed release Task, Candidate, convergence and Environment correlation context
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.contract.outputs.version }}
      npm_tag: ${{ steps.contract.outputs.npm_tag }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      artifact: contract-v${{ inputs.version }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Validate the release transaction correlation context
        env:
          BUILDR_RELEASE_CONTEXT: ${{ inputs.release_context }}
        run: |
          mkdir -p "${RUNNER_TEMP}/contract-input"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.argv[1], `${process.env.BUILDR_RELEASE_CONTEXT}\n`, { mode: 0o600 });' "${RUNNER_TEMP}/contract-input/release-context.json"
          node scripts/release/release-transaction-evidence.mjs validate-context \
            --input "${RUNNER_TEMP}/contract-input/release-context.json" \
            --output "${RUNNER_TEMP}/contract/release-transaction-context.json" \
            --repo ../../../..
      - name: Resolve the npm-only release contract
        id: contract
        run: >-
          node scripts/release/release-contract.mjs "v${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --output "${RUNNER_TEMP}/contract/release-contract.json"
      - name: Confirm the frozen dispatch identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.candidate_tree }}"
          test "${{ steps.contract.outputs.version }}" = "${{ inputs.version }}"
          node --input-type=module -e '
            import fs from "node:fs";
            const context = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (context.convergence.sourceCommit !== process.argv[2] || context.convergence.candidateBase !== process.argv[3] || context.convergence.candidateTree !== process.argv[4]) throw new Error("release transaction context does not match dispatch identity");
          ' "${RUNNER_TEMP}/contract/release-transaction-context.json" "${{ inputs.source_commit }}" "${{ inputs.candidate_base }}" "${{ inputs.candidate_tree }}"
      - name: Freeze release notes
        run: >-
          node scripts/release/release-notes.mjs
          "${{ steps.contract.outputs.version }}"
          ../../../../CHANGELOG.md
          > "${RUNNER_TEMP}/contract/release-notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: contract-v${{ inputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      artifact: npm-candidate-v${{ inputs.version }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.contract.outputs.artifact }}
          path: ${{ runner.temp }}/contract
      - name: Restore the frozen npm candidate from an earlier attempt
        id: restore
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: npm-candidate-v${{ inputs.version }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Validate restored bytes or declare the candidate missing
        id: state
        run: |
          if [ ! -f "${RUNNER_TEMP}/candidate/npm/release-artifact.json" ]; then
            echo "restored=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          node scripts/release/application-payload.mjs verify --payload "${RUNNER_TEMP}/candidate/application-payload" --layout frozen
          node --input-type=module -e '
            import fs from "node:fs";
            import { readReleaseArtifact } from "./scripts/release/release-artifact.mjs";
            const contract = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (payload.sourceCommit !== contract.sourceCommit || payload.buildrVersion !== contract.version || payload.enginesNode !== contract.enginesNode) throw new Error("restored payload does not match release contract");
            readReleaseArtifact(process.argv[3], { packageName: contract.packageName, version: contract.version, applicationPayloadDigest: payload.applicationPayloadDigest });
          ' "${RUNNER_TEMP}/contract/release-contract.json" "${RUNNER_TEMP}/candidate/application-payload/application-payload.json" "${RUNNER_TEMP}/candidate/npm/release-artifact.json"
          echo "restored=true" >> "${GITHUB_OUTPUT}"
      - name: Install locked release tooling
        if: steps.state.outputs.restored != 'true'
        run: |
          npm install --global npm@11.5.1
          npm ci
      - name: Build the application payload exactly once
        if: steps.state.outputs.restored != 'true'
        id: payload
        run: >-
          node scripts/release/application-payload.mjs build
          --output "${RUNNER_TEMP}/candidate/application-payload"
          --source-commit "${{ inputs.source_commit }}"
      - name: Pack the npm tarball exactly once
        if: steps.state.outputs.restored != 'true'
        id: artifact
        run: >-
          node scripts/release/release-artifact.mjs
          --payload "${{ steps.payload.outputs.payload_root }}"
          --output "${RUNNER_TEMP}/candidate/npm"
      - name: Verify npm inventory and immutable bytes
        if: steps.state.outputs.restored != 'true'
        env:
          BUILDR_CANDIDATE_TARBALL: ${{ steps.artifact.outputs.tarball }}
          BUILDR_CANDIDATE_PACK_METADATA: ${{ steps.artifact.outputs.pack_metadata }}
        run: node test/verification/release/open-source-candidate.mjs
      - name: Smoke the same tarball before public writes
        if: steps.state.outputs.restored != 'true'
        env:
          BUILDR_RELEASE_ARTIFACT_MANIFEST: ${{ steps.artifact.outputs.manifest }}
        run: node test/verification/release/release-smoke.mjs
      - name: Freeze the candidate for partial reruns
        if: steps.state.outputs.restored != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: npm-candidate-v${{ inputs.version }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

  host-node:
    needs: [contract, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["24.15.0", "24.x"]
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install checkout verification dependencies
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Verify CLI, Web and Host/Workspace runtime roles from the same tarball
        run: |
          export BUILDR_CANDIDATE_TARBALL="$(find "${RUNNER_TEMP}/candidate/npm" -maxdepth 1 -name '*.tgz' -print -quit)"
          export BUILDR_CANDIDATE_PACK_METADATA="${RUNNER_TEMP}/candidate/npm/npm-pack.json"
          export BUILDR_CANDIDATE_RELEASE_MANIFEST="${RUNNER_TEMP}/candidate/npm/release-artifact.json"
          node test/verification/host-node.mjs

  launcher:
    needs: [contract, candidate]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Verify explicit local Launcher lifecycle from the same tarball
        env:
          BUILDR_RELEASE_ARTIFACT_MANIFEST: ${{ runner.temp }}/candidate/npm/release-artifact.json
        run: node test/verification/release/release-smoke.mjs

  release:
    needs: [contract, candidate, host-node, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm-production
    permissions:
      contents: write
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.contract.outputs.artifact }}
          path: ${{ runner.temp }}/contract
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Revalidate frozen bytes before any public mutation
        run: |
          node scripts/release/application-payload.mjs verify --payload "${RUNNER_TEMP}/candidate/application-payload" --layout frozen
          node --input-type=module -e '
            import fs from "node:fs";
            import { readReleaseArtifact } from "./scripts/release/release-artifact.mjs";
            const contract = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (payload.sourceCommit !== "${{ inputs.source_commit }}") throw new Error("payload source does not match dispatch source");
            readReleaseArtifact(process.argv[3], { packageName: contract.packageName, version: contract.version, applicationPayloadDigest: payload.applicationPayloadDigest });
          ' "${RUNNER_TEMP}/contract/release-contract.json" "${RUNNER_TEMP}/candidate/application-payload/application-payload.json" "${RUNNER_TEMP}/candidate/npm/release-artifact.json"
      - name: Prove current hosted publishing authority without retaining credentials
        run: >-
          node scripts/release/release-authority-oidc-probe.mjs
          --source-commit "${{ inputs.source_commit }}"
          --workflow-sha256 "${{ inputs.workflow_sha256 }}"
          --output "${RUNNER_TEMP}/contract/release-authority.json"
      - name: Recheck final source and authority convergence before tag mutation
        run: >-
          node scripts/release/release-convergence.mjs
          --repo ../../../..
          --version "${{ inputs.version }}"
          --candidate-base "${{ inputs.candidate_base }}"
          --candidate-tree "${{ inputs.candidate_tree }}"
          --stage pre-tag
          --authority-evidence "${RUNNER_TEMP}/contract/release-authority.json"
      - name: Preflight immutable release tag
        run: >-
          node scripts/release/release-tag-ensure.mjs preflight
          "v${{ inputs.version }}"
          "${{ inputs.source_commit }}"
          --repo ../../../..
      - name: Snapshot official Registry artifact and both dist-tags
        id: registry_before
        run: >-
          node scripts/release/registry-version-state.mjs
          "${{ needs.contract.outputs.version }}"
          --manifest "${RUNNER_TEMP}/candidate/npm/release-artifact.json"
          --snapshot-tags "${RUNNER_TEMP}/contract/registry-tags-before.json"
      - name: Create or reuse the immutable release tag
        run: >-
          node scripts/release/release-tag-ensure.mjs ensure
          "v${{ inputs.version }}"
          "${{ inputs.source_commit }}"
          --repo ../../../..
      - name: Preflight GitHub Release metadata without assets or mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/github-release-ensure.mjs preflight
          "v${{ inputs.version }}"
          "${RUNNER_TEMP}/contract/release-notes.md"
          "${{ needs.contract.outputs.prerelease }}"
      - name: Publish the frozen npm tarball
        if: steps.registry_before.outputs.published != 'true'
        run: >-
          node scripts/release/trusted-publish.mjs
          "$(find "${RUNNER_TEMP}/candidate/npm" -maxdepth 1 -name '*.tgz' -print -quit)"
          --access public
          --tag "${{ needs.contract.outputs.npm_tag }}"
      - name: Confirm official Registry integrity and both dist-tags
        run: >-
          node scripts/release/registry-version-state.mjs
          "${{ needs.contract.outputs.version }}"
          --manifest "${RUNNER_TEMP}/candidate/npm/release-artifact.json"
          --tag "${{ needs.contract.outputs.npm_tag }}"
          --before-tags "${RUNNER_TEMP}/contract/registry-tags-before.json"
          --require-published
          --wait
          --output "${RUNNER_TEMP}/contract/registry-release.json"
      - name: Ensure GitHub Release notes without binary Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/github-release-ensure.mjs ensure
          "v${{ inputs.version }}"
          "${RUNNER_TEMP}/contract/release-notes.md"
          "${{ needs.contract.outputs.prerelease }}"
      - name: Smoke exact package from the official Registry
        env:
          BUILDR_RELEASE_PACKAGE_SPEC: "@buildr-ai/buildr@${{ needs.contract.outputs.version }}"
        run: node test/verification/release/release-smoke.mjs
      - name: Finalize correlated release evidence
        if: always()
        run: >-
          node scripts/release/release-transaction-evidence.mjs finalize
          --context "${RUNNER_TEMP}/contract/release-transaction-context.json"
          --output "${RUNNER_TEMP}/contract/release-transaction-evidence.json"
          --outcome "${{ job.status }}"
          --repository "${{ github.repository }}"
          --workflow ".github/workflows/publish.yml"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --head-sha "${{ inputs.source_commit }}"
          --version "${{ needs.contract.outputs.version }}"
          --npm-dist-tag "${{ needs.contract.outputs.npm_tag }}"
          --github-release "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.contract.outputs.version }}"
          --registry-state "${RUNNER_TEMP}/contract/registry-release.json"
          --repo ../../../..
      - name: Upload temporary release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-v${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/contract
            ${{ runner.temp }}/candidate/npm/release-artifact.json
          if-no-files-found: warn
          retention-days: 14
