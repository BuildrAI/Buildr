name: Publish Buildr

run-name: Release ${{ inputs.version }} (${{ inputs.release_id }})

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Unique caller identity for this release transaction
        required: true
        type: string
      version:
        description: Package version without the v prefix
        required: true
        type: string
      source_commit:
        description: Full current origin/main commit to release
        required: true
        type: string
      candidate_base:
        description: Immutable release candidate base commit
        required: true
        type: string
      candidate_tree:
        description: Verified release candidate tree identity
        required: true
        type: string
      workflow_sha256:
        description: SHA-256 of publish.yml at source_commit
        required: true
        type: string
      context_digest:
        description: Frozen buildr.release-context/v1 identity
        required: true
        type: string
      candidate_run_id:
        description: Matching successful Product Candidate workflow run
        required: true
        type: string
      release_context:
        description: Closed shared release context
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.contract.outputs.version }}
      npm_tag: ${{ steps.contract.outputs.npm_tag }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      artifact: contract-v${{ inputs.version }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Validate the release transaction correlation context
        env:
          BUILDR_RELEASE_CONTEXT: ${{ inputs.release_context }}
        run: |
          mkdir -p "${RUNNER_TEMP}/contract-input" "${RUNNER_TEMP}/contract"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.argv[1], `${process.env.BUILDR_RELEASE_CONTEXT}\n`, { mode: 0o600 });' "${RUNNER_TEMP}/contract-input/release-context.json"
          node tools/release/release-readiness.ts validate-context \
            --input "${RUNNER_TEMP}/contract-input/release-context.json" \
            --output "${RUNNER_TEMP}/contract/release-context.json"
      - name: Resolve the npm-only release contract
        id: contract
        run: >-
          node tools/release/release-contract.ts "v${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --output "${RUNNER_TEMP}/contract/release-contract.json"
      - name: Confirm the frozen dispatch identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.candidate_tree }}"
          test "${{ steps.contract.outputs.version }}" = "${{ inputs.version }}"
          node --input-type=module -e '
            import fs from "node:fs";
            const context = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (context.identity !== process.argv[2]) throw new Error("release context digest does not match dispatch input");
            if (context.convergence.mainCommit !== process.argv[3] || context.release.sourceTree !== process.argv[4] || String(context.candidate.runId) !== process.argv[5]) throw new Error("release context does not match dispatch identity");
          ' "${RUNNER_TEMP}/contract/release-context.json" "${{ inputs.context_digest }}" "${{ inputs.source_commit }}" "${{ inputs.candidate_tree }}" "${{ inputs.candidate_run_id }}"
      - name: Freeze release notes
        run: >-
          node tools/release/release-notes.ts
          "${{ steps.contract.outputs.version }}"
          ../../../../CHANGELOG.md
          > "${RUNNER_TEMP}/contract/release-notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: contract-v${{ inputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.contract.outputs.artifact }}
          path: ${{ runner.temp }}/contract
      - name: Download the matching Candidate aggregate
        uses: actions/download-artifact@v7
        with:
          name: candidate-aggregate
          path: ${{ runner.temp }}/candidate-aggregate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download the single frozen Candidate package
        uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Validate matching Candidate aggregate and immutable bytes
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { readReleaseArtifact } from "./tools/release/release-artifact.ts";
            import { releaseContextIdentity } from "./tools/release/release-readiness.ts";
            const context = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const aggregate = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const artifact = readReleaseArtifact(process.argv[3]).manifest;
            if (aggregate.status !== "passed" || aggregate.sourceCommit !== context.candidate.sourceCommit || aggregate.registryIdentity !== context.candidate.registryIdentity) throw new Error("Candidate aggregate does not match frozen release context");
            if (releaseContextIdentity(aggregate) !== context.candidate.aggregateIdentity) throw new Error("Candidate aggregate identity does not match frozen release context");
            for (const field of ["sourceCommit", "filename", "size", "sha256", "integrity", "applicationPayloadDigest"]) if (artifact[field] !== context.artifact[field]) throw new Error(`Candidate artifact ${field} does not match frozen release context`);
          ' "${RUNNER_TEMP}/contract/release-context.json" "${RUNNER_TEMP}/candidate-aggregate/candidate-ci-aggregate.json" "${RUNNER_TEMP}/candidate/release-artifact.json"

  host-node:
    needs: [contract, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["24.15.0", "24.x"]
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install checkout verification dependencies
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify CLI, Web and Host/Workspace runtime roles from the same tarball
        run: |
          export BUILDR_CANDIDATE_TARBALL="$(find "${RUNNER_TEMP}/candidate" -maxdepth 1 -name '*.tgz' -print -quit)"
          export BUILDR_CANDIDATE_PACK_METADATA="${RUNNER_TEMP}/candidate/npm-pack.json"
          export BUILDR_CANDIDATE_RELEASE_MANIFEST="${RUNNER_TEMP}/candidate/release-artifact.json"
          node test/verification/host-node.ts

  launcher:
    needs: [contract, candidate]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify explicit local Launcher lifecycle from the same tarball
        env:
          BUILDR_RELEASE_ARTIFACT_MANIFEST: ${{ runner.temp }}/candidate/release-artifact.json
        run: node test/verification/release/release-smoke.ts

  release:
    needs: [contract, candidate, host-node, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm-production
    permissions:
      contents: write
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.contract.outputs.artifact }}
          path: ${{ runner.temp }}/contract
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Revalidate frozen bytes before any public mutation
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { readReleaseArtifact } from "./tools/release/release-artifact.ts";
            const context = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const artifact = readReleaseArtifact(process.argv[2]).manifest;
            for (const field of ["sourceCommit", "filename", "size", "sha256", "integrity", "applicationPayloadDigest"]) if (artifact[field] !== context.artifact[field]) throw new Error(`Protected transaction artifact ${field} does not match frozen context`);
          ' "${RUNNER_TEMP}/contract/release-context.json" "${RUNNER_TEMP}/candidate/release-artifact.json"
      - name: Prove current hosted publishing authority without retaining credentials
        run: >-
          node tools/release/release-authority-oidc-probe.ts
          --source-commit "${{ inputs.source_commit }}"
          --workflow-sha256 "${{ inputs.workflow_sha256 }}"
          --output "${RUNNER_TEMP}/contract/release-authority.json"
      - name: Recheck final source and authority convergence before tag mutation
        run: |
          node tools/release/release-readiness.ts evaluate --stage pre-tag --input "${RUNNER_TEMP}/contract/release-context.json" --output "${RUNNER_TEMP}/contract/release-readiness-pre-tag.json"
          node tools/release/release-convergence.ts \
            --repo ../../../.. \
            --version "${{ inputs.version }}" \
            --candidate-base "${{ inputs.candidate_base }}" \
            --candidate-tree "${{ inputs.candidate_tree }}" \
            --stage pre-tag \
            --authority-evidence "${RUNNER_TEMP}/contract/release-authority.json"
      - name: Preflight immutable release tag
        run: >-
          node tools/release/release-tag-ensure.ts preflight
          "v${{ inputs.version }}"
          "${{ inputs.source_commit }}"
          --repo ../../../..
      - name: Snapshot official Registry artifact and both dist-tags
        id: registry_before
        run: >-
          node tools/release/registry-version-state.ts
          "${{ needs.contract.outputs.version }}"
          --manifest "${RUNNER_TEMP}/candidate/release-artifact.json"
          --snapshot-tags "${RUNNER_TEMP}/contract/registry-tags-before.json"
      - name: Create or reuse the immutable release tag
        run: >-
          node tools/release/release-tag-ensure.ts ensure
          "v${{ inputs.version }}"
          "${{ inputs.source_commit }}"
          --repo ../../../..
      - name: Preflight GitHub Release metadata without assets or mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/release/github-release-ensure.ts preflight
          "v${{ inputs.version }}"
          "${RUNNER_TEMP}/contract/release-notes.md"
          "${{ needs.contract.outputs.prerelease }}"
      - name: Publish the frozen npm tarball
        if: steps.registry_before.outputs.published != 'true'
        run: >-
          node tools/release/trusted-publish.ts
          "$(find "${RUNNER_TEMP}/candidate" -maxdepth 1 -name '*.tgz' -print -quit)"
          --access public
          --tag "${{ needs.contract.outputs.npm_tag }}"
      - name: Confirm official Registry integrity and both dist-tags
        run: >-
          node tools/release/registry-version-state.ts
          "${{ needs.contract.outputs.version }}"
          --manifest "${RUNNER_TEMP}/candidate/release-artifact.json"
          --tag "${{ needs.contract.outputs.npm_tag }}"
          --before-tags "${RUNNER_TEMP}/contract/registry-tags-before.json"
          --require-published
          --wait
          --output "${RUNNER_TEMP}/contract/registry-release.json"
      - name: Ensure GitHub Release notes without binary Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/release/github-release-ensure.ts ensure
          "v${{ inputs.version }}"
          "${RUNNER_TEMP}/contract/release-notes.md"
          "${{ needs.contract.outputs.prerelease }}"
      - name: Smoke exact package from the official Registry
        env:
          BUILDR_RELEASE_PACKAGE_SPEC: "@buildr-ai/buildr@${{ needs.contract.outputs.version }}"
        run: node test/verification/release/release-smoke.ts
      - name: Finalize correlated release evidence
        if: always()
        run: >-
          node tools/release/release-transaction-evidence.ts finalize
          --context "${RUNNER_TEMP}/contract/release-context.json"
          --output "${RUNNER_TEMP}/contract/release-transaction-evidence.json"
          --outcome "${{ job.status }}"
          --repository "${{ github.repository }}"
          --workflow ".github/workflows/publish.yml"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --head-sha "${{ inputs.source_commit }}"
          --version "${{ needs.contract.outputs.version }}"
          --npm-dist-tag "${{ needs.contract.outputs.npm_tag }}"
          --github-release "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.contract.outputs.version }}"
          --registry-state "${RUNNER_TEMP}/contract/registry-release.json"
          --repo ../../../..
      - name: Upload temporary release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-v${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/contract
            ${{ runner.temp }}/candidate/release-artifact.json
          if-no-files-found: warn
          retention-days: 14
