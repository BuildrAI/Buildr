name: Publish Buildr

run-name: Release ${{ inputs.version }} (${{ inputs.release_id }})

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Unique caller identity for this release transaction
        required: true
        type: string
      version:
        description: Package version without the v prefix
        required: true
        type: string
      source_commit:
        description: Full current origin/main commit to release
        required: true
        type: string
      candidate_base:
        description: Immutable release candidate base commit
        required: true
        type: string
      candidate_tree:
        description: Verified release candidate tree identity
        required: true
        type: string
      workflow_sha256:
        description: SHA-256 of publish.yml at source_commit
        required: true
        type: string
      context_digest:
        description: Frozen buildr.release-context/v1 identity
        required: true
        type: string
      candidate_run_id:
        description: Matching successful Product Candidate workflow run
        required: true
        type: string
      release_context:
        description: Closed shared release context
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.contract.outputs.version }}
      npm_tag: ${{ steps.contract.outputs.npm_tag }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      artifact: contract-v${{ inputs.version }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Validate the release transaction correlation context
        env:
          BUILDR_RELEASE_CONTEXT: ${{ inputs.release_context }}
        run: |
          mkdir -p "${RUNNER_TEMP}/contract-input" "${RUNNER_TEMP}/contract"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.argv[1], `${process.env.BUILDR_RELEASE_CONTEXT}\n`, { mode: 0o600 });' "${RUNNER_TEMP}/contract-input/release-context.json"
          node tools/release/release-readiness.ts validate-context \
            --input "${RUNNER_TEMP}/contract-input/release-context.json" \
            --output "${RUNNER_TEMP}/contract/release-context.json"
      - name: Resolve the npm-only release contract
        id: contract
        run: >-
          node tools/release/release-contract.ts "v${{ inputs.version }}"
          --source-commit "${{ inputs.source_commit }}"
          --output "${RUNNER_TEMP}/contract/release-contract.json"
      - name: Confirm the frozen dispatch identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.candidate_tree }}"
          test "${{ steps.contract.outputs.version }}" = "${{ inputs.version }}"
          node --input-type=module -e '
            import fs from "node:fs";
            const context = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (context.identity !== process.argv[2]) throw new Error("release context digest does not match dispatch input");
            if (context.convergence.mainCommit !== process.argv[3] || context.release.sourceTree !== process.argv[4] || String(context.candidate.runId) !== process.argv[5]) throw new Error("release context does not match dispatch identity");
          ' "${RUNNER_TEMP}/contract/release-context.json" "${{ inputs.context_digest }}" "${{ inputs.source_commit }}" "${{ inputs.candidate_tree }}" "${{ inputs.candidate_run_id }}"
      - name: Freeze release notes
        run: >-
          node tools/release/release-notes.ts
          "${{ steps.contract.outputs.version }}"
          ../../../../CHANGELOG.md
          > "${RUNNER_TEMP}/contract/release-notes.md"
      - uses: actions/upload-artifact@v7
        with:
          name: contract-v${{ inputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
          if-no-files-found: error
          retention-days: 90

  candidate:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.contract.outputs.artifact }}
          path: ${{ runner.temp }}/contract
      - name: Download the matching Candidate aggregate
        uses: actions/download-artifact@v7
        with:
          name: candidate-aggregate
          path: ${{ runner.temp }}/candidate-aggregate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download the single frozen Candidate package
        uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Validate matching Candidate aggregate and immutable bytes
        run: >-
          node tools/release/release-consumption.ts verify
          "${RUNNER_TEMP}/contract/release-context.json"
          "${RUNNER_TEMP}/candidate-aggregate/candidate-ci-aggregate.json"
          "${RUNNER_TEMP}/candidate/release-artifact.json"

  release:
    needs: [contract, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm-production
    permissions:
      contents: write
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: projects/product/services/buildr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Prepare Candidate protected environment
        run: node tools/verification/candidate-environment.ts prepare --profile publisher
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.contract.outputs.artifact }}
          path: ${{ runner.temp }}/contract
      - uses: actions/download-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Publish and recover through the shared release checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/release/release-publication.ts
          "${RUNNER_TEMP}/contract/release-context.json"
          "${RUNNER_TEMP}/candidate/release-artifact.json"
          "${RUNNER_TEMP}/contract"
      - name: Upload temporary release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-v${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/contract
            ${{ runner.temp }}/candidate/release-artifact.json
          if-no-files-found: warn
          retention-days: 90
